schema_version: "3.1.0"
contract_id: "ODCS-BR-CNJ-JUSTICA-ABERTA-001"
source_id: "cnj_justica_aberta"
version: "1.0.0"
name: "CNJ: Justiça Aberta (Cadastro e Produtividade de Cartórios)"
agency: "Conselho Nacional de Justiça (CNJ)"
official_url: "https://www.cnj.jus.br/corregedoria/justica_aberta/"

legal_framework:
  statutes:
    - name: "Lei nº 8.935/1994"
      description: "Regulamenta o art. 236 da Constituição Federal, dispondo sobre serviços notariais e de registro (Lei dos Cartórios)"
    - name: "Lei nº 6.015/1973"
      description: "Dispõe sobre os Registros Públicos no Brasil (Civil de Pessoas Naturais, Pessoas Jurídicas, Títulos e Documentos e Registro de Imóveis)"
    - name: "Lei nº 10.169/2000"
      description: "Estabelece normas gerais para a fixação de emolumentos relativos aos atos praticados pelos serviços notariais e de registro"
    - name: "Provimento CNJ nº 24/2012 e Provimento CNJ nº 149/2023"
      description: "Código Nacional de Normas da Corregedoria Nacional de Justiça (Extrajudicial) e alimentação semestral obrigatória do Justiça Aberta"
    - name: "Decreto nº 8.777/2016"
      description: "Institui a Política de Dados Abertos do Poder Executivo e recomenda transparência ativa institucional"

data_governance:
  grain: "municipio_serventia_extrajudicial_semestre"
  primary_keys:
    - "id_municipio"
    - "sigla_uf"
  reference_date_column: "reference_date"
  min_expected_rows: 5
  max_volume_drop_pct: 15.0
  freshness_sla_hours: 720
  lgpd_tier: "PUBLIC_CORPORATE_QSA"
  ml_feature_domains:
    - "notary_offices"
    - "cartorial_productivity"

schema:
  tables:
    justica_aberta_serventias_cadastro:
      description: "Cadastro municipal de serventias extrajudiciais ativas, provimento por delegatário titular vs. interino e distribuição por especialidade notarial/registral (CNJ Justiça Aberta)"
      grain: "id_municipio, semestre_referencia"
      primary_keys: ["id_municipio", "semestre_referencia"]
      min_expected_rows: 5
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos identificador único do município"
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município"
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla de 2 letras da Unidade Federativa"
        - name: "id_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 2 dígitos da Unidade Federativa"
        - name: "semestre_referencia"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Semestre de referência da prestação semestral no Justiça Aberta (ex.: 2025-S2)"
        - name: "total_serventias_ativas"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade total de serventias extrajudiciais ativas no município"
        - name: "serventias_providas_titular"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Serventias providas por delegatário concursado titular"
        - name: "serventias_vagas_interino"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Serventias vagas atualmente respondidas por interino designado"
        - name: "taxa_provimento_titular_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual de serventias providas por delegatário titular (%)"
        - name: "oficios_registro_imoveis"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de Ofícios de Registro de Imóveis (RI) ativos no município"
        - name: "tabelionatos_notas_protesto"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de Tabelionatos de Notas e de Protesto de Títulos ativos no município"
        - name: "oficios_registro_civil_rcpn"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de Ofícios de Registro Civil das Pessoas Naturais (RCPN) e PJ/Títulos"
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência ISO-8601 da janela semestral apurada"
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp ISO-8601 UTC da extração"

    justica_aberta_produtividade_atribuicao:
      description: "Produtividade semestral por atribuição extrajudicial (Registro de Imóveis, Notas, Protesto e Registro Civil), atos praticados, certidões, eletrônica e prazos"
