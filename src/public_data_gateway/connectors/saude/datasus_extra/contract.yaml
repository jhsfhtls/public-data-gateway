contract_id: ODCS-BR-DATASUS-EXTRA-SIA-SINAN-001
source_id: datasus_extra
version: 1.0.0
grain: 1 row per DATASUS SIA ambulatory procedure group and municipality (SIA/SINAN/SISVAN/PNS)
name: "DATASUS Complementar (SIA, SINAN, SISVAN & PNS): Produção Ambulatorial, Agravos & Nutrição"
agency: Departamento de Informática do SUS (DATASUS / Ministério da Saúde)
official_url: https://datasus.saude.gov.br/
segment_id: 06_saude_publica
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Mensal (SIA Ambulatorial & SISVAN) / Semanal (SINAN Agravos) / Periódica (PNS)
freshness_sla_hours: 720
cron_schedule_expression: "0 4 12 * *"
lgpd_legal_basis: public_interest_lei_8080_1990_sus_vigilancia_epidemiologica_anonimizada
min_expected_rows: 10
primary_keys:
  - cod_atendimento_sia
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_atendimento_sia
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único do agrupamento municipal de produção ambulatorial SIA/SUS
  - name: grupo_procedimento_sia
    data_type: STRING
    required: true
    nullable: false
    description: Grupo de procedimento SIA/SUS (ATENCAO_BASICA_APAC, ONCOLOGIA_ALTA_COMPLEXIDADE, DIAGNOSTICO_IMAGEM, TERAPIA_RENAL_SUBSTITUTIVA)
  - name: agravo_notificacao_sinan
    data_type: STRING
    required: true
    nullable: false
    description: Agravo de notificação compulsória monitorado no SINAN (DENGUE_ARBOVIROSE, SINDROME_RESPIRATORIA_SRAG, ACIDENTES_TRABALHO, DOENCAS_CRONICAS)
  - name: situacao_vigilancia_sus
    data_type: STRING
    required: true
    nullable: false
    description: Classificação operacional da vigilância e atenção SUS (COBERTURA_ADEQUADA, ALERTA_EPIDEMIOLOGICO, EXPANSAO_AMBULATORIAL)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município sede do atendimento SUS
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: producao_ambulatorial_sia_12m
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade anual de atendimentos e procedimentos aprovados no SIA/SUS nos últimos 12 meses
  - name: notificacoes_sinan_12m
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade anual de notificações registradas no SINAN nos últimos 12 meses
  - name: valor_aprovado_sia_mil_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Valor financeiro aprovado de repasse SIA/SUS em milhares de reais (R$ mil)
