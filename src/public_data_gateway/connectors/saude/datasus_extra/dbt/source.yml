          external_location: "data/datasus_extra/silver/datasus_sinan_agravos_notificacao.parquet"
      - name: datasus_sisvan_pns_nutricao
        description: "Cobertura nutricional SISVAN na Atenção Primária, prevalência de obesidade PNS e acompanhamento de crônicas"
