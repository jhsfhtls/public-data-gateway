          external_location: "data/datasus_extra/silver/datasus_sisvan_pns_nutricao.parquet"
      - name: datasus_extra_resumo_municipal
        description: "Consolidado municipal SIA/SINAN/SISVAN de atendimentos ambulatoriais per capita e repasses SUS"
