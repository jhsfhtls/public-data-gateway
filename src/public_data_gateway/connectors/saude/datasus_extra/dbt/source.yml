          external_location: "data/datasus_extra/silver/datasus_sia_producao_ambulatorial.parquet"
      - name: datasus_sinan_agravos_notificacao
        description: "Notificações compulsórias de arboviroses, síndromes respiratórias SRAG e oportunidade de encerramento no SINAN"
