version: 2

sources:
  - name: datasus_extra
    description: "Tabelas Silver DATASUS Complementar (SIA/SUS, SINAN, SISVAN e PNS): Produção Ambulatorial, Agravos e Vigilância Nutricional"
    meta:
      agency: "DATASUS / Ministério da Saúde"
      domain: "saude_publica_ambulatorial_vigilancia"
      freshness_sla: "Mensal (720h)"
    tables:
      - name: datasus_sia_producao_ambulatorial
        description: "Produção ambulatorial aprovada no SIA/SUS, repasses APAC e agravos associados por grupo de procedimento"
