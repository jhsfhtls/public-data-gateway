contract_id: ODCS-BR-ANS-SAUDE-SUPLEMENTAR-001
source_id: ans_saude_suplementar
version: 1.0.0
grain: 1 row per private health plan segmentation line and municipality (ANS)
name: "ANS Saúde Suplementar: Beneficiários, Operadoras, IDSS & Sinistralidade"
agency: Agência Nacional de Saúde Suplementar (ANS)
official_url: https://dadosabertos.ans.gov.br/FTP/PDA/
segment_id: 06_saude_publica
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Mensal (SIB Beneficiários) & Trimestral (DIOPS Sinistralidade & IDSS)
freshness_sla_hours: 720
cron_schedule_expression: "0 8 10 * *"
lgpd_legal_basis: public_interest_lei_9656_1998_lei_9961_2000_ans_e_lai
min_expected_rows: 10
primary_keys:
  - cod_cobertura_ans
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_cobertura_ans
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único do agrupamento municipal de beneficiários na ANS por segmentação
  - name: segmentacao_assistencial
    data_type: STRING
    required: true
    nullable: false
    description: Segmentação do plano privado (ASSISTENCIA_MEDICA_HOSPITALAR ou EXCLUSIVAMENTE_ODONTOLOGICO)
  - name: contratacao_tipo
    data_type: STRING
    required: true
    nullable: false
    description: Modalidade de contratação predominante (COLETIVO_EMPRESARIAL ou INDIVIDUAL_FAMILIAR)
  - name: situacao_registro_ans
    data_type: STRING
    required: true
    nullable: false
    description: Status regulatório predominante das operadoras atuantes (OPERADORA_ATIVA_REGULAR ou REGIME_DIRECAO_FISCAL)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município de residência do beneficiário
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: beneficiarios_ativos_count
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade de vínculos ativos no Sistema de Informações de Beneficiários (SIB/ANS)
  - name: taxa_cobertura_privada_pct
    data_type: FLOAT64
    required: true
    nullable: false
    description: Percentual da população municipal coberta pelo segmento suplementar (%)
  - name: competencia_ans
    data_type: STRING
    required: true
    nullable: false
    description: Competência mensal de apuração SIB/ANS (YYYY-MM)
