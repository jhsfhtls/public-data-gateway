    sinasc_condicoes_vitalidade_recem_nascido:
      description: "Indicadores de risco perinatal e vitalidade neonatal no SINASC: baixo peso (<2.500 g), prematuridade (<37 semanas), Apgar no 5º minuto adequado (7-10) e anomalias congênitas"
