version: 2

models:
  - name: stg_sinasc_nascidos_vivos_municipio
    description: "Visão padronizada dos nascidos vivos, taxa bruta de natalidade e via de parto hospitalar e cesárea no SINASC por município."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests:
          - not_null
          - unique
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da Unidade Federativa."
        tests:
          - not_null
      - name: ano_referencia
        description: "Ano epidemiológico de referência das Declarações de Nascido Vivo (DNV)."
        tests:
          - not_null
      - name: total_nascidos_vivos
        description: "Total de nascidos vivos por residência materna registrados no SINASC."
        tests:
          - not_null
      - name: taxa_bruta_natalidade_1000_hab
        description: "Taxa bruta de natalidade por 1.000 habitantes residentes."
        tests:
          - not_null
      - name: nascidos_vivos_hospitalares
        description: "Quantidade de nascidos vivos com parto ocorrido em estabelecimento hospitalar."
        tests:
          - not_null
      - name: proporcao_partos_hospitalares_pct
        description: "Percentual de partos realizados em ambiente hospitalar (%)."
        tests:
          - not_null
      - name: nascidos_vivos_parto_cesareo
        description: "Quantidade de nascidos vivos por via de parto cesáreo."
        tests:
          - not_null
      - name: proporcao_partos_cesareos_pct
        description: "Percentual de nascidos vivos por parto cesáreo no município (%)."
        tests:
          - not_null
      - name: source_url
        description: "URL oficial DataSUS SINASC."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601 da extração."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

  - name: stg_sinasc_assistencia_prenatal_parto
    description: "Visão padronizada da estratificação municipal dos nascidos vivos por faixa de consultas pré-natal e início oportuno."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests:
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da Unidade Federativa."
        tests:
          - not_null
      - name: ano_referencia
        description: "Ano epidemiológico de referência do SINASC."
        tests:
          - not_null
      - name: faixa_assistencia_prenatal
        description: "Faixa padronizada de consultas pré-natal realizadas pela gestante."
        tests:
          - not_null
      - name: nascidos_vivos_faixa
        description: "Quantidade de nascidos vivos registrados na faixa de assistência pré-natal."
        tests:
          - not_null
      - name: participacao_faixa_prenatal_pct
        description: "Participação percentual da faixa sobre o total de nascidos vivos municipais (%)."
        tests:
          - not_null
      - name: inicio_prenatal_primeiro_trimestre_pct
        description: "Percentual de gestantes na faixa com início oportuno do pré-natal no 1º trimestre (%)."
        tests:
          - not_null
      - name: proporcao_cesarea_faixa_pct
        description: "Proporção de partos cesáreos registrada na faixa pré-natal (%)."
        tests:
          - not_null
      - name: idade_media_materna_faixa_anos
        description: "Idade média das mães na faixa de consultas pré-natal (anos)."
        tests:
          - not_null
      - name: source_url
        description: "URL oficial DataSUS SINASC."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601 da extração."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

  - name: stg_sinasc_perfil_materno_demografico
