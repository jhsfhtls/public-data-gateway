schema_version: "3.1.0"
contract_id: "ODCS-BR-ANVISA-CMED-001"
source_id: "anvisa_cmed"
version: "1.0.0"
name: "ANVISA: Câmara de Regulação do Mercado de Medicamentos (CMED)"
agency: "Agência Nacional de Vigilância Sanitária (ANVISA) / Secretaria-Executiva da CMED"
official_url: "https://www.gov.br/anvisa/pt-br/assuntos/medicamentos/cmed/precos"

legal_framework:
  statutes:
    - name: "Lei nº 10.742/2003"
      description: "Define normas de regulação para o setor farmacêutico, cria a Câmara de Regulação do Mercado de Medicamentos (CMED) e institui regras de PF, PMC e PMVG"
    - name: "Lei nº 9.782/1999"
      description: "Define o Sistema Nacional de Vigilância Sanitária e cria a Agência Nacional de Vigilância Sanitária (ANVISA)"
    - name: "Resolução CMED nº 2/2004"
      description: "Aprova critérios para definição de preços de produtos novos e novas apresentações medicamentosas sujeitas ao teto CMED"
    - name: "Comunicado CMED nº 3/2020 e Resolução CMED nº 3/2011"
      description: "Estabelece o Coeficiente de Adequação de Preços (CAP) sobre o Preço Máximo de Venda ao Governo (PMVG) e regimes tributários PIS/COFINS"

data_governance:
  grain: "municipio_polo_farmaceutico_cmed"
  primary_keys:
    - "id_municipio"
    - "sigla_uf"
    - "cnpj_14"
  reference_date_column: "reference_date"
  min_expected_rows: 10
  max_volume_drop_pct: 15.0
  freshness_sla_hours: 720
  lgpd_tier: "PUBLIC_NON_PERSONAL"
  ml_feature_domains:
    - "regulated_drug_prices"
    - "maximum_consumer_price"

schema:
  tables:
    cmed_apresentacoes_registradas_municipio:
      description: "Inventário regulatório de apresentações medicamentosas ativas na tabela CMED por município sede de polo farmacêutico e laboratório âncora"
      grain: "id_municipio, ano_mes_competencia"
      primary_keys: ["id_municipio", "ano_mes_competencia"]
      min_expected_rows: 12
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos identificador do município"
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município"
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla de 2 letras da Unidade Federativa"
        - name: "id_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 2 dígitos da Unidade Federativa"
        - name: "ano_mes_competencia"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Competência mensal da lista CMED no formato AAAAMM"
        - name: "cnpj_14"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "CNPJ de 14 dígitos do laboratório ou polo detentor de referência no município"
        - name: "laboratorio_detentor_referencia"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Razão social resumida do laboratório ou centro detentor de referência na lista CMED"
        - name: "total_apresentacoes_ativas_cmed"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Total de apresentações medicamentosas com preço regulado ativo na lista CMED"
        - name: "apresentacoes_genericos"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de apresentações classificadas como medicamentos genéricos"
        - name: "apresentacoes_similares"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de apresentações classificadas como medicamentos similares"
        - name: "apresentacoes_referencia_novos_biologicos"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de apresentações de referência, medicamentos novos e produtos biológicos"
        - name: "participacao_genericos_similares_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Participação percentual combinada de medicamentos genéricos e similares no total de apresentações (%)"
        - name: "apresentacoes_tarja_vermelha_preta_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual de apresentações sob prescrição obrigatória (tarja vermelha ou preta) (%)"
        - name: "apresentacoes_hospitalares_restritas_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual de apresentações de uso restrito hospitalar com PF vedado ao varejo PMC (%)"
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência ISO-8601 da apuração CMED"
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp UTC ISO-8601 da extração"

