        - name: "cep_8"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "CEP de 8 dígitos da unidade hospitalar de referência"
        - name: "total_estabelecimentos_ativos"
          data_type: "integer"
          required: true
          nullable: false
