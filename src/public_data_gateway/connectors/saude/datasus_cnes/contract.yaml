        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla de 2 letras da Unidade Federativa"
        - name: "ano_mes_competencia"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Competência mensal de referência no formato AAAAMM"
        - name: "total_leitos_hospitalares"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Total de leitos hospitalares de internação e complementares instalados"
        - name: "leitos_sus"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de leitos hospitalares disponíveis ao Sistema Único de Saúde"
        - name: "leitos_nao_sus"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de leitos hospitalares destinados à saúde suplementar e particular"
        - name: "total_leitos_uti"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Total de leitos de Unidade de Terapia Intensiva (UTI) habilitados"
        - name: "leitos_uti_adulto"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de leitos de UTI adulto (tipos I, II e III)"
        - name: "leitos_uti_pediatrico_neonatal"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de leitos de UTI pediátrica e neonatal"
        - name: "leitos_uti_sus"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de leitos de UTI vinculados ao atendimento SUS"
        - name: "leitos_por_1000_hab"
          data_type: "double"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Taxa de leitos hospitalares gerais por 1.000 habitantes"
        - name: "leitos_uti_por_10k_hab"
          data_type: "double"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Taxa de leitos de UTI por 10.000 habitantes"
        - name: "source_url"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "URL oficial do portal DataSUS CNES consultado"
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência ISO-8601"
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp ISO-8601 UTC da extração"

    cnes_equipamentos_diagnostico:
      description: "Parque de equipamentos médicos de alta e média complexidade em uso (tomógrafos, ressonância magnética, mamógrafos, hemodiálise e raio-X) por município"
