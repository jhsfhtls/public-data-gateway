        - name: "total_leitos_uti"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Total de leitos de UTI habilitados"
        - name: "leitos_por_1000_hab"
          data_type: "double"
          required: true
          nullable: false
