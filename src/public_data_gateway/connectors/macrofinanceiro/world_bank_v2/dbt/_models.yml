version: 2

models:
  - name: stg_world_bank_v2_indicators
    description: "Staging view for World Bank v2 macroeconomic and development indicators."
    columns:
      - name: country_iso3
        description: "ISO-3 country code (e.g., BRA)."
        tests:
          - not_null
      - name: indicator_id
        description: "World Bank indicator code (e.g., NY.GDP.MKTP.KD.ZG)."
        tests:
          - not_null
      - name: year
        description: "Reference calendar year."
        tests:
          - not_null
      - name: value
        description: "Numeric indicator value."
        tests:
          - not_null
      - name: extracted_at
        description: "UTC ISO-8601 extraction timestamp."

  - name: fct_world_bank_macro_brasil
    description: "Intradomain fact table of World Bank macroeconomic indicators."
    columns:
      - name: country_iso3
        description: "ISO-3 country code."
        tests:
          - not_null
      - name: indicator_id
        description: "World Bank indicator code."
        tests:
          - not_null
      - name: year
        description: "Reference calendar year."
        tests:
          - not_null
      - name: value
        description: "Numeric indicator value."
        tests:
          - not_null
      - name: extracted_at
        description: "UTC ISO-8601 extraction timestamp."
