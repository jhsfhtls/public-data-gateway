contract_id: ODCS-BR-BCB-ESTBAN-001
source_id: bcb_estban
version: 1.0.0
grain: 1 row per Brazilian municipality per monthly ESTBAN COSIF balance sheet reference date
name: "Banco Central: Estatística Bancária Mensal por Município (ESTBAN COSIF)"
agency: Banco Central do Brasil (BACEN)
official_url: https://www.bcb.gov.br/estatisticas/estatisticabancariamunicipios
segment_id: 02_economico_macrofinanceiro
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Mensal
freshness_sla_hours: 720
cron_schedule_expression: "0 6 20 * *"
lgpd_legal_basis: public_interest_lai_resolucao_cmn_4911_2021
min_expected_rows: 10
primary_keys:
  - id_municipio
  - sigla_uf
  - data_base_yyyymm
canonical_keys:
  - id_municipio
  - sigla_uf
  - cnpj_14
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município brasileiro
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa do município
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município consolidado no ESTBAN
  - name: data_base_yyyymm
    data_type: STRING
    required: true
    nullable: false
    description: Data-base mensal de competência contábil COSIF (YYYYMM)
  - name: qtd_instituicoes_atuantes
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade de conglomerados financeiros com agências operando no município
  - name: qtd_agencias_ativas
    data_type: INT64
    required: true
    nullable: false
    description: Número total de agências bancárias ativas reportando balancete ESTBAN no município
  - name: ativo_total_agencias_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Volume agregado do Ativo Circulante e Realizável a Longo Prazo das agências em BRL
  - name: operacoes_credito_total_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Saldo total da carteira de operações de crédito alocada nas agências do município em BRL
  - name: depositos_totais_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Soma dos depósitos à vista, poupança, a prazo e de entes públicos captados localmente em BRL
  - name: relacao_credito_deposito_pct
    data_type: FLOAT64
    required: true
    nullable: false
    description: Razão percentual entre operações de crédito concedidas e depósitos captados no município (%)
  - name: indice_concentracao_hhi_local
    data_type: FLOAT64
    required: true
    nullable: false
    description: Índice Herfindahl-Hirschman (HHI de 0 a 10000) de concentração bancária municipal
