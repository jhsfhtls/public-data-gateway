version: 2

models:
  - name: stg_estban_balancete_municipal
    description: "Staging view do balancete mensal COSIF ESTBAN agregado por município."
    columns:
      - name: id_municipio
        description: "Código IBGE canônico de 7 dígitos do município."
        tests: [not_null, unique]
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: data_base_yyyymm
        description: "Data-base mensal de competência contábil COSIF (YYYYMM)."
        tests: [not_null]
      - name: qtd_instituicoes_atuantes
        description: "Quantidade de instituições financeiras com agências operando no município."
        tests: [not_null]
      - name: qtd_agencias_ativas
        description: "Número total de agências bancárias ativas no município."
        tests: [not_null]
      - name: ativo_total_agencias_brl
        description: "Ativo total agregado das agências bancárias municipais em BRL."
        tests: [not_null]
      - name: operacoes_credito_total_brl
        description: "Volume total da carteira de operações de crédito no município em BRL."
        tests: [not_null]
      - name: depositos_totais_brl
        description: "Saldo total de depósitos captados pelas agências no município em BRL."
        tests: [not_null]
      - name: relacao_credito_deposito_pct
        description: "Relação crédito sobre depósitos locais (Loan-to-Deposit Ratio em %)."
        tests: [not_null]
      - name: indice_concentracao_hhi_local
        description: "Índice Herfindahl-Hirschman (HHI) de concentração bancária no município."
        tests: [not_null]

  - name: stg_estban_carteira_credito_setorial
    description: "Staging view da abertura setorial da carteira de crédito municipal ESTBAN."
    columns:
      - name: id_municipio
        description: "Código IBGE canônico de 7 dígitos do município."
        tests: [not_null, unique]
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: data_base_yyyymm
        description: "Data-base mensal de competência contábil COSIF (YYYYMM)."
        tests: [not_null]
      - name: emprestimos_titulos_descontados_brl
        description: "Saldo em empréstimos e títulos descontados em BRL."
        tests: [not_null]
      - name: financiamentos_gerais_brl
        description: "Saldo em financiamentos gerais (capital de giro e investimento) em BRL."
        tests: [not_null]
      - name: financiamento_agropecuario_rural_brl
        description: "Saldo em financiamentos rurais e agropecuários no município em BRL."
        tests: [not_null]
      - name: financiamento_imobiliario_habitacional_brl
        description: "Saldo em financiamentos imobiliários e habitacionais no município em BRL."
        tests: [not_null]
      - name: provisao_credito_liquidacao_duvidosa_brl
        description: "Provisão para créditos de liquidação duvidosa (PCLD) contabilizada nas agências em BRL."
        tests: [not_null]
      - name: taxa_provisao_inadimplencia_pct
        description: "Percentual de provisão PCLD sobre a carteira de crédito local (%)."
        tests: [not_null]

  - name: stg_estban_captacoes_depositos
    description: "Staging view das captações e depósitos bancários municipais ESTBAN."
    columns:
      - name: id_municipio
        description: "Código IBGE canônico de 7 dígitos do município."
        tests: [not_null, unique]
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: data_base_yyyymm
        description: "Data-base mensal de competência contábil COSIF (YYYYMM)."
        tests: [not_null]
      - name: depositos_vista_brl
        description: "Saldo em depósitos à vista nas agências do município em BRL."
        tests: [not_null]
      - name: depositos_poupanca_brl
        description: "Saldo em caderneta de poupança nas agências do município em BRL."
        tests: [not_null]
      - name: depositos_prazo_cdb_rdb_brl
        description: "Saldo em depósitos a prazo (CDB/RDB) captados localmente em BRL."
        tests: [not_null]
      - name: depositos_governo_publico_brl
        description: "Saldo em depósitos de governos e administração pública em BRL."
        tests: [not_null]
      - name: liquidez_imediata_caixa_brl
        description: "Disponibilidades de caixa imediata das agências locais em BRL."
        tests: [not_null]

  - name: stg_estban_instituicoes_municipio
    description: "Staging view detalhada por instituição financeira atuante em cada município no ESTBAN."
    columns:
      - name: id_registro_estban
        description: "Identificador único composto do registro instituição x município x data-base."
        tests: [not_null, unique]
      - name: id_municipio
        description: "Código IBGE canônico de 7 dígitos do município."
        tests: [not_null]
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: cnpj_8_if
        description: "CNPJ raiz de 8 dígitos da instituição financeira."
        tests: [not_null]
      - name: cnpj_14
        description: "CNPJ matriz normalizado de 14 dígitos da instituição financeira."
        tests: [not_null]
      - name: nome_instituicao
        description: "Razão social da instituição financeira reportante no ESTBAN."
        tests: [not_null]
      - name: qtd_agencias_municipio
        description: "Quantidade de agências da instituição no município."
        tests: [not_null]
      - name: saldo_credito_if_municipio_brl
        description: "Saldo de crédito concedido pela instituição no município em BRL."
        tests: [not_null]
      - name: saldo_depositos_if_municipio_brl
        description: "Saldo de depósitos captados pela instituição no município em BRL."
        tests: [not_null]
      - name: share_credito_local_pct
        description: "Participação percentual da instituição no crédito total do município (%)."
        tests: [not_null]

  - name: fct_estatistica_bancaria_estban_municipal
    description: "Tabela fato consolidada da Estatística Bancária Mensal por Município (ESTBAN COSIF) unindo balancete, crédito setorial, depósitos e concentração local."
    columns:
      - name: id_municipio
        description: "Código IBGE canônico de 7 dígitos do município."
        tests: [not_null, unique]
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: data_base_yyyymm
        description: "Data-base mensal COSIF de consolidação (YYYYMM)."
        tests: [not_null]
      - name: qtd_instituicoes_atuantes
        description: "Quantidade de instituições financeiras operantes no município."
        tests: [not_null]
      - name: qtd_agencias_ativas
        description: "Quantidade total de agências bancárias ativas."
        tests: [not_null]
      - name: ativo_total_agencias_brl
        description: "Ativo total agregado das agências locais em BRL."
        tests: [not_null]
      - name: operacoes_credito_total_brl
        description: "Volume total da carteira de crédito municipal em BRL."
        tests: [not_null]
      - name: depositos_totais_brl
        description: "Volume total de depósitos captados no município em BRL."
        tests: [not_null]
      - name: relacao_credito_deposito_pct
        description: "Razão percentual entre crédito concedido e depósitos captados (%)."
        tests: [not_null]
      - name: indice_concentracao_hhi_local
        description: "Índice Herfindahl-Hirschman (HHI) de concentração bancária municipal."
        tests: [not_null]
      - name: emprestimos_titulos_descontados_brl
        description: "Saldo em empréstimos e títulos descontados em BRL."
        tests: [not_null]
      - name: financiamentos_gerais_brl
        description: "Saldo em financiamentos gerais em BRL."
        tests: [not_null]
      - name: financiamento_agropecuario_rural_brl
        description: "Saldo em financiamentos agropecuários e rurais em BRL."
        tests: [not_null]
      - name: financiamento_imobiliario_habitacional_brl
        description: "Saldo em financiamentos imobiliários e habitacionais em BRL."
        tests: [not_null]
      - name: provisao_credito_liquidacao_duvidosa_brl
        description: "Provisão para créditos de liquidação duvidosa (PCLD) em BRL."
        tests: [not_null]
      - name: taxa_provisao_inadimplencia_pct
        description: "Taxa de provisão PCLD sobre a carteira de crédito local (%)."
        tests: [not_null]
      - name: depositos_vista_brl
        description: "Depósitos à vista locais em BRL."
        tests: [not_null]
      - name: depositos_poupanca_brl
        description: "Depósitos em poupança locais em BRL."
        tests: [not_null]
      - name: depositos_prazo_cdb_rdb_brl
        description: "Depósitos a prazo CDB/RDB locais em BRL."
        tests: [not_null]
      - name: depositos_governo_publico_brl
        description: "Depósitos de governos e setor público locais em BRL."
        tests: [not_null]
      - name: liquidez_imediata_caixa_brl
        description: "Caixa e disponibilidades imediatas locais em BRL."
        tests: [not_null]
      - name: qtd_bancos_lideres_amostra
        description: "Quantidade de bancos líderes detalhados na amostra ESTBAN municipal."
        tests: [not_null]
      - name: top2_concentracao_credito_pct
        description: "Participação somada dos dois maiores bancos no crédito local (%)."
        tests: [not_null]
