contract_id: ODCS-BR-RFB-ARRECADACAO-TRIBUTOS-001
source_id: rfb_arrecadacao
version: 1.0.0
grain: 1 row per RFB federal tax collection track and municipality
name: "RFB Arrecadação Tributária & Fiscal (IRPJ, CSLL, IPI, PIS/COFINS & Dívida Ativa)"
agency: Receita Federal do Brasil (RFB) & PGFN
official_url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos/receitadata/arrecadacao/arrecadacao-por-estado
segment_id: 02_economico_macrofinanceiro
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Mensal (Arrecadação RFB / FPM / PGFN)
freshness_sla_hours: 720
cron_schedule_expression: "0 5 18 * *"
lgpd_legal_basis: public_interest_ctn_art_198_transparencia_arrecadacao_rfb_pgfn
min_expected_rows: 10
primary_keys:
  - cod_arrecadacao_rfb
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_arrecadacao_rfb
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único consolidado do bloco de arrecadação federal administrada pela RFB
  - name: grupo_tributo_rfb
    data_type: STRING
    required: true
    nullable: false
    description: Grupo de tributos federais administrados (IRPJ_CSLL_LUCRO, PIS_COFINS_FATURAMENTO, IPI_PREVIDENCIA_PATRONAL)
  - name: regime_recolhimento
    data_type: STRING
    required: true
    nullable: false
    description: Regime predominante de apuração tributária (LUCRO_REAL_TRIBUTADO, LUCRO_PRESUMIDO_SIMPLES, TRIBUTACAO_SELETIVA_IPI)
  - name: situacao_regularidade_fiscal
    data_type: STRING
    required: true
    nullable: false
    description: Status de adimplência e estoque PGFN (REGULARIDADE_FISCAL_ALTA, MONITORAMENTO_DEBITOS_ATIVA, ALERTA_INADIMPLENCIA_PGFN)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município polo arrecadador
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: arrecadacao_federal_anual_mi_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Montante anual arrecadado no bloco tributário federal vinculado ao município (R$ milhões)
  - name: contribuintes_pj_ativos_municipio
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade de pessoas jurídicas contribuintes com movimentação fiscal regular ativa no município
  - name: inscritos_divida_ativa_pgfn_mi_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Estoque de débitos inscritos em Dívida Ativa da União (PGFN) atribuídos ao polo municipal (R$ milhões)
