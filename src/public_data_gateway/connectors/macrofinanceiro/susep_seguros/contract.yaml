contract_id: ODCS-BR-SUSEP-SEGUROS-SES-001
source_id: susep_seguros
version: 1.0.0
grain: 1 row per SUSEP insurance line segment and municipality (SES Estatísticas)
name: "SUSEP Mercado Segurador (SES): Prêmios Emitidos, Sinistralidade, Previdência & Solvência"
agency: Superintendência de Seguros Privados (SUSEP / Ministério da Fazenda)
official_url: https://www2.susep.gov.br/menuestatistica/SES/principal.aspx
segment_id: 02_economico_macrofinanceiro
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Mensal (SES Prêmios, Sinistros & VGBL/PGBL) / Trimestral (Solvência)
freshness_sla_hours: 720
cron_schedule_expression: "0 8 15 * *"
lgpd_legal_basis: public_interest_dl_73_1966_lei_complementar_126_2007_supervisao_susep
min_expected_rows: 10
primary_keys:
  - cod_registro_susep
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_registro_susep
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único consolidado do segmento segurador municipal no SES/SUSEP
  - name: grupo_ramo_seguro
    data_type: STRING
    required: true
    nullable: false
    description: Grupo de ramos de seguro (AUTO_PATRIMONIAL, VIDA_PESSOAS, RESIDENCIAL_EMPRESARIAL, RURAL_AGRICOLA, TRANSPORTE_CARGA, GARANTIA_CREDITO)
  - name: porte_mercado_segurador
    data_type: STRING
    required: true
    nullable: false
    description: Classificação operacional SUSEP (SEGURADORA_TIERS_1, PREVIDENCIA_VGBL_PGBL, CAPITALIZACAO)
  - name: situacao_solvencia_pl
    data_type: STRING
    required: true
    nullable: false
    description: Status prudencial de solvência e cobertura de provisões técnicas SUSEP (PATRIMONIO_LIQUIDO_SOLVENTE, MARGEM_MONITORADA)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município polo de emissão/arrecadação
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: premio_direto_anual_mil_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Volume anual de prêmios diretos emitidos em milhares de reais (R$ mil)
  - name: sinistro_retido_anual_mil_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Volume anual de sinistros retidos/ocorridos em milhares de reais (R$ mil)
  - name: indice_sinistralidade_pct
    data_type: FLOAT64
    required: true
    nullable: false
    description: Razão percentual de sinistralidade apurada entre sinistros e prêmios ganhos (%)
