version: 2

models:
  - name: stg_cvm_cia_aberta
    description: "Visão tipada do cadastro oficial de companhias abertas da CVM."
    columns:
      - name: codigo_cvm
        description: "Código identificador numérico da companhia perante a CVM."
        tests:
          - not_null
          - unique
      - name: cnpj_14
        description: "Cadastro Nacional da Pessoa Jurídica com 14 dígitos."
        tests:
          - not_null
      - name: cnpj_raiz
        description: "Raiz do CNPJ da companhia (8 primeiros dígitos)."
        tests:
          - not_null
      - name: razao_social
        description: "Razão social oficial arquivada na CVM."
        tests:
          - not_null
      - name: nome_comercial
        description: "Nome comercial ou de fantasia da companhia."
      - name: setor_atividade
        description: "Classificação setorial da companhia perante a CVM."
        tests:
          - not_null
      - name: categoria_registro
        description: "Categoria de registro da companhia aberta (CATEGORIA_A ou CATEGORIA_B)."
        tests:
          - not_null
          - accepted_values:
              values: ['CATEGORIA_A', 'CATEGORIA_B']
      - name: situacao_registro
        description: "Situação cadastral do registro na CVM."
        tests:
          - not_null
          - accepted_values:
              values: ['ATIVO', 'CANCELADO', 'SUSPENSO']
      - name: data_registro_cvm
        description: "Data em que a companhia obteve seu registro inicial na CVM."
        tests:
          - not_null
      - name: data_constituicao
        description: "Data de constituição jurídica da companhia."
      - name: tipo_mercado
        description: "Segmento de mercado de negociação principal (BOLSA, BALCAO_ORGANIZADO)."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla da Unidade Federativa da sede social da empresa."
        tests:
          - not_null
      - name: id_municipio_ibge
        description: "Código IBGE de 7 dígitos do município da sede social."
      - name: ingestion_timestamp
        description: "Timestamp ISO de ingestão do registro no Lakehouse."
        tests:
          - not_null

  - name: stg_cvm_balanco_ativo
    description: "Visão tipada do Balanço Patrimonial Ativo (BPA) padronizado da CVM."
    columns:
      - name: id_demonstracao
        description: "Identificador unívoco do balanço ativo por empresa, ano e tipo."
        tests:
          - not_null
          - unique
      - name: codigo_cvm
        description: "Código identificador numérico da companhia perante a CVM."
        tests:
          - not_null
      - name: cnpj_14
        description: "Cadastro Nacional da Pessoa Jurídica da companhia emissora."
        tests:
          - not_null
      - name: ano_exercicio
        description: "Ano contábil de exercício da demonstração financeira."
        tests:
          - not_null
      - name: data_referencia
        description: "Data de encerramento do exercício social ou do trimestre."
        tests:
          - not_null
      - name: tipo_demonstracao
        description: "Tipo de consolidação das demonstrações (CONSOLIDADO ou INDIVIDUAL)."
        tests:
          - not_null
          - accepted_values:
              values: ['CONSOLIDADO', 'INDIVIDUAL']
      - name: versao_documento
        description: "Número da versão do documento contábil arquivado na CVM."
        tests:
          - not_null
      - name: ativo_total
        description: "Valor monetário do Ativo Total da companhia."
        tests:
          - not_null
      - name: ativo_circulante
        description: "Ativo Circulante realizável no curto prazo."
        tests:
          - not_null
      - name: caixa_equivalentes
        description: "Saldo de caixa e equivalentes de caixa de alta liquidez."
        tests:
          - not_null
      - name: aplicacoes_financeiras
        description: "Aplicações financeiras e títulos negociáveis de curto prazo."
        tests:
          - not_null
      - name: contas_a_receber
        description: "Valores a receber de clientes e duplicatas a receber."
        tests:
          - not_null
      - name: estoques
        description: "Valor contábil de estoques de insumos e produtos acabados."
        tests:
          - not_null
      - name: ativo_nao_circulante
        description: "Ativo Não Circulante realizável a longo prazo."
        tests:
          - not_null
      - name: imobilizado
        description: "Ativo imobilizado corpóreo de produção e operação."
        tests:
          - not_null
      - name: intangivel
        description: "Ativo intangível, marcas, patentes e ágio por rentabilidade futura."
        tests:
          - not_null
      - name: ingestion_timestamp
        description: "Timestamp ISO de ingestão do registro no Lakehouse."
        tests:
          - not_null

