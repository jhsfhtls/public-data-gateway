          - not_null
      - name: passivo_total
        description: "Valor total do Passivo exigível somado ao Patrimônio Líquido."
        tests:
          - not_null
      - name: passivo_circulante
        description: "Obrigações exigíveis no curto prazo (até 12 meses)."
        tests:
          - not_null
      - name: fornecedores
        description: "Obrigações comerciais com fornecedores de mercadorias e serviços."
        tests:
          - not_null
      - name: emprestimos_financiamentos_cp
        description: "Empréstimos e financiamentos bancários de curto prazo."
        tests:
          - not_null
      - name: passivo_nao_circulante
        description: "Exigível a longo prazo (superior a 12 meses)."
        tests:
          - not_null
      - name: emprestimos_financiamentos_lp
        description: "Dívida bancária e debêntures exigíveis a longo prazo."
        tests:
          - not_null
      - name: patrimonio_liquido
        description: "Patrimônio Líquido atribuível aos acionistas da companhia."
        tests:
          - not_null
      - name: capital_social_integralizado
        description: "Capital social realizado e subscrito da companhia."
        tests:
          - not_null
      - name: reservas_lucros
        description: "Reservas de lucros, retenções e lucros/prejuízos acumulados."
        tests:
          - not_null
      - name: ingestion_timestamp
        description: "Timestamp ISO de ingestão do registro no Lakehouse."
        tests:
          - not_null

