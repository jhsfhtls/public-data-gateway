contract_id: ODCS-BR-BNDES-OPERACOES-TRANSPARENCIA-001
source_id: bndes_operacoes
version: 1.0.0
grain: 1 row per BNDES financing modality and municipality
name: "BNDES Transparência: Operações Diretas, Indiretas & Fomento Municipal"
agency: Banco Nacional de Desenvolvimento Econômico e Social (BNDES)
official_url: https://dadosabertos.bndes.gov.br/
segment_id: 02_economico_macrofinanceiro
access_mode: LAKEHOUSE_BATCH
protocol: REST_JSON
auth_type: NONE
update_frequency: Trimestral (Carteira de Operações Contratadas & Desembolsos BNDES)
freshness_sla_hours: 720
cron_schedule_expression: "0 6 15 * *"
lgpd_legal_basis: public_interest_lei_12527_2011_lai_e_transparencia_bndes
min_expected_rows: 10
primary_keys:
  - cod_operacao_bndes
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_operacao_bndes
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único do agrupamento de operações de crédito BNDES por modalidade e município
  - name: modalidade_apoio_bndes
    data_type: STRING
    required: true
    nullable: false
    description: Modalidade de apoio financeiro BNDES (OPERACAO_DIRETA_FINEM ou OPERACAO_INDIRETA_AUTOMATICA)
  - name: setor_cnae_fomento
    data_type: STRING
    required: true
    nullable: false
    description: Macro-setor CNAE destinatário predominante (INFRAESTRUTURA_LOGISTICA, INDUSTRIA_INOVACAO ou ENERGIA_RENOVAVEL)
  - name: instrumento_financeiro
    data_type: STRING
    required: true
    nullable: false
    description: Linha ou fundo financeiro utilizado no contrato (BNDES_FINEM, BNDES_AUTOMATICO ou FUNDO_CLIMA)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município beneficiário
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: qtd_operacoes_contratadas
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade de operações e subcréditos contratados no agrupamento municipal
  - name: valor_contratado_bndes_mil_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Valor total contratado pelo BNDES no agrupamento no município (R$ mil)
  - name: prazo_medio_amortizacao_meses
    data_type: INT64
    required: true
    nullable: false
    description: Prazo médio ponderado de amortização das operações contratadas (meses)
