contract_id: ODCS-BR-RFB-CNO-001
source_id: rfb_cno
version: 1.0.0
grain: 1 row per registered civil construction work in Receita Federal CNO
name: "Receita Federal: Cadastro Nacional de Obras (CNO — Construção Civil & Infraestrutura)"
agency: Secretaria Especial da Receita Federal do Brasil (RFB)
official_url: https://www.gov.br/receitafederal/pt-br/assuntos/orientacao-tributaria/cadastros/cno
segment_id: 01_b2b_empresarial
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Mensal
freshness_sla_hours: 720
cron_schedule_expression: "0 5 18 * *"
lgpd_legal_basis: public_interest_lai_in_rfb_2061_2021
min_expected_rows: 10
primary_keys:
  - inscricao_cno
  - id_municipio
  - sigla_uf
canonical_keys:
  - cnpj_14
  - cpf_masked
  - id_municipio
  - sigla_uf
  - cnae_7
  - cep_8
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: inscricao_cno
    data_type: STRING
    required: true
    nullable: false
    description: Número de inscrição único de 12 dígitos da obra no Cadastro Nacional de Obras (CNO/RFB)
  - name: documento_responsavel
    data_type: STRING
    required: true
    nullable: false
    description: CNPJ de 14 dígitos da construtora/incorporadora ou CPF mascarado LGPD do proprietário
  - name: qualificacao_responsavel
    data_type: STRING
    required: true
    nullable: false
    description: Vínculo jurídico do responsável (Construtora Empreiteira Total, Incorporadora ou Proprietário)
  - name: nome_responsavel
    data_type: STRING
    required: true
    nullable: false
    description: Razão social ou nome público do responsável principal cadastrado no CNO
  - name: nome_empresarial_obra
    data_type: STRING
    required: true
    nullable: false
    description: Denominação ou título descritivo do empreendimento/obra civil registrada
  - name: situacao_cno
    data_type: STRING
    required: true
    nullable: false
    description: Situação cadastral da obra na RFB (Ativa, Paralisada, Suspensa ou Encerrada)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município onde a obra está localizada
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa da obra
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município de execução da obra
  - name: cep_8
    data_type: STRING
    required: true
    nullable: false
    description: CEP postal normalizado com 8 dígitos do canteiro de obras
  - name: cnae_7_obra
    data_type: STRING
    required: true
    nullable: false
    description: Código CNAE subclasse 2.0 de 7 dígitos da atividade principal da construção civil
  - name: area_total_m2
    data_type: FLOAT64
    required: true
    nullable: false
    description: Área total da edificação ou obra civil averbada no CNO em metros quadrados (m²)
  - name: unidade_medida
    data_type: STRING
    required: true
    nullable: false
    description: Unidade de medida declarada na inscrição CNO (m², km ou unid)
  - name: data_inicio_obra
    data_type: STRING
    required: true
    nullable: false
    description: Data oficial de início da execução da obra civil (YYYY-MM-DD)
  - name: data_situacao
    data_type: STRING
    required: true
    nullable: false
    description: Data da última alteração de situação cadastral registrada na RFB (YYYY-MM-DD)
