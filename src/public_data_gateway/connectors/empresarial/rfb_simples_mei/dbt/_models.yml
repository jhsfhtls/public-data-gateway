version: 2

models:
  - name: stg_rfb_simples_nacional
    description: "Visão padronizada de dados cadastrais e histórico de enquadramento no Simples Nacional por raiz de CNPJ (8D)."
    columns:
      - name: cnpj_basico
        description: "Raiz do CNPJ com 8 dígitos canônicos da entidade jurídica."
        tests:
          - not_null
      - name: opcao_simples
        description: "Indicador oficial de opção pelo Simples Nacional (S para Sim, N para Não)."
        tests:
          - not_null
          - accepted_values:
              values: ['S', 'N']
      - name: data_opcao_simples
        description: "Data canônica de início dos efeitos da opção pelo Simples Nacional (AAAA-MM-DD)."
      - name: data_exclusao_simples
        description: "Data de exclusão dos efeitos do Simples Nacional ou NULL para optantes ativos."
      - name: motivo_exclusao_simples
        description: "Motivo e fundamentação legal da exclusão do regime do Simples Nacional."
      - name: status_simples_atual
        description: "Classificação consolidada do status tributário atual (OPTANTE, EXCLUIDO, NAO_OPTANTE)."
        tests:
          - not_null
          - accepted_values:
              values: ['OPTANTE', 'EXCLUIDO', 'NAO_OPTANTE']

  - name: stg_rfb_simei
    description: "Visão padronizada de enquadramento e desenquadramento no SIMEI (Microempreendedor Individual) por CNPJ básico."
    columns:
      - name: cnpj_basico
        description: "Raiz do CNPJ com 8 dígitos canônicos da entidade jurídica."
        tests:
          - not_null
      - name: opcao_simei
        description: "Indicador oficial de enquadramento no SIMEI como MEI (S para Sim, N para Não)."
        tests:
          - not_null
          - accepted_values:
              values: ['S', 'N']
      - name: data_opcao_simei
        description: "Data canônica de início do enquadramento no SIMEI (AAAA-MM-DD)."
      - name: data_exclusao_simei
        description: "Data de desenquadramento do SIMEI ou NULL para MEIs ativos."
      - name: motivo_desenquadramento_simei
        description: "Motivo legal do desenquadramento do SIMEI (faturamento, admissão de empregados ou sócios)."
      - name: status_simei_atual
        description: "Classificação consolidada do status atual no SIMEI (ENQUADRADO, DESENQUADRADO, NAO_ENQUADRADO)."
        tests:
          - not_null
          - accepted_values:
              values: ['ENQUADRADO', 'DESENQUADRADO', 'NAO_ENQUADRADO']

  - name: stg_rfb_simples_sublimites
    description: "Tabela oficial de sublimites estaduais para apuração de ICMS e ISS no âmbito do Simples Nacional."
    columns:
      - name: ano_calendario
        description: "Ano-calendário de vigência fiscal do sublimite estadual."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla oficial de 2 letras maiúsculas da Unidade Federativa."
        tests:
          - not_null
      - name: sublimite_icms_iss_anual
        description: "Valor anual em R$ do sublimite estadual (R$ 3.600.000,00 ou R$ 4.800.000,00)."
        tests:
          - not_null
      - name: adotou_sublimite_diferenciado
        description: "Flag booleano que indica se o estado adotou sublimite diferenciado reduzido."
        tests:
          - not_null
      - name: base_legal_portaria
        description: "Resolução ou Portaria CGSN que fixou o sublimite para o respectivo ano."
        tests:
          - not_null

  - name: stg_rfb_simples_eventos
    description: "Catálogo oficial de eventos tributários de inclusão, alteração, exclusão e desenquadramento da LC 123/2006."
    columns:
      - name: codigo_evento
        description: "Identificador canônico do evento tributário do Simples Nacional ou SIMEI."
        tests:
          - not_null
          - unique
      - name: regime_afetado
        description: "Regime tributário sobre o qual incide o evento (SIMPLES_NACIONAL ou SIMEI)."
        tests:
          - not_null
      - name: tipo_evento
        description: "Categoria operacional do evento (INCLUSAO, EXCLUSAO, DESENQUADRAMENTO, ALTERACAO)."
        tests:
          - not_null
      - name: descricao_evento
        description: "Descrição detalhada do fato gerador do evento de enquadramento tributário."
        tests:
          - not_null
      - name: motivo_legal
        description: "Artigo e parágrafo correspondente da Lei Complementar nº 123/2006."
        tests:
          - not_null

  - name: stg_rfb_simples_anexos
    description: "Tabelas de alíquotas nominais, faixas progressivas e parcelas a deduzir dos Anexos I a V da LC 123/2006."
    columns:
      - name: codigo_anexo
        description: "Código do anexo da Lei Complementar nº 123/2006 (ANEXO_I a ANEXO_V)."
        tests:
          - not_null
      - name: descricao_anexo
        description: "Descrição da atividade econômica ou setor do anexo (Comércio, Indústria, Serviços)."
        tests:
          - not_null
      - name: faixa_faturamento
        description: "Número da faixa de faturamento de 1 a 6 na apuração progressiva do Simples."
        tests:
          - not_null
      - name: receita_bruta_acumulada_min
        description: "Limite inferior de receita bruta acumulada em 12 meses em R$."
        tests:
          - not_null
      - name: receita_bruta_acumulada_max
        description: "Limite superior de receita bruta acumulada em 12 meses em R$."
        tests:
          - not_null
      - name: aliquota_nominal_pct
        description: "Alíquota nominal percentual aplicável à respectiva faixa de receita bruta."
        tests:
          - not_null
      - name: parcela_a_deduzir_reais
        description: "Parcela a deduzir em R$ para apuração da alíquota efetiva progressiva."
        tests:
          - not_null
