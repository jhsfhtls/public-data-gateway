contract_id: "ODCS-BR-SUFRAMA-PIM-001"
source_id: "suframa_pim_zfm"
version: "1.0.0"
grain: "One row per corporate entity registered and incentivized under SUFRAMA (ZFM / ALC)"
primary_keys:
  - "numero_inscricao_suframa"
canonical_keys:
  - "cnpj_14"
  - "numero_inscricao_suframa"
  - "sigla_uf"
reference_date_column: "data_inscricao"
lgpd_legal_basis: "Decreto-Lei nº 288/1967, Lei nº 8.387/1991, Art. 40 do ADCT da CF/88 e Art. 7º, § 3º e 4º da Lei nº 13.709/2018 (LGPD - Transparência Ativa de Benefícios e Isenções Fiscais Governamentais)"
min_expected_rows: 5
max_volume_drop_pct: 1.0
sentinel_values:
  - "-1"
  - "99"
  - "999"
  - "SEM INFORMACAO"
  - "IGNORADO"
  - "N/A"
  - "-"
columns:
  - name: "numero_inscricao_suframa"
    data_type: "string"
    required: true
    is_primary_key: true
    description: "Número oficial de Inscrição SUFRAMA da empresa cadastrada no Polo Industrial de Manaus ou ALC"
  - name: "cnpj_14"
    data_type: "string"
    required: true
    description: "CNPJ canônico com 14 dígitos numéricos do estabelecimento produtor"
  - name: "cnpj_raiz"
    data_type: "string"
    required: true
    description: "Radical de 8 dígitos do CNPJ para consolidação de grupo econômico"
  - name: "razao_social"
    data_type: "string"
    required: true
    description: "Razão social oficial da pessoa jurídica incentivada"
  - name: "nome_fantasia"
    data_type: "string"
    required: false
    description: "Nome comercial ou de fantasia da empresa no cadastro da SUFRAMA"
  - name: "situacao_cadastral"
    data_type: "string"
    required: true
    description: "Situação cadastral perante a SUFRAMA: ATIVA, CANCELADA, BLOQUEADA ou SUSPENSA"
  - name: "data_inscricao"
    data_type: "date"
    required: true
    description: "Data em que o cadastro na autarquia federal foi formalizado"
  - name: "data_validade_cadastro"
    data_type: "date"
    required: true
    description: "Data limite de renovação do cadastro de benefícios perante a SUFRAMA"
  - name: "tipo_estabelecimento"
    data_type: "string"
    required: true
    description: "Classificação do estabelecimento: MATRIZ ou FILIAL"
  - name: "tipo_area_incentivada"
    data_type: "string"
    required: true
    description: "Classificação geográfica do regime fiscal: ZONA_FRANCA_MANAUS, AMAZONIA_OCIDENTAL ou AREA_LIVRE_COMERCIO"
  - name: "codigo_area_suframa"
    data_type: "string"
    required: true
    description: "Código da área de incentivo: ZFM, ALC_TABATINGA, ALC_GUAJARA_MIRIM, ALC_MACAPA_SANTANA, ALC_BOA_VISTA"
  - name: "id_municipio_ibge"
    data_type: "string"
    required: true
    description: "Código IBGE de 7 dígitos do município da planta fabril ou comercial"
  - name: "sigla_uf"
    data_type: "string"
    required: true
    description: "Sigla da Unidade Federativa da planta (AM, AC, RO, RR, AP)"
  - name: "subsetor_industrial"
    data_type: "string"
    required: true
    description: "Segmento de atividade fabril predominante conforme classificação da SUFRAMA"
