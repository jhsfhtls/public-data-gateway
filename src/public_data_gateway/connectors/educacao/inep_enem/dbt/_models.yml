      - name: id_municipio
        description: "Código IBGE de 7 dígitos identificador único do município."
        tests:
          - not_null
          - unique
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da Unidade Federativa."
        tests:
          - not_null
      - name: regiao
        description: "Grande região geográfica brasileira segundo o IBGE."
        tests:
          - not_null
      - name: ano_edicao_enem
        description: "Ano de aplicação da edição oficial do ENEM."
        tests:
          - not_null
      - name: nota_media_redacao_enem
        description: "Nota média municipal obtida na prova de Redação (escala de 0 a 1000)."
        tests:
          - not_null
      - name: nota_media_comp1_norma_padrao
        description: "Nota média municipal na Competência I (domínio da norma padrão da Língua Portuguesa)."
        tests:
          - not_null
      - name: nota_media_comp3_argumentacao
        description: "Nota média municipal na Competência III (seleção e organização argumentativa)."
        tests:
          - not_null
      - name: nota_media_comp5_proposta_intervencao
        description: "Nota média municipal na Competência V (proposta de intervenção)."
        tests:
          - not_null
      - name: redacoes_nota_900_mais_ano
        description: "Quantidade absoluta de redações no município com nota >= 900 pontos."
        tests:
          - not_null
      - name: proporcao_redacao_900_mais_pct
        description: "Percentual de participantes presentes com nota >= 900 na Redação (%)."
        tests:
          - not_null
      - name: taxa_redacao_zero_ou_anulada_pct
        description: "Percentual de provas de Redação zeradas ou anuladas (%)."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601 da divulgação dos microdados do ENEM."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

  - name: stg_enem_equidade_socioeconomica_acesso
    description: "Visão de staging tipada para equidade socioeconômica QSE, internet Q025 e elegibilidade SiSU/ProUni/FIES no ENEM."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos identificador único do município."
        tests:
          - not_null
          - unique
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da Unidade Federativa."
        tests:
          - not_null
      - name: regiao
        description: "Grande região geográfica brasileira segundo o IBGE."
        tests:
          - not_null
      - name: ano_edicao_enem
        description: "Ano de aplicação da edição oficial do ENEM."
        tests:
          - not_null
      - name: proporcao_isencao_taxa_inscricao_pct
        description: "Percentual de inscritos beneficiados com isenção da taxa de inscrição (%)."
        tests:
          - not_null
      - name: proporcao_concluintes_escola_publica_pct
        description: "Participação percentual de estudantes concluintes ou egressos da rede pública (%)."
        tests:
          - not_null
      - name: acesso_internet_domiciliar_q025_pct
        description: "Percentual de participantes com acesso domiciliar à internet declarado no QSE Q025 (%)."
        tests:
          - not_null
      - name: gap_nota_objetiva_privada_vs_publica_pts
        description: "Diferença em pontos TRI nas provas objetivas entre rede privada e rede estadual pública."
        tests:
          - not_null
      - name: razao_equidade_publica_privada_enem
        description: "Razão entre a média objetiva da rede estadual pública e da rede privada (0 a 1)."
        tests:
          - not_null
      - name: aptos_sisu_prouni_fies_nota_450_pct
        description: "Percentual de presentes elegíveis a SiSU/ProUni/FIES (média >= 450 e redação > 0) (%)."
        tests:
          - not_null
      - name: indice_paridade_socioeconomica_qse
        description: "Índice sintético de paridade socioeconômica QSE entre estratos de renda (0 a 1)."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601 da divulgação dos microdados do ENEM."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null
