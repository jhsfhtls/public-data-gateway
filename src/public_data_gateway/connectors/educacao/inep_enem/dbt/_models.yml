version: 2

models:
  - name: stg_enem_desempenho_municipal_areas
    description: "Visão de staging tipada para o desempenho municipal por área de conhecimento TRI e presença nos 2 dias do ENEM."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos identificador único do município."
        tests:
          - not_null
          - unique
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da Unidade Federativa."
        tests:
          - not_null
      - name: regiao
        description: "Grande região geográfica brasileira segundo o IBGE."
        tests:
          - not_null
      - name: ano_edicao_enem
        description: "Ano de aplicação da edição oficial do ENEM."
        tests:
          - not_null
      - name: inscritos_confirmados_enem_ano
        description: "Total municipal de participantes com inscrição confirmada na edição do ENEM."
        tests:
          - not_null
      - name: participantes_presentes_2dias_ano
        description: "Participantes que compareceram às provas nos dois dias de aplicação do exame."
        tests:
          - not_null
      - name: taxa_presenca_efetiva_2dias_pct
        description: "Taxa percentual de presença efetiva nos dois dias de prova em relação aos inscritos (%)."
        tests:
          - not_null
      - name: nota_media_linguagens_codigos_lc
        description: "Nota média municipal TRI em Linguagens, Códigos e suas Tecnologias (LC)."
        tests:
          - not_null
      - name: nota_media_ciencias_humanas_ch
        description: "Nota média municipal TRI em Ciências Humanas e suas Tecnologias (CH)."
        tests:
          - not_null
      - name: nota_media_ciencias_natureza_cn
        description: "Nota média municipal TRI em Ciências da Natureza e suas Tecnologias (CN)."
        tests:
          - not_null
      - name: nota_media_matematica_mt
        description: "Nota média municipal TRI em Matemática e suas Tecnologias (MT)."
        tests:
          - not_null
      - name: nota_media_objetivas_tri_geral
        description: "Média aritmética municipal das quatro áreas objetivas avaliadas pela TRI."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601 da divulgação dos microdados do ENEM."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

  - name: stg_enem_desempenho_rede_ensino
    description: "Visão de staging tipada para o desempenho municipal no ENEM por dependência administrativa escolar."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos identificador único do município."
        tests:
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da Unidade Federativa."
        tests:
          - not_null
      - name: regiao
        description: "Grande região geográfica brasileira segundo o IBGE."
        tests:
          - not_null
      - name: ano_edicao_enem
        description: "Ano de aplicação da edição oficial do ENEM."
        tests:
          - not_null
      - name: dependencia_administrativa_escola
        description: "Dependência administrativa da escola informada no ENEM (Federal, Estadual, Privada ou EJA)."
        tests:
          - not_null
      - name: categoria_escola_enem
        description: "Categoria analítica padronizada da rede escolar."
        tests:
          - not_null
      - name: concluintes_participantes_rede
        description: "Número de concluintes ou participantes presentes vinculados à respectiva dependência."
        tests:
          - not_null
      - name: nota_media_objetivas_rede
        description: "Média geral nas provas objetivas TRI para os participantes desta rede."
        tests:
          - not_null
      - name: nota_media_matematica_rede
        description: "Média TRI em Matemática para os participantes desta rede de ensino."
        tests:
          - not_null
      - name: nota_media_redacao_rede
        description: "Nota média na prova de Redação entre participantes desta rede de ensino."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601 da divulgação dos microdados do ENEM."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

  - name: stg_enem_redacao_competencias_municipio
