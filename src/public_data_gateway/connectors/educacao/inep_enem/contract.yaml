schema_version: "3.1.0"
contract_id: "ODCS-BR-INEP-ENEM-001"
source_id: "inep_enem"
version: "1.0.0"
name: "INEP: Microdados do Exame Nacional do Ensino Médio (ENEM)"
agency: "Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira (INEP)"
official_url: "https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/enem"

legal_framework:
  statutes:
    - name: "Lei nº 9.394/1996 (LDB)"
      description: "Lei de Diretrizes e Bases da Educação Nacional que orienta a avaliação nacional do ensino médio e o acesso ao ensino superior"
    - name: "Portaria MEC nº 438/1998"
      description: "Institui o Exame Nacional do Ensino Médio (ENEM) como instrumento de avaliação de competências e habilidades dos concluintes"
    - name: "Lei nº 12.711/2012 (Lei de Cotas / SiSU)"
      description: "Dispõe sobre o ingresso nas universidades federais e instituições federais de ensino técnico via políticas afirmativas e nota ENEM"
    - name: "Lei nº 13.709/2018 (LGPD)"
      description: "Regula a anonimização e proteção de microdados educacionais e socioeconômicos de participantes do ENEM"
    - name: "Decreto nº 8.777/2016"
      description: "Institui a Política de Dados Abertos do Poder Executivo Federal aplicável aos microdados públicos do INEP"

data_governance:
  grain: "municipio_desempenho_equidade_enem"
  primary_keys:
    - "id_municipio"
    - "sigla_uf"
  reference_date_column: "reference_date"
  min_expected_rows: 10
  max_volume_drop_pct: 15.0
  freshness_sla_hours: 720
  lgpd_tier: "ANONYMIZED_MICRODATA"
  ml_feature_domains:
    - "exam_performance"
    - "socioeconomic_test_scores"

schema:
  tables:
    enem_desempenho_municipal_areas:
      description: "Desempenho municipal consolidado no ENEM nas quatro áreas de conhecimento TRI (Linguagens, Humanas, Natureza e Matemática), inscritos confirmados e taxa de presença nos 2 dias."
      grain: "id_municipio, ano_edicao_enem"
      primary_keys: ["id_municipio", "ano_edicao_enem"]
      min_expected_rows: 12
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos identificador único do município."
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município."
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla de 2 letras da Unidade Federativa."
        - name: "id_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 2 dígitos da Unidade Federativa."
        - name: "regiao"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Grande região geográfica brasileira segundo o IBGE."
        - name: "ano_edicao_enem"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Ano de aplicação da edição oficial do ENEM."
        - name: "inscritos_confirmados_enem_ano"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Total municipal de participantes com inscrição confirmada na edição do ENEM."
        - name: "participantes_presentes_2dias_ano"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Participantes que compareceram às provas nos dois dias de aplicação do exame."
        - name: "taxa_presenca_efetiva_2dias_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Taxa percentual de presença efetiva nos dois dias de prova em relação aos inscritos (%)."
        - name: "nota_media_linguagens_codigos_lc"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nota média municipal TRI em Linguagens, Códigos e suas Tecnologias (LC)."
        - name: "nota_media_ciencias_humanas_ch"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nota média municipal TRI em Ciências Humanas e suas Tecnologias (CH)."
        - name: "nota_media_ciencias_natureza_cn"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nota média municipal TRI em Ciências da Natureza e suas Tecnologias (CN)."
        - name: "nota_media_matematica_mt"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nota média municipal TRI em Matemática e suas Tecnologias (MT)."
        - name: "nota_media_objetivas_tri_geral"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Média aritmética municipal das quatro áreas objetivas avaliadas pela TRI."
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência ISO-8601 da divulgação dos microdados do ENEM."
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp ISO-8601 UTC da extração."

    enem_desempenho_rede_ensino:
      description: "Desempenho no ENEM desagregado por dependência administrativa da escola de conclusão do ensino médio (Federal, Estadual, Privada e EJA/Demais)."
