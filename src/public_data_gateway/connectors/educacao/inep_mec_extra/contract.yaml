contract_id: ODCS-BR-INEP-MEC-EXTRA-SAEB-FUNDEB-001
source_id: inep_mec_extra
version: 1.0.0
grain: 1 row per INEP SAEB / MEC education evaluation track and municipality (SAEB, PROUNI, SISU, FUNDEB, CNPq)
name: "INEP/MEC Complementar (SAEB, PROUNI, SISU, FUNDEB & CNPq): Proficiência, Acesso & Fomento"
agency: INEP / FNDE / Ministério da Educação (MEC) & CNPq
official_url: https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados
segment_id: 07_educacao_capital_humano
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Bienal (SAEB) / Semestral (PROUNI & SISU) / Mensal (FUNDEB & CNPq)
freshness_sla_hours: 720
cron_schedule_expression: "0 5 18 * *"
lgpd_legal_basis: public_interest_ldb_9394_1996_lei_14113_2020_fundeb_transparencia_mec_cnpq
min_expected_rows: 10
primary_keys:
  - cod_avaliacao_inep
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_avaliacao_inep
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único consolidado da etapa de avaliação educacional e acesso INEP/MEC
  - name: etapa_saeb_mec
    data_type: STRING
    required: true
    nullable: false
    description: Etapa avaliada no SAEB/MEC (ENSINO_FUNDAMENTAL_ANOS_FINAIS, ENSINO_MEDIO_REGULAR, ENSINO_SUPERIOR_PROUNI_SISU)
  - name: programa_acesso_fomento
    data_type: STRING
    required: true
    nullable: false
    description: Programa federal de acesso ou financiamento vinculado (PROUNI_INTEGRAL, SISU_VAGAS_PUBLICAS, FUNDEB_VAAR, CNPQ_BOLSAS_PESQUISA)
  - name: situacao_equidade_saeb
    data_type: STRING
    required: true
    nullable: false
    description: Classificação de proficiência e equidade educacional SAEB/VAAR (NIVEL_ADEQUADO_SAEB, EM_EVOLUCAO_PEDAGOGICA, PRIORIDADE_VAAR_EQUIDADE)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município da rede escolar ou IES
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: proficiencia_media_saeb_lp_mat
    data_type: FLOAT64
    required: true
    nullable: false
    description: Proficiência média consolidada SAEB em Língua Portuguesa e Matemática na escala 0-500
  - name: bolsas_prouni_sisu_12m
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade anual de bolsas PROUNI e matrículas ingressantes via SISU vinculadas ao município
  - name: repasses_fundeb_cnpq_mil_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Montante anual de transferências FUNDEB e fomento CNPq associado ao município (R$ mil)
