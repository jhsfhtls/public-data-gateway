schema_version: "3.1.0"
contract_id: "ODCS-BR-INEP-CENSO-SUPERIOR-001"
source_id: "inep_censo_superior"
version: "1.0.0"
name: "INEP: Microdados do Censo da Educação Superior"
agency: "Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira (INEP)"
official_url: "https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/censo-da-educacao-superior"

legal_framework:
  statutes:
    - name: "Lei nº 9.394/1996"
      description: "Lei de Diretrizes e Bases da Educação Nacional (LDB), que disciplina a educação superior e a avaliação institucional"
    - name: "Lei nº 10.861/2004"
      description: "Institui o Sistema Nacional de Avaliação da Educação Superior (SINAES), ENADE e Índice Geral de Cursos (IGC)"
    - name: "Lei nº 13.005/2014"
      description: "Aprova o Plano Nacional de Educação (PNE) com metas de expansão da graduação, titulação docente e mestres/doutores"
    - name: "Decreto nº 9.235/2017"
      description: "Dispõe sobre o exercício das funções de regulação, supervisão e avaliação das instituições de educação superior"
    - name: "Decreto nº 8.777/2016"
      description: "Institui a Política de Dados Abertos do Poder Executivo Federal"

data_governance:
  grain: "municipio_ies_educacao_superior_censo"
  primary_keys:
    - "cnpj_14"
    - "id_municipio"
    - "sigla_uf"
  reference_date_column: "reference_date"
  min_expected_rows: 5
  max_volume_drop_pct: 15.0
  freshness_sla_hours: 720
  lgpd_tier: "ANONYMIZED_MICRODATA"
  ml_feature_domains:
    - "higher_ed_institutions"
    - "degree_courses"

schema:
  tables:
    censo_superior_instituicoes_ies:
      description: "Inventário municipal de Instituições de Educação Superior (IES) ativas, universidades/centros universitários, dependência administrativa e IGC contínuo médio"
      grain: "id_municipio, ano_censo"
      primary_keys: ["id_municipio", "ano_censo"]
      min_expected_rows: 5
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos identificador único do município"
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município"
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla de 2 letras da Unidade Federativa"
        - name: "id_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 2 dígitos da Unidade Federativa"
        - name: "cnpj_14"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "CNPJ canônico de 14 dígitos da principal mantenedora de IES de referência no município"
        - name: "ano_censo"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Ano de referência da coleta oficial do Censo da Educação Superior INEP"
        - name: "total_ies_ativas"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade total de Instituições de Educação Superior (IES) ativas no município"
        - name: "universidades_e_centros_universitarios"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de IES organizadas como Universidades, Centros Universitários ou IFs/CEFETs"
        - name: "ies_rede_publica"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de IES públicas (federais, estaduais e municipais)"
        - name: "ies_rede_privada"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de IES privadas com ou sem fins lucrativos"
        - name: "proporcao_ies_publicas_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual de IES pertencentes à rede pública sobre o total municipal (%)"
        - name: "igc_medio_continuo_municipio"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Média do Índice Geral de Cursos (IGC contínuo 1,0 a 5,0) das IES sediadas no município"
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência ISO-8601 da coleta censitária"
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp ISO-8601 UTC da extração"

    censo_superior_cursos_areas_cine:
      description: "Distribuição municipal dos cursos de graduação, matrículas e concluintes por grande área CINE/OCDE, participação EaD e Conceito ENADE médio"
