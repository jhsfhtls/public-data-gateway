schema_version: "3.1.0"
contract_id: "ODCS-BR-INEP-IDEB-001"
source_id: "inep_ideb"
version: "1.0.0"
name: "INEP: Índice de Desenvolvimento da Educação Básica (IDEB)"
agency: "Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira (INEP)"
official_url: "https://www.gov.br/inep/pt-br/areas-de-atuacao/pesquisas-estatisticas-e-indicadores/ideb"

legal_framework:
  statutes:
    - name: "Lei nº 9.394/1996"
      description: "Lei de Diretrizes e Bases da Educação Nacional (LDB), estabelecendo padrões de avaliação da qualidade da educação básica"
    - name: "Decreto nº 6.094/2007"
      description: "Dispõe sobre o Plano de Metas Compromisso Todos pela Educação e institui o IDEB como indicador oficial de qualidade educacional"
    - name: "Lei nº 13.005/2014"
      description: "Aprova o Plano Nacional de Educação (PNE), vinculando a Meta 7 ao atingimento das metas bienais do IDEB por etapa"
    - name: "Decreto nº 8.777/2016"
      description: "Institui a Política de Dados Abertos do Poder Executivo Federal"

data_governance:
  grain: "municipio_ideb_educacao_basica"
  primary_keys:
    - "id_municipio"
    - "sigla_uf"
    - "cep_8"
  reference_date_column: "reference_date"
  min_expected_rows: 5
  max_volume_drop_pct: 15.0
  freshness_sla_hours: 720
  lgpd_tier: "PUBLIC_NON_PERSONAL"
  ml_feature_domains:
    - "education_quality_index"
    - "learning_metrics"

schema:
  tables:
    ideb_resultados_municipios:
      description: "Resultados bienais oficiais do IDEB municipal por etapa (Anos Iniciais, Anos Finais, Ensino Médio público e privado), fluxo escolar P, nota SAEB N e cumprimento de metas INEP"
      grain: "id_municipio, ano_edicao_ideb"
      primary_keys: ["id_municipio", "ano_edicao_ideb"]
      min_expected_rows: 5
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos identificador único do município"
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município"
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla de 2 letras da Unidade Federativa"
        - name: "id_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 2 dígitos da Unidade Federativa"
        - name: "cep_8"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "CEP canônico de 8 dígitos da secretaria municipal de educação de referência"
        - name: "ano_edicao_ideb"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Ano da edição bienal oficial do IDEB apurada pelo INEP"
        - name: "ideb_anos_iniciais_rede_publica"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "IDEB observado nos Anos Iniciais do Ensino Fundamental (1º ao 5º ano) da rede pública (escala 0 a 10)"
        - name: "ideb_anos_finais_rede_publica"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "IDEB observado nos Anos Finais do Ensino Fundamental (6º ao 9º ano) da rede pública (escala 0 a 10)"
        - name: "ideb_ensino_medio_rede_publica"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "IDEB observado no Ensino Médio da rede pública (escala 0 a 10)"
        - name: "ideb_rede_privada_ensino_medio"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "IDEB observado no Ensino Médio da rede privada no município (escala 0 a 10)"
        - name: "indicador_rendimento_fluxo_medio_p"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Indicador médio de rendimento escolar P (fluxo de aprovação entre 0 e 1)"
        - name: "nota_padronizada_saeb_n_media"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nota média padronizada N no SAEB em Língua Portuguesa e Matemática (escala 0 a 10)"
        - name: "escolas_avaliadas_ideb_municipio"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de escolas participantes avaliadas com cálculo oficial do IDEB no município"
        - name: "proporcao_escolas_cumpriram_meta_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual de escolas da rede pública que atingiram ou superaram a meta bienal do IDEB"
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência oficial da publicação bienal do IDEB pelo INEP (YYYY-MM-DD)"
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Carimbo temporal ISO-8601 UTC da extração"

    ideb_etapas_redes_ensino:
      description: "Desempenho desagregado do IDEB por etapa de ensino e dependência administrativa (observado vs. meta INEP)"
