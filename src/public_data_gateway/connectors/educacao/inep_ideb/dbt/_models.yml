        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da Unidade Federativa."
        tests:
          - not_null
      - name: cep_8
        description: "CEP canônico de 8 dígitos da secretaria municipal de educação de referência."
        tests:
          - not_null
      - name: ano_edicao_ideb
        description: "Ano da edição bienal oficial do IDEB/SAEB."
        tests:
          - not_null
      - name: proficiencia_saeb_lp_5ano
        description: "Proficiência média no SAEB em Língua Portuguesa no 5º ano."
        tests:
          - not_null
      - name: proficiencia_saeb_mat_5ano
        description: "Proficiência média no SAEB em Matemática no 5º ano."
        tests:
          - not_null
      - name: proficiencia_saeb_lp_9ano
        description: "Proficiência média no SAEB em Língua Portuguesa no 9º ano."
        tests:
          - not_null
      - name: proficiencia_saeb_mat_9ano
        description: "Proficiência média no SAEB em Matemática no 9º ano."
        tests:
          - not_null
      - name: aprendizado_adequado_anos_iniciais_pct
        description: "Percentual de alunos com aprendizado adequado nos Anos Iniciais (%)."
        tests:
          - not_null
      - name: aprendizado_adequado_anos_finais_pct
        description: "Percentual de alunos com aprendizado adequado nos Anos Finais (%)."
        tests:
          - not_null
      - name: taxa_participacao_saeb_pct
        description: "Taxa percentual de participação efetiva na prova SAEB (%)."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601 da publicação bienal do IDEB."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

