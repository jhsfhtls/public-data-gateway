version: 2

models:
  - name: stg_ideb_resultados_municipios
    description: "Visão padronizada dos resultados bienais oficiais do IDEB municipal por etapa (Anos Iniciais, Anos Finais, Ensino Médio público e privado), fluxo P e metas (INEP)."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests:
          - not_null
          - unique
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da Unidade Federativa."
        tests:
          - not_null
      - name: cep_8
        description: "CEP canônico de 8 dígitos da secretaria municipal de educação de referência."
        tests:
          - not_null
      - name: ano_edicao_ideb
        description: "Ano da edição bienal oficial do IDEB apurada pelo INEP."
        tests:
          - not_null
      - name: ideb_anos_iniciais_rede_publica
        description: "IDEB observado nos Anos Iniciais do Ensino Fundamental da rede pública."
        tests:
          - not_null
      - name: ideb_anos_finais_rede_publica
        description: "IDEB observado nos Anos Finais do Ensino Fundamental da rede pública."
        tests:
          - not_null
      - name: ideb_ensino_medio_rede_publica
        description: "IDEB observado no Ensino Médio da rede pública."
        tests:
          - not_null
      - name: ideb_rede_privada_ensino_medio
        description: "IDEB observado no Ensino Médio da rede privada."
        tests:
          - not_null
      - name: indicador_rendimento_fluxo_medio_p
        description: "Indicador médio de rendimento escolar P (fluxo de aprovação entre 0 e 1)."
        tests:
          - not_null
      - name: nota_padronizada_saeb_n_media
        description: "Nota média padronizada N no SAEB em Língua Portuguesa e Matemática."
        tests:
          - not_null
      - name: escolas_avaliadas_ideb_municipio
        description: "Quantidade de escolas participantes avaliadas com cálculo oficial do IDEB."
        tests:
          - not_null
      - name: proporcao_escolas_cumpriram_meta_pct
        description: "Percentual de escolas públicas que atingiram ou superaram a meta bienal (%)."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601 da publicação bienal do IDEB."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

  - name: stg_ideb_etapas_redes_ensino
    description: "Visão padronizada do IDEB desagregado por etapa de ensino e dependência administrativa (observado vs. meta projetada INEP)."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests:
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da Unidade Federativa."
        tests:
          - not_null
      - name: cep_8
        description: "CEP canônico de 8 dígitos da secretaria municipal de educação de referência."
        tests:
          - not_null
      - name: ano_edicao_ideb
        description: "Ano da edição bienal oficial do IDEB."
        tests:
          - not_null
      - name: etapa_ciclo_ideb
        description: "Etapa/ciclo de ensino e rede avaliada no IDEB."
        tests:
          - not_null
      - name: rede_ensino
        description: "Dependência administrativa agregada (Publica ou Privada)."
        tests:
          - not_null
      - name: ideb_observado
        description: "Nota IDEB observada na respectiva etapa/rede de ensino."
        tests:
          - not_null
      - name: meta_projetada_inep
        description: "Meta oficial projetada pelo INEP/PNE para a etapa."
        tests:
          - not_null
      - name: saldo_sobre_meta_ideb
        description: "Diferença em pontos entre o IDEB observado e a meta projetada."
        tests:
          - not_null
      - name: taxa_aprovacao_etapa_pct
        description: "Taxa percentual média de aprovação escolar da etapa avaliada (%)."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601 da publicação bienal do IDEB."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

  - name: stg_ideb_proficiencia_saeb_aprendizagem
    description: "Visão padronizada de proficiências SAEB em Língua Portuguesa e Matemática, aprendizado adequado e taxa de participação (INEP)."
