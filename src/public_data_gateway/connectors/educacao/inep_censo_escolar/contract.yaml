        - name: "taxa_abandono_escolar_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Taxa consolidada de abandono/evasão escolar anual (%)"
        - name: "taxa_distorcao_idade_serie_media_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Taxa média de distorção idade-série na rede educacional (%)"
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
