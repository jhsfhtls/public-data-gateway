        - name: "ano_censo"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Ano de referência do Censo Escolar INEP"
        - name: "total_matriculas_educacao_basica"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Total consolidado de matrículas na educação básica do município"
        - name: "matriculas_tempo_integral_total"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Total de matrículas com jornada em tempo integral no município"
        - name: "proporcao_tempo_integral_total_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual consolidado de matrículas em tempo integral (%)"
        - name: "taxa_aprovacao_media_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Taxa média de aprovação escolar na educação básica (%)"
        - name: "taxa_reprovacao_media_pct"
