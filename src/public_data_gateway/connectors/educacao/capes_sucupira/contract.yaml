schema_version: "3.1.0"
contract_id: "ODCS-BR-CAPES-SUCUPIRA-001"
source_id: "capes_sucupira"
version: "1.0.0"
name: "CAPES: Plataforma Sucupira (Pós-Graduação Stricto Sensu)"
agency: "Coordenação de Aperfeiçoamento de Pessoal de Nível Superior (CAPES)"
official_url: "https://dadosabertos.capes.gov.br/"

legal_framework:
  statutes:
    - name: "Lei nº 8.405/1992"
      description: "Autoriza o Poder Executivo a instituir a Fundação Coordenação de Aperfeiçoamento de Pessoal de Nível Superior (CAPES)"
    - name: "Decreto nº 11.238/2022"
      description: "Aprova o Estatuto da CAPES e define suas atribuições na avaliação e fomento da pós-graduação stricto sensu"
    - name: "Portaria CAPES nº 182/2018 & Portaria MEC nº 389/2017"
      description: "Regulam os processos da Avaliação Quadrienal da Pós-Graduação Stricto Sensu e a oferta de mestrados e doutorados profissionais"
    - name: "Lei nº 13.709/2018 (LGPD)"
      description: "Regula a proteção e anonimização de dados públicos agregados de discentes, docentes e produção científica"
    - name: "Decreto nº 8.777/2016"
      description: "Institui a Política de Dados Abertos do Poder Executivo Federal aplicável ao portal de Dados Abertos da CAPES"

data_governance:
  grain: "municipio_pos_graduacao_sucupira"
  primary_keys:
    - "id_municipio"
    - "sigla_uf"
  reference_date_column: "reference_date"
  min_expected_rows: 10
  max_volume_drop_pct: 15.0
  freshness_sla_hours: 720
  lgpd_tier: "PUBLIC_NON_PERSONAL"
  ml_feature_domains:
    - "postgrad_programs"
    - "academic_production"

schema:
  tables:
    sucupira_programas_avaliacao:
      description: "Programas de pós-graduação stricto sensu (mestrado e doutorado acadêmico/profissional) avaliados pela CAPES por município e nota quadrienal."
      grain: "id_municipio, ano_base_sucupira"
      primary_keys: ["id_municipio", "ano_base_sucupira"]
      min_expected_rows: 12
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos identificador único do município."
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município."
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla de 2 letras da Unidade Federativa."
        - name: "id_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 2 dígitos da Unidade Federativa."
        - name: "regiao"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Grande região geográfica brasileira segundo o IBGE."
        - name: "ano_base_sucupira"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Ano-base de referência da coleta CAPES Sucupira."
        - name: "total_programas_stricto_sensu_ano"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Total de programas de pós-graduação stricto sensu em funcionamento no município."
        - name: "programas_nota_6_7_excelencia_ano"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de programas com conceito CAPES 6 ou 7 (padrão internacional de excelência)."
        - name: "programas_doutorado_ativo_ano"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Programas que ofertam curso de doutorado ativo no município."
        - name: "ies_ofertantes_pos_graduacao_ano"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de Instituições de Ensino Superior ofertantes de pós-graduação stricto sensu."
        - name: "nota_media_capes_programas"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Conceito médio ponderado dos programas avaliados pela CAPES (escala 3.0 a 7.0)."
        - name: "prop_programas_excelencia_6_7_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Proporção percentual de programas com conceito CAPES 6 ou 7 (%)."
        - name: "prop_programas_profissionais_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Proporção percentual de programas na modalidade mestrado/doutorado profissional (%)."
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência do ciclo anual CAPES Sucupira (YYYY-MM-DD)."
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp UTC ISO-8601 da materialização."

    sucupira_discentes_titulados_area:
