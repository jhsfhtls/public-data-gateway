contract_id: ODCS-BR-IBGE-INSTITUCIONAL-MUNIC-POF-001
source_id: ibge_institucional
version: 1.0.0
grain: 1 row per IBGE institutional/household survey track (MUNIC, ESTADIC & POF) and municipality
name: "IBGE Institucional & Social (MUNIC, ESTADIC & POF): Capacidade Gestora & Orçamentos Familiares"
agency: IBGE (Diretoria de Pesquisas — MUNIC, ESTADIC & POF)
official_url: https://servicodados.ibge.gov.br/api/v1/pesquisas/1
segment_id: 03_demografico_censitario
access_mode: LAKEHOUSE_BATCH
protocol: REST_JSON
auth_type: NONE
update_frequency: Anual / Bienal (MUNIC & ESTADIC) / Quinquenal (POF)
freshness_sla_hours: 720
cron_schedule_expression: "0 5 18 * *"
lgpd_legal_basis: public_interest_ibge_lei_5534_1968_munic_estadic_pof
min_expected_rows: 10
primary_keys:
  - cod_pesquisa_ibge
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_pesquisa_ibge
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único consolidado da pesquisa institucional ou domiciliar IBGE no município
  - name: eixo_pesquisa_ibge
    data_type: STRING
    required: true
    nullable: false
    description: Eixo de pesquisa IBGE avaliado (MUNIC_GESTAO_MUNICIPAL, ESTADIC_GESTAO_ESTADUAL, POF_ORCAMENTOS_FAMILIARES)
  - name: capacidade_governanca_ti
    data_type: STRING
    required: true
    nullable: false
    description: Estágio de governança digital e informática pública na administração (GOV_DIGITAL_PLENA, PLANO_DIRETOR_DIGITAL, INFRA_TI_EM_EXPANSAO)
  - name: situacao_legislacao_urbana
    data_type: STRING
    required: true
    nullable: false
    description: Status de vigência da legislação urbanística e Plano Diretor municipal (PLANO_DIRETOR_VIGENTE, DEFICIT_REGULATORIO)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município pesquisado
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: indice_capacidade_institucional_munic
    data_type: FLOAT64
    required: true
    nullable: false
    description: Índice sintético de capacidade institucional, instrumentos de gestão e governança digital (escala 0-100)
  - name: servidores_estatutarios_municipio
    data_type: INT64
    required: true
    nullable: false
    description: Efetivo de servidores públicos estatutários ativos na administração direta municipal
  - name: despesa_familiar_media_pof_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Despesa total mensal média das famílias na região metropolitana ou estrato POF (BRL)
