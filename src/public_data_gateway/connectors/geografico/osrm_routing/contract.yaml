    data_type: STRING
    nullable: false
  - name: dest_municipio
    data_type: STRING
    nullable: false
  - name: sigla_uf
    data_type: STRING
    nullable: false
  - name: profile
    data_type: STRING
    nullable: false
  - name: distance_km
    data_type: DOUBLE
    nullable: false
  - name: duration_min
    data_type: DOUBLE
    nullable: false
  - name: extracted_at
    data_type: STRING
    nullable: false
