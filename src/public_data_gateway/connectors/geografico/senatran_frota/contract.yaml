contract_id: ODCS-BR-SENATRAN-FROTA-001
source_id: senatran_frota
version: 1.0.0
grain: 1 row per vehicle category and municipality fleet snapshot (RENAVAM SENATRAN)
name: "SENATRAN Frota de Veículos: RENAVAM, Mobilidade & Eletrificação"
agency: Secretaria Nacional de Trânsito (SENATRAN / Ministério dos Transportes)
official_url: https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-Senatran/estatisticas-frota-de-veiculos-senatran
segment_id: 05_geografico_logistica
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Mensal (Frota Circulante por Município, Tipo & Combustível RENAVAM)
freshness_sla_hours: 720
cron_schedule_expression: "0 5 5 * *"
lgpd_legal_basis: public_interest_lei_9503_1997_codigo_transito_brasileiro
min_expected_rows: 10
primary_keys:
  - cod_frota_tipo
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_frota_tipo
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único composto da estatística de frota por categoria veicular e município no SENATRAN
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município de licenciamento
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF) do DETRAN
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município de emplacamento
  - name: tipo_veiculo
    data_type: STRING
    required: true
    nullable: false
    description: Categoria RENAVAM (AUTOMOVEL, MOTOCICLETA, CAMINHAO_PESADO ou UTILITARIO_LEVE)
  - name: qtd_veiculos_ativos
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade ativa de veículos licenciados na categoria no município
  - name: participacao_frota_pct
    data_type: FLOAT64
    required: true
    nullable: false
    description: Participação percentual da categoria sobre a frota total do município (%)
  - name: ano_referencia
    data_type: INT64
    required: true
    nullable: false
    description: Ano de referência do fechamento estatístico mensal SENATRAN
