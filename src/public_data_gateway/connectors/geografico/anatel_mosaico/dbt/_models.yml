version: 2

models:
  - name: stg_anatel_estacoes_smp
    description: "Visão padronizada de Estações Rádio Base (ERBs) licenciadas do Serviço Móvel Pessoal por tecnologia e município."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests:
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da Unidade Federativa."
        tests:
          - not_null
      - name: ano_mes_referencia
        description: "Competência mensal de referência no formato AAAA-MM."
        tests:
          - not_null
      - name: total_erbs_licenciadas
        description: "Contagem total de Estações Rádio Base (ERBs) licenciadas."
        tests:
          - not_null
      - name: erbs_5g_nr
        description: "Quantidade de estações licenciadas 5G NR."
        tests:
          - not_null
      - name: erbs_4g_lte
        description: "Quantidade de estações licenciadas 4G LTE."
        tests:
          - not_null
      - name: erbs_3g_wcdma
        description: "Quantidade de estações licenciadas 3G WCDMA."
        tests:
          - not_null
      - name: erbs_2g_gsm
        description: "Quantidade de estações licenciadas 2G GSM."
        tests:
          - not_null
      - name: operadoras_ativas_smp
        description: "Número de operadoras SMP com estações ativas no município."
        tests:
          - not_null
      - name: operadora_lider_erbs
        description: "Nome da operadora com maior volume de ERBs licenciadas."
        tests:
          - not_null
      - name: densidade_erbs_por_10k_hab
        description: "Densidade de ERBs licenciadas por 10 mil habitantes."
        tests:
          - not_null
      - name: densidade_erbs_por_100km2
        description: "Densidade espacial de ERBs por 100 km²."
        tests:
          - not_null
      - name: cobertura_urbana_5g_pct
        description: "Percentual de cobertura urbana estimada 5G."
        tests:
          - not_null
      - name: cobertura_urbana_4g_pct
        description: "Percentual de cobertura urbana estimada 4G."
        tests:
          - not_null
      - name: source_url
        description: "URL oficial do portal ANATEL."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

  - name: stg_anatel_banda_larga_scm
    description: "Visão padronizada da infraestrutura de Banda Larga Fixa (SCM), backhaul e acessos FTTH por município."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests:
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: ano_mes_referencia
        description: "Competência mensal de referência no formato AAAA-MM."
        tests:
          - not_null
      - name: possui_backhaul_fibra
        description: "Indicador booleano de disponibilidade de transporte backhaul em fibra óptica."
        tests:
          - not_null
      - name: total_acessos_scm
        description: "Total de acessos ativos em banda larga fixa (SCM)."
        tests:
          - not_null
      - name: acessos_fibra_ftth
        description: "Total de acessos fixos via fibra óptica (FTTH/FTTB)."
        tests:
          - not_null
      - name: acessos_cabo_coaxial
        description: "Total de acessos fixos via cabo coaxial ou xDSL."
        tests:
          - not_null
      - name: acessos_radio_satelite
        description: "Total de acessos fixos via rádio terrestre ou satélite."
        tests:
          - not_null
      - name: participacao_fibra_pct
        description: "Percentual de acessos em fibra óptica sobre o total SCM."
        tests:
          - not_null
      - name: velocidade_mediana_mbps
        description: "Velocidade mediana contratada de download em Mbps."
        tests:
          - not_null
      - name: prestadoras_scm_ativas
        description: "Número de prestadoras SCM com base ativa."
        tests:
          - not_null
      - name: indice_hhi_concentracao_scm
        description: "Índice Herfindahl-Hirschman (HHI) de concentração de mercado SCM."
        tests:
          - not_null
      - name: source_url
        description: "URL oficial do portal ANATEL."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

  - name: stg_anatel_espectro_radiofrequencia
    description: "Visão padronizada de alocação de faixas de radiofrequência e largura de banda por município."
    columns:
      - name: id_municipio
