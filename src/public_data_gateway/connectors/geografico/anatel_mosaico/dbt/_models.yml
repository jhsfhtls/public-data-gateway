          - not_null
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: faixa_frequencia_mhz
        description: "Faixa de espectro licenciada em MHz."
        tests:
          - not_null
      - name: geracao_tecnologica
        description: "Geração tecnológica principal associada à faixa."
        tests:
          - not_null
      - name: largura_banda_agregada_mhz
        description: "Largura de banda total agregada alocada na faixa em MHz."
        tests:
          - not_null
      - name: estacoes_licenciadas_faixa
        description: "Quantidade de estações operando nesta faixa de radiofrequência."
        tests:
          - not_null
      - name: potencia_media_eirp_dbm
        description: "Potência média efetiva isotropicamente radiada (EIRP) em dBm."
        tests:
          - not_null
      - name: status_limpeza_faixa
        description: "Status regulatório de desocupação e liberação da faixa."
        tests:
          - not_null
      - name: source_url
        description: "URL oficial do espectro ANATEL."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

