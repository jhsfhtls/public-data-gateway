schema_version: "3.1.0"
contract_id: "ODCS-BR-IBGE-CNEFE-001"
source_id: "ibge_cnefe"
version: "1.0.0"
name: "IBGE CNEFE - Cadastro Nacional de Endereços para Fins Estatísticos (Censo Demográfico 2022)"
agency: "Instituto Brasileiro de Geografia e Estatística (IBGE)"
official_url: "https://ftp.ibge.gov.br/Cadastro_Nacional_de_Enderecos_para_Fins_Estatisticos/Censo_Demografico_2022/"

legal_framework:
  statutes:
    - name: "Lei nº 5.534/1968"
      description: "Dispõe sobre a obrigatoriedade da prestação de informações estatísticas ao IBGE e assegura o sigilo censitário"
    - name: "Lei nº 5.878/1973"
      description: "Define os objetivos e competências da Fundação Instituto Brasileiro de Geografia e Estatística (IBGE)"
    - name: "Decreto nº 73.177/1973"
      description: "Aprova o regulamento geral do IBGE e fixa suas atribuições no Sistema Estatístico e Censitário Nacional"
    - name: "Portaria IBGE nº 123/2021"
      description: "Institui a Política de Dados Abertos e Governança Censitária do IBGE"

data_governance:
  grain: "endereco_predial_coordenada"
  primary_keys:
    - "id_municipio"
    - "cep_8"
    - "codigo_setor_censitario"
  reference_date_column: "reference_date"
  min_expected_rows: 5
  max_volume_drop_pct: 20.0
  freshness_sla_hours: 87600
  lgpd_tier: "PUBLIC_NON_PERSONAL"
  ml_feature_domains:
    - "geo_coordinates"
    - "address_standardization"
    - "urban_density"
    - "infrastructure_mapping"

schema:
  tables:
    cnefe_enderecos_padrao:
      description: "Cadastro padronizado de logradouros e endereços prediais do CNEFE Censo 2022"
      grain: "endereco_predial"
      primary_keys: ["id_municipio", "codigo_setor_censitario", "seq_endereco"]
      min_expected_rows: 5
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos identificador único do município"
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla de 2 letras da Unidade Federativa"
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município"
        - name: "codigo_distrito"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código do distrito municipal segundo malha censitária do IBGE"
        - name: "codigo_subdistrito"
          data_type: "string"
          required: false
          nullable: true
          max_null_pct: 50.0
          description: "Código do subdistrito municipal"
        - name: "codigo_setor_censitario"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código identificador do setor censitário do IBGE com 15 dígitos"
        - name: "seq_endereco"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Número sequencial identificador do endereço no setor censitário"
        - name: "cep_8"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código de Endereçamento Postal oficial de 8 dígitos numéricos"
        - name: "tipo_logradouro"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Tipo de logradouro oficial normalizado (Rua, Avenida, Praça, Rodovia, etc.)"
        - name: "titulo_patente"
          data_type: "string"
          required: false
          nullable: true
          max_null_pct: 80.0
          description: "Título ou patente honorífica do logradouro (Doutor, Coronel, Dom, etc.)"
        - name: "nome_logradouro"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do logradouro público cadastrado"
        - name: "numero_predial"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Número do imóvel ou indicador 'S/N' (sem número)"
        - name: "complemento"
          data_type: "string"
          required: false
          nullable: true
          max_null_pct: 60.0
          description: "Complemento do imóvel (apartamento, bloco, sala, lote, casa, etc.)"
        - name: "bairro"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do bairro ou localidade"
        - name: "especie_edificacao"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Espécie de edificação ou finalidade de uso do endereço segundo IBGE"
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência da coleta e consolidação dos endereços (AAAA-MM-DD)"
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp ISO-8601 UTC do momento da extração estatística"

    cnefe_coordenadas_geograficas:
      description: "Geolocalização pontual precisa (latitude e longitude WGS84) dos endereços"
      grain: "ponto_coordenada"
      primary_keys: ["id_municipio", "seq_endereco"]
      min_expected_rows: 5
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos do município"
        - name: "seq_endereco"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Número sequencial identificador do endereço"
        - name: "cep_8"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código de Endereçamento Postal de 8 dígitos"
        - name: "latitude"
          data_type: "float"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Coordenada geográfica de latitude em graus decimais (WGS84)"
        - name: "longitude"
          data_type: "float"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Coordenada geográfica de longitude em graus decimais (WGS84)"
        - name: "precisao_geocodificacao"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nível de precisão do ponto geocodificado (Edificação, Face de Quadra, Setor Censitário)"
        - name: "altitude_aproximada_m"
          data_type: "float"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Altitude aproximada do ponto em metros acima do nível do mar"
        - name: "especie_edificacao"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Espécie de edificação do ponto georreferenciado"
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência do censo (AAAA-MM-DD)"
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp ISO-8601 UTC de ingestão"

    cnefe_tipos_edificacao:
      description: "Contagem e consolidação das espécies de edificações e finalidades de uso por município"
      grain: "municipio_edificacao"
      primary_keys: ["id_municipio", "tipo_edificacao"]
      min_expected_rows: 5
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos do município"
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla da Unidade Federativa"
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município"
        - name: "tipo_edificacao"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Categoria da espécie de edificação (Domicílio Particular, Coletivo, Agropecuário, Ensino, Saúde, etc.)"
        - name: "total_edificacoes"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade total de endereços cadastrados nessa espécie"
        - name: "participacao_pct"
          data_type: "float"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual de representatividade em relação ao total de endereços do município"
        - name: "densidade_edificacoes_km2"
          data_type: "float"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Densidade de edificações dessa espécie por quilômetro quadrado"
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência estatística"
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp ISO-8601 UTC da extração"

    cnefe_agregados_cep:
      description: "Estatísticas agregadas, centroides e densidade territorial por CEP de 8 dígitos"
      grain: "cep"
      primary_keys: ["cep_8", "id_municipio"]
      min_expected_rows: 5
      columns:
        - name: "cep_8"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código de Endereçamento Postal de 8 dígitos"
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos do município"
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla da Unidade Federativa"
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município"
        - name: "total_enderecos"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade total de endereços e unidades associadas ao CEP"
        - name: "total_domicilios"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Total de domicílios residenciais no CEP"
        - name: "total_estabelecimentos"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Total de estabelecimentos comerciais, industriais e de serviços no CEP"
        - name: "latitude_centroide"
          data_type: "float"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Latitude do centroide ponderado dos endereços do CEP (WGS84)"
        - name: "longitude_centroide"
          data_type: "float"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Longitude do centroide ponderado dos endereços do CEP (WGS84)"
        - name: "indice_misto_residencial_comercial"
          data_type: "float"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Índice de uso misto do solo (0 = estritamente residencial, 1 = equilíbrio pleno)"
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência da consolidação"
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp ISO-8601 UTC de extração"

    cnefe_densidade_enderecamento:
      description: "Indicadores municipais de densidade, cobertura e verticalização de endereços"
      grain: "municipio"
      primary_keys: ["id_municipio"]
      min_expected_rows: 5
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos do município"
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla da Unidade Federativa"
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município"
        - name: "total_enderecos_municipio"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Volume total de endereços cadastrados no município"
        - name: "total_logradouros_distintos"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Número total de logradouros distintos no município"
        - name: "total_ceps_distintos"
          data_type: "integer"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de CEPs ativos catalogados no CNEFE"
        - name: "taxa_cobertura_georreferenciada_pct"
          data_type: "float"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual de endereços com coordenadas geográficas pontuais validadas"
        - name: "densidade_enderecos_km2"
          data_type: "float"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Média de endereços cadastrados por quilômetro quadrado de área municipal"
        - name: "proporcao_enderecos_comerciais_pct"
          data_type: "float"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual de endereços dedicados a comércio, serviços e indústrias"
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência estatística"
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp ISO-8601 UTC de extração"
