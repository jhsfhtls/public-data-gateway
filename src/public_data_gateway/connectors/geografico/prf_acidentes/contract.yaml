contract_id: ODCS-BR-PRF-ACIDENTES-001
source_id: prf_acidentes
version: 1.0.0
grain: 1 row per PRF federal highway accident cluster and municipality (BRs)
name: "PRF Dados Abertos: Sinistros Rodoviários, Letalidade & Corredores Logísticos"
agency: Polícia Rodoviária Federal (PRF / Ministério da Justiça e Segurança Pública)
official_url: https://www.gov.br/prf/pt-br/acesso-a-informacao/dados-abertos/dados-abertos-da-prf
segment_id: 05_geografico_logistica
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Trimestral (Boletins de Ocorrência de Trânsito BRs)
freshness_sla_hours: 720
cron_schedule_expression: "0 6 15 * *"
lgpd_legal_basis: public_interest_lei_12527_2011_e_lei_9503_1997_ctb
min_expected_rows: 10
primary_keys:
  - cod_sinistro_prf
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_sinistro_prf
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único do agrupamento de ocorrências rodoviárias PRF por BR e município
  - name: rodovia_br
    data_type: STRING
    required: true
    nullable: false
    description: Designação da rodovia federal sob jurisdição PRF (ex. BR-116, BR-040)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município cortado pela rodovia federal
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF) do trecho PRF
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município de ocorrência do sinistro rodoviário
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: causa_principal_sinistro
    data_type: STRING
    required: true
    nullable: false
    description: Fator causal dominante apurado em BAT (VELOCIDADE_INCOMPATIVEL, FALTA_ATENCAO, ULTRAPASSAGEM_INDEVIDA, ALCOOLEMIA)
  - name: classificacao_gravidade
    data_type: STRING
    required: true
    nullable: false
    description: Severidade agregada do agrupamento (SEM_VITIMAS, COM_FERIDOS ou COM_OBITOS)
  - name: qtd_ocorrencias_trecho
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade anual de boletins de sinistro lavrados no trecho municipal
  - name: qtd_feridos_leves_graves
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade total de feridos leves e graves envolvidos nos sinistros
  - name: qtd_obitos_rodovia
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade de óbitos registrados no local ou em decorrência do sinistro rodoviário
