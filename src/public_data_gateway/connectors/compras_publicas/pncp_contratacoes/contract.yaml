contract_id: "ODCS-BR-PNCP-CONTRATACOES-001"
source_id: "pncp_contratacoes"
version: "1.0.0"
grain: "One row per public procurement process (numeroControlePNCP) or formal contract (numeroControlePNCP)"
primary_keys:
  - "numero_controle_pncp"
canonical_keys:
  - "numero_controle_pncp"
  - "cnpj_orgao"
  - "ni_fornecedor"
  - "id_municipio"
  - "sigla_uf"
reference_date_column: "reference_date"
lgpd_legal_basis: "Art. 7, § 3º e 4º LGPD c/c Lei nº 14.133/2021 (Publicidade e Transparência Ativa em Contratações Públicas)"
min_expected_rows: 5
max_volume_drop_pct: 1.0
sentinel_values:
  - "-1"
  - "99"
  - "999"
  - "SEM INFORMACAO"
  - "IGNORADO"
  - "N/A"
  - "-"
  - "00000000000000"
columns:
  - name: "numero_controle_pncp"
    data_type: "string"
    required: true
    is_primary_key: true
    description: "Identificador único universal canônico do processo ou contrato no Portal Nacional de Contratações Públicas (ex: 01612612000106-1-000001/2024)"
  - name: "cnpj_orgao"
    data_type: "string"
    required: true
    description: "CNPJ canônico com 14 dígitos numéricos do órgão ou entidade pública contratante"
  - name: "razao_social_orgao"
    data_type: "string"
    required: true
    description: "Razão social ou denominação oficial da entidade compradora"
  - name: "esfera_id"
    data_type: "string"
    required: true
    description: "Esfera administrativa federativa da contratação (F=Federal, E=Estadual, M=Municipal, D=Distrital)"
  - name: "poder_id"
    data_type: "string"
    required: true
    description: "Poder da República responsável pelo certame (E=Executivo, L=Legislativo, J=Judiciário, N=Ministério Público/Defensoria)"
  - name: "id_municipio"
    data_type: "string"
    required: false
    description: "Código canônico IBGE do município com 7 dígitos decimais onde a unidade administrativa está situada"
  - name: "sigla_uf"
    data_type: "string"
    required: false
    description: "Sigla oficial de 2 letras maiúsculas da Unidade Federativa da execução da compra"
  - name: "modalidade_id"
    data_type: "integer"
    required: true
    description: "Código numérico identificador da modalidade de contratação conforme a Lei 14.133/2021"
  - name: "modalidade_nome"
    data_type: "string"
    required: true
    description: "Nome descritivo da modalidade licitatória (ex: Pregão Eletrônico, Concorrência, Dispensa de Licitação)"
  - name: "valor_total_estimado"
    data_type: "float"
    required: false
    description: "Valor financeiro total estimado para a licitação ou contratação pública em Reais (R$)"
  - name: "valor_total_homologado"
    data_type: "float"
    required: false
    description: "Valor financeiro total homologado / adjudicado após fase competitiva em Reais (R$)"
  - name: "data_publicacao_pncp"
    data_type: "string"
    required: true
    description: "Data e hora de publicação oficial do processo no PNCP em formato ISO 8601"
