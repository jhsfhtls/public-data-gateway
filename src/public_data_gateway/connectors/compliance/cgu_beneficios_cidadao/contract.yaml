contract_id: ODCS-BR-CGU-BENEFICIOS-CIDADAO-001
source_id: cgu_beneficios_cidadao
version: 1.0.0
grain: 1 row per CGU/MDS social benefit program track and municipality
name: "CGU Benefícios ao Cidadão (Bolsa Família, BPC, Seguro-Defeso & Garantia-Safra)"
agency: Controladoria-Geral da União (CGU) & Ministério do Desenvolvimento Social (MDS)
official_url: https://portaldatransparencia.gov.br/download-de-dados/novo-bolsa-familia
segment_id: 08_judicial_compliance
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Mensal (Folha Novo Bolsa Família, BPC & Seguro-Defeso)
freshness_sla_hours: 720
cron_schedule_expression: "0 5 18 * *"
lgpd_legal_basis: public_interest_lai_12527_2011_transparencia_beneficios_sociais_cgu
min_expected_rows: 10
primary_keys:
  - cod_programa_social
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_programa_social
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único do programa de transferência de renda CGU/MDS no município
  - name: programa_transferencia_cgu
    data_type: STRING
    required: true
    nullable: false
    description: Programa federal de proteção social auditado (NOVO_BOLSA_FAMILIA, BPC_LOAS_ASSISTENCIAL, SEGURO_DEFESO_GARANTIA_SAFRA)
  - name: modalidade_pagamento
    data_type: STRING
    required: true
    nullable: false
    description: Canal e modalidade operacional de repasse financeiro ao cidadão (CARTAO_SOCIAL_CAIXA_TEM, BENEFICIO_CONTINUADO_INSS, SAQUE_EMERGENCIAL_RURAL)
  - name: situacao_cadunico_elegibilidade
    data_type: STRING
    required: true
    nullable: false
    description: Status de cobertura e conformidade cadastral CadÚnico (CADUNICO_ATUALIZADO_ALTA_COBERTURA, REVISAO_CADASTRAL_PRIORITARIA, BUSCA_ATIVA_VULNERABILIDADE)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município beneficiado
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: familias_beneficiarias_ativas
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade de famílias ou beneficiários ativos atendidos no programa social no município
  - name: valor_mensal_transferido_mil_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Montante mensal total transferido diretamente às famílias do município (R$ mil)
  - name: beneficio_medio_familiar_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Valor médio mensal do benefício pago por família atendida (BRL)
