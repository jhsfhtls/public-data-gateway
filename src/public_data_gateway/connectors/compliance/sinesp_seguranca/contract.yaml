contract_id: ODCS-BR-SINESP-SEGURANCA-001
source_id: sinesp_seguranca
version: 1.0.0
grain: 1 row per criminal offense type and municipality annual snapshot (SINESP-VDE / FBSP)
name: "SINESP / FBSP Segurança Pública: Ocorrências Criminais, MVI & Risco Patrimonial"
agency: Ministério da Justiça e Segurança Pública (SENASP / SINESP) & Fórum Brasileiro de Segurança Pública (FBSP)
official_url: https://www.gov.br/mj/pt-br/assuntos/sua-seguranca/seguranca-publica/estatistica/dados-nacionais-1/base-de-dados-e-notas-metodologicas-dos-gestores-estaduais-sinesp-vde-2022-e-2023
segment_id: 08_judicial_compliance
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Anual (SINESP VDE & Anuário FBSP) / Mensal (Série Estatística)
freshness_sla_hours: 720
cron_schedule_expression: "0 6 10 * *"
lgpd_legal_basis: public_interest_lai_lei_13675_2018_susp
min_expected_rows: 10
primary_keys:
  - cod_ocorrencia_sinesp
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_ocorrencia_sinesp
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único composto da estatística criminal SINESP-VDE por município e tipificação penal
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município da ocorrência
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF) do registro SSP
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município monitorado pelo SINESP/SUSP
  - name: tipo_crime
    data_type: STRING
    required: true
    nullable: false
    description: Natureza penal agregada (ROUBO_CARGA_LOGISTICA, ROUBO_FURTO_VEICULO, ESTELIONATO_FRAUDE ou HOMICIDIO_DOLOSO)
  - name: qtd_ocorrencias
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade absoluta anual de ocorrências registradas nos boletins SSP/SINESP
  - name: taxa_por_100k_hab
    data_type: FLOAT64
    required: true
    nullable: false
    description: Taxa padronizada de incidência criminal por grupo de 100 mil habitantes
  - name: ano_referencia
    data_type: INT64
    required: true
    nullable: false
    description: Ano de referência da consolidação estatística SINESP-VDE / FBSP
