contract_id: ODCS-BR-CGU-SERVIDORES-SIAPE-001
source_id: cgu_servidores_federais
version: 1.0.0
grain: 1 row per SIAPE federal personnel regime and municipality (CGU Portal da Transparência)
name: "CGU / SIAPE Servidores Federais: Funcionalismo, Folha & Acúmulos"
agency: Controladoria-Geral da União (CGU) & Ministério da Gestão e da Inovação (MGI / SIAPE)
official_url: https://portaldatransparencia.gov.br/servidores
segment_id: 08_judicial_compliance
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Mensal (Folha de Pagamento SIAPE & Cadastro de Vínculos Federais)
freshness_sla_hours: 720
cron_schedule_expression: "0 5 10 * *"
lgpd_legal_basis: public_interest_lei_12527_2011_lai_e_stf_re_652777_agregacao_municipal
min_expected_rows: 10
primary_keys:
  - cod_lotacao_siape
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_lotacao_siape
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único do agrupamento de vínculos funcionais SIAPE por regime e município
  - name: orgao_exercicio_codigo
    data_type: STRING
    required: true
    nullable: false
    description: Código SIAPE/SIAFI do órgão ou entidade federal de exercício predominante
  - name: regime_juridico_siape
    data_type: STRING
    required: true
    nullable: false
    description: Regime jurídico de contratação (RJU_ESTATUTARIO, MILITAR_FA ou CLT_ESTATAIS)
  - name: situacao_vinculo
    data_type: STRING
    required: true
    nullable: false
    description: Situação funcional do agrupamento (ATIVO_PERMANENTE, APOSENTADO_PENSIONISTA ou CEDIDO_REQUISITADO)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município de lotação UORG
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: qtd_servidores_lotados
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade mensal de servidores federais vinculados no agrupamento no município
  - name: massa_salarial_bruta_mil_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Massa salarial mensal bruta paga pelo Tesouro no agrupamento (R$ mil)
  - name: competencia_siape
    data_type: STRING
    required: true
    nullable: false
    description: Competência mensal de fechamento da folha SIAPE (YYYY-MM)
