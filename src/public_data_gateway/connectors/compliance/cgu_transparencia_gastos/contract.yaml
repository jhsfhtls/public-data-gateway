contract_id: ODCS-BR-CGU-TRANSPARENCIA-GASTOS-001
source_id: cgu_transparencia_gastos
version: 1.0.0
grain: 1 row per federal expense modality and municipality (CGU Portal da Transparência)
name: "CGU Portal da Transparência: Gastos Diretos, Transferências & Convênios"
agency: Controladoria-Geral da União (CGU) / Portal da Transparência do Governo Federal
official_url: https://portaldatransparencia.gov.br/despesas
segment_id: 08_judicial_compliance
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Diária (Execução Orçamentária SIAFI & CPGF) / Mensal (Transferências Constitucionais)
freshness_sla_hours: 168
cron_schedule_expression: "0 4 * * *"
lgpd_legal_basis: public_interest_lei_12527_2011_e_lc_131_2009_transparencia_fiscal
min_expected_rows: 10
primary_keys:
  - cod_despesa_cgu
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_despesa_cgu
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único do agrupamento de execução financeira federal CGU por município e modalidade
  - name: orgao_superior_codigo
    data_type: STRING
    required: true
    nullable: false
    description: Código SIAFI do órgão superior executor ou repassador dos recursos federais
  - name: funcao_orcamentaria
    data_type: STRING
    required: true
    nullable: false
    description: Função programática da despesa pública (SAUDE_EDUCACAO, INFRAESTRUTURA_DESENVOLVIMENTO ou ADMINISTRACAO_SEGURANCA)
  - name: modalidade_gasto_federal
    data_type: STRING
    required: true
    nullable: false
    description: Modalidade de aplicação financeira (TRANSFERENCIA_CONSTITUCIONAL, CONVENIO_REPASSE ou EXECUCAO_DIRETA_CPGF)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município beneficiário ou executor
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: valor_empenhado_mil_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Dotação orçamentária anual empenhada na modalidade no município (R$ mil)
  - name: valor_pago_mil_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Montante financeiro efetivamente pago e transferido no exercício (R$ mil)
  - name: ano_exercicio
    data_type: INT64
    required: true
    nullable: false
    description: Ano fiscal do exercício orçamentário federal
