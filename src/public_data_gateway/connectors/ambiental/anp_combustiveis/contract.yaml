contract_id: ODCS-BR-ANP-COMBUSTIVEIS-001
source_id: anp_combustiveis
version: 1.0.0
grain: 1 row per fuel type weekly price survey by municipality (LPC ANP)
name: "ANP Combustíveis: Levantamento de Preços, Margens & Biocombustíveis"
agency: Agência Nacional do Petróleo, Gás Natural e Biocombustíveis (ANP)
official_url: https://www.gov.br/anp/pt-br/assuntos/precos-e-defesa-da-concorrencia/precos/levantamento-de-precos-de-combustiveis-ultimas-semanas-pesquisadas
segment_id: 11_agronegocio_meio_ambiente
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Semanal (LPC Preços) / Mensal (Vendas Derivados & PMQC)
freshness_sla_hours: 168
cron_schedule_expression: "0 5 * * 1"
lgpd_legal_basis: public_interest_lai_lei_9478_1997_lei_12490_2011
min_expected_rows: 10
primary_keys:
  - cod_coleta_anp
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_coleta_anp
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único da coleta municipal por combustível no Levantamento de Preços (LPC ANP)
  - name: produto_combustivel
    data_type: STRING
    required: true
    nullable: false
    description: Combustível pesquisado pela ANP (GASOLINA_COMUM, ETANOL_HIDRATADO, DIESEL_S10 ou GLP_13KG)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município pesquisado
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município incluído no levantamento semanal ANP
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião brasileira oficial da localidade (IBGE/ANP)
  - name: preco_medio_revenda_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Preço médio de revenda na bomba ao consumidor final em Reais (BRL/litro)
  - name: preco_medio_distribuicao_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Preço médio praticado pelas distribuidoras para os postos revendedores em Reais (BRL/litro)
  - name: margem_media_revenda_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Margem bruta média de revenda varejista (revenda menos distribuição) em Reais (BRL/litro)
  - name: desvio_padrao_revenda_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Dispersão (desvio padrão) observada entre os postos amostrados no município (BRL/litro)
  - name: qtd_postos_pesquisados
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade de postos revendedores fiscalizados/pesquisados na semana de coleta
  - name: data_coleta
    data_type: STRING
    required: true
    nullable: false
    description: Data de referência da semana de pesquisa de preços LPC ANP (ISO-8601)
