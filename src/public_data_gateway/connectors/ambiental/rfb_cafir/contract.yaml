contract_id: ODCS-BR-RFB-CAFIR-001
source_id: rfb_cafir
version: 1.0.0
grain: 1 row per registered rural property in Receita Federal CAFIR (NIRF/CIB)
name: "Receita Federal: Cadastro de Imóveis Rurais (CAFIR / CIB / CNIR)"
agency: Secretaria Especial da Receita Federal do Brasil (RFB) / INCRA
official_url: https://www.gov.br/receitafederal/pt-br/assuntos/orientacao-tributaria/tributos/itr
segment_id: 11_agronegocio_meio_ambiente
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Mensal (Dados Abertos RFB CAFIR / CNIR)
freshness_sla_hours: 720
cron_schedule_expression: "0 4 20 * *"
lgpd_legal_basis: public_interest_lai_lei_9393_1996_in_rfb_2008_2021
min_expected_rows: 10
primary_keys:
  - nirf_cib
  - id_municipio
  - sigla_uf
canonical_keys:
  - cnpj_14
  - cpf_masked
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: nirf_cib
    data_type: STRING
    required: true
    nullable: false
    description: Número do Imóvel na Receita Federal (NIRF) / Cadastro Imobiliário Brasileiro (CIB) de 8 dígitos
  - name: codigo_incra_sncr
    data_type: STRING
    required: true
    nullable: false
    description: Código de 13 dígitos do imóvel rural no SNCR/INCRA vinculado via CNIR
  - name: documento_titular
    data_type: STRING
    required: true
    nullable: false
    description: CNPJ de 14 dígitos do titular PJ ou CPF mascarado LGPD de pessoa física (***.XXX.YYY-**)
  - name: nome_titular
    data_type: STRING
    required: true
    nullable: false
    description: Razão social ou identificação pública do titular declarante no CAFIR/ITR
  - name: nome_imovel_rural
    data_type: STRING
    required: true
    nullable: false
    description: Denominação declarada da propriedade ou gleba rural no CAFIR
  - name: situacao_cafir
    data_type: STRING
    required: true
    nullable: false
    description: Status cadastral no CAFIR/CNIR (Ativo_Vinculado_CNIR ou Ativo_Em_Regularizacao)
  - name: forma_exploracao
    data_type: STRING
    required: true
    nullable: false
    description: Destinação econômica predominante declarada (Agricultura_Lavoura, Pecuaria_Pastagem ou Silvicultura_Reserva)
  - name: area_total_ha
    data_type: FLOAT64
    required: true
    nullable: false
    description: Área total registrada do imóvel rural no CAFIR em hectares (ha)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município de localização do imóvel rural
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município de localização do imóvel
  - name: data_atualizacao
    data_type: STRING
    required: true
    nullable: false
    description: Data da última atualização cadastral no CAFIR/CNIR no formato ISO-8601 (YYYY-MM-DD)
