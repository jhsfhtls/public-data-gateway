contract_id: ODCS-BR-INPE-QUEIMADAS-SEEG-001
source_id: inpe_queimadas_seeg
version: 1.0.0
grain: 1 row per active fire hotspot detected by INPE BDQueimadas satellites
name: "INPE Queimadas & SEEG: Focos de Calor & Emissões de Gases de Efeito Estufa"
agency: Instituto Nacional de Pesquisas Espaciais (INPE) / Observatório do Clima (SEEG)
official_url: https://dataserver-coids.inpe.br/queimadas/queimadas/focos/csv/diario/Brasil/
segment_id: 11_agronegocio_meio_ambiente
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Diária (Focos INPE) / Anual (Inventário GEE SEEG)
freshness_sla_hours: 24
cron_schedule_expression: "0 3 * * *"
lgpd_legal_basis: public_interest_lai_lei_12187_2009_dec_2661_1998
min_expected_rows: 10
primary_keys:
  - cod_foco_inpe
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_foco_inpe
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único do foco de calor detectado pelos satélites do Programa Queimadas INPE
  - name: satelite_referencia
    data_type: STRING
    required: true
    nullable: false
    description: Satélite detector da ocorrência (AQUA_M-T, NOAA-20 ou NPP-375)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município onde ocorreu o foco
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município monitorado
  - name: bioma
    data_type: STRING
    required: true
    nullable: false
    description: Bioma brasileiro associado às coordenadas do foco de calor
  - name: data_hora_gmt
    data_type: STRING
    required: true
    nullable: false
    description: Carimbo temporal ISO-8601 UTC da passagem orbital do satélite
  - name: risco_fogo
    data_type: FLOAT64
    required: true
    nullable: false
    description: Índice de Risco de Fogo do INPE na data da detecção (0.0 a 1.0)
  - name: frp_mw
    data_type: FLOAT64
    required: true
    nullable: false
    description: Potência Radiativa do Fogo (Fire Radiative Power) em Megawatts (MW)
  - name: dias_sem_chuva
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade acumulada de dias consecutivos sem precipitação na célula do foco
  - name: precipitacao_mm
    data_type: FLOAT64
    required: true
    nullable: false
    description: Precipitação diária estimada na data do registro em milímetros (mm)
  - name: latitude
    data_type: FLOAT64
    required: true
    nullable: false
    description: Latitude WGS84 do pixel de detecção térmica
  - name: longitude
    data_type: FLOAT64
    required: true
    nullable: false
    description: Longitude WGS84 do pixel de detecção térmica
