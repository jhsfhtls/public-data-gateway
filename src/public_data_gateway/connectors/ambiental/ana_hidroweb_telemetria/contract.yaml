schema_version: "3.1.0"
contract_id: "ODCS-BR-ANA-HIDROWEB-001"
source_id: "ana_hidroweb_telemetria"
version: "1.0.0"
name: "ANA: Rede Hidrometeorológica Nacional (HidroWeb)"
agency: "Agência Nacional de Águas e Saneamento Básico (ANA)"
official_url: "https://www.snirh.gov.br/hidroweb/"

legal_framework:
  statutes:
    - name: "Lei nº 9.433/1997 (Política Nacional de Recursos Hídricos)"
      description: "Institui a Política Nacional de Recursos Hídricos e cria o Sistema Nacional de Informações sobre Recursos Hídricos (SNIRH)"
    - name: "Lei nº 9.984/2000 & Lei nº 14.026/2020"
      description: "Dispõe sobre a criação da ANA e atribui competência de monitoramento hidrológico e regulação de segurança hídrica"
    - name: "Resolução ANA nº 1.041/2018 & Portaria Conjunta ANA/ANEEL nº 03/2010"
      description: "Estabelecem diretrizes para operação de estações telemétricas, transmissão de cotas/vazões e qualidade de dados hidrometeorológicos"
    - name: "Lei nº 12.608/2012 (PNPDEC)"
      description: "Institui a Política Nacional de Proteção e Defesa Civil com uso de alertas hidrológicos de cheias e estiagens"
    - name: "Lei nº 12.527/2011 (LAI) & Decreto nº 8.777/2016"
      description: "Regem a transparência ativa e a publicação em dados abertos das séries históricas e telemetria do Portal HidroWeb"

data_governance:
  grain: "municipio_monitoramento_hidroweb"
  primary_keys:
    - "id_municipio"
    - "sigla_uf"
  reference_date_column: "reference_date"
  min_expected_rows: 10
  max_volume_drop_pct: 15.0
  freshness_sla_hours: 24
  lgpd_tier: "PUBLIC_NON_PERSONAL"
  ml_feature_domains:
    - "river_levels"
    - "hydro_telemetry"

schema:
  tables:
    hidroweb_estacoes_telemetricas_rede:
      description: "Cobertura e disponibilidade operacional das estações fluviométricas e pluviométricas telemétricas da Rede Hidrometeorológica Nacional (ANA/HidroWeb) por município."
      grain: "id_municipio, ano_referencia"
      primary_keys: ["id_municipio", "ano_referencia"]
      min_expected_rows: 12
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos identificador único do município."
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município."
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla de 2 letras da Unidade Federativa."
        - name: "id_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 2 dígitos da Unidade Federativa."
        - name: "regiao"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Grande região geográfica brasileira segundo o IBGE."
        - name: "regiao_hidrografica"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Região ou bacia hidrográfica predominante no município segundo o SNIRH/ANA."
        - name: "ano_referencia"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Ano-calendário de consolidação operacional da rede telemétrica."
        - name: "qtd_estacoes_telemetricas_ativas"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade total de estações telemétricas ativas no município e entorno imediato da sub-bacia."
        - name: "qtd_estacoes_fluviometricas"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de estações com medição de cota e vazão fluvial."
        - name: "qtd_estacoes_pluviometricas"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de estações com medição pluviométrica telemétrica."
        - name: "disponibilidade_telemetria_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual de disponibilidade de transmissão telemétrica em janela horária (0-100)."
        - name: "densidade_rede_estacoes_1000km2"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Densidade espacial da rede hidrometeorológica por 1.000 km2."
        - name: "indice_cobertura_rede_hidroweb"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Índice composto de cobertura e disponibilidade telemétrica HidroWeb (0-100)."
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência da extração em formato ISO YYYY-MM-DD."

