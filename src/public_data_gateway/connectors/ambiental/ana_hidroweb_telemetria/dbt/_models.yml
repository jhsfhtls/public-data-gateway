version: 2

models:
  - name: stg_ana_hidroweb_estacoes_telemetricas
    description: "Staging tipada da cobertura e disponibilidade das estações telemétricas HidroWeb/ANA por município."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests: [not_null, unique]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: sigla_uf
        description: "Sigla da Unidade Federativa."
        tests: [not_null]
      - name: id_uf
        description: "Código IBGE de 2 dígitos da UF."
        tests: [not_null]
      - name: regiao
        description: "Grande região geográfica brasileira."
        tests: [not_null]
      - name: regiao_hidrografica
        description: "Região ou bacia hidrográfica predominante."
        tests: [not_null]
      - name: ano_referencia
        description: "Ano de referência da rede telemétrica."
        tests: [not_null]
      - name: qtd_estacoes_telemetricas_ativas
        description: "Total de estações telemétricas ativas."
        tests: [not_null]
      - name: qtd_estacoes_fluviometricas
        description: "Quantidade de estações fluviométricas."
        tests: [not_null]
      - name: qtd_estacoes_pluviometricas
        description: "Quantidade de estações pluviométricas."
        tests: [not_null]
      - name: disponibilidade_telemetria_pct
        description: "Disponibilidade percentual da transmissão telemétrica."
        tests: [not_null]
      - name: densidade_rede_estacoes_1000km2
        description: "Densidade da rede de estações por 1.000 km2."
        tests: [not_null]
      - name: indice_cobertura_rede_hidroweb
        description: "Índice de cobertura e disponibilidade da rede HidroWeb (0-100)."
        tests: [not_null]
      - name: reference_date
        description: "Data de referência ISO YYYY-MM-DD."
        tests: [not_null]

