contract_id: ODCS-BR-MME-ONS-ENERGIA-001
source_id: mme_ons_energia
version: 1.0.0
grain: 1 row per SIN power generation plant and municipality (ONS Dados Abertos)
name: "MME / ONS Energia: Sistema Interligado Nacional, Balanço & Segurança Energética"
agency: Operador Nacional do Sistema Elétrico (ONS) & Ministério de Minas e Energia (MME)
official_url: https://dados.ons.org.br
segment_id: 11_agronegocio_meio_ambiente
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Diária (Operação SIN / Carga & Energia Armazenada) / Mensal (Capacidade)
freshness_sla_hours: 168
cron_schedule_expression: "0 5 * * 1"
lgpd_legal_basis: public_interest_lei_9648_1998_operacao_sistema_interligado_nacional
min_expected_rows: 10
primary_keys:
  - cod_usina_ons
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_usina_ons
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único do empreendimento ou conjunto gerador no Sistema Interligado Nacional (ONS)
  - name: ceg_aneel
    data_type: STRING
    required: true
    nullable: false
    description: Código Único de Empreendimento de Geração (CEG ANEEL) vinculado à usina
  - name: nome_usina_ons
    data_type: STRING
    required: true
    nullable: false
    description: Denominação operacional do complexo gerador despachado no SIN
  - name: fonte_geracao_sin
    data_type: STRING
    required: true
    nullable: false
    description: Fonte primária de geração elétrica (HIDROELETRICA, EOLICA, SOLAR_FOTOVOLTAICA, TERMICA_BIOMASSA)
  - name: subsistema_sin
    data_type: STRING
    required: true
    nullable: false
    description: Subsistema geoelétrico do SIN (SUDESTE_CENTRO_OESTE, SUL, NORDESTE ou NORTE)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município sede do ativo ou subestação
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: capacidade_instalada_mw
    data_type: FLOAT64
    required: true
    nullable: false
    description: Potência elétrica instalada sincronizada no SIN em megawatts (MW)
  - name: geracao_media_verificada_mwmed
    data_type: FLOAT64
    required: true
    nullable: false
    description: Geração média anual verificada em megawatts médios (MWmed)
