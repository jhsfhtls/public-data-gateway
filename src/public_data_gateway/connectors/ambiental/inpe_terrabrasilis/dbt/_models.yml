      - name: sigla_uf
        description: "Sigla da Unidade Federativa."
        tests: [not_null]
      - name: id_uf
        description: "Código IBGE da UF."
        tests: [not_null]
      - name: regiao
        description: "Grande região geográfica brasileira."
        tests: [not_null]
      - name: ano_prodes
        description: "Ano de referência dos alertas DETER."
        tests: [not_null]
      - name: classe_alerta_deter
        description: "Classe de alerta DETER-B."
        tests: [not_null]
      - name: num_alertas_deter_ano
        description: "Quantidade de alertas DETER na classe."
        tests: [not_null]
      - name: area_alertas_deter_km2
        description: "Área total dos alertas DETER na classe (km²)."
        tests: [not_null]
      - name: area_media_poligono_ha
        description: "Área média por polígono de alerta (hectares)."
        tests: [not_null]
      - name: alertas_em_uc_ti_pct
        description: "Percentual de alertas em UC/TI (%)."
        tests: [not_null]
      - name: dias_medios_emissao_alerta
        description: "Latência média em dias para emissão do alerta."
        tests: [not_null]
      - name: proporcao_classe_sobre_total_pct
        description: "Participação percentual da classe sobre a área total (%)."
        tests: [not_null]
      - name: reference_date
        description: "Data de referência do ciclo anual TerraBrasilis."
        tests: [not_null]
      - name: extracted_at
        description: "Timestamp UTC da materialização."
        tests: [not_null]

