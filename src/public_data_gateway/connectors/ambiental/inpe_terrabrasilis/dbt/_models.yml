version: 2

models:
  - name: stg_terrabrasilis_prodes_desmatamento_anual
    description: "Staging view do monitoramento anual PRODES e cobertura florestal remanescente por município."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests: [not_null, unique]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: sigla_uf
        description: "Sigla da Unidade Federativa."
        tests: [not_null]
      - name: id_uf
        description: "Código IBGE da UF."
        tests: [not_null]
      - name: regiao
        description: "Grande região geográfica brasileira."
        tests: [not_null]
      - name: bioma_predominante
        description: "Bioma predominante no município."
        tests: [not_null]
      - name: ano_prodes
        description: "Ano-calendário PRODES de referência."
        tests: [not_null]
      - name: area_desmatada_prodes_km2
        description: "Incremento anual de desmatamento PRODES (km²)."
        tests: [not_null]
      - name: desmatamento_acumulado_km2
        description: "Desmatamento acumulado histórico no município (km²)."
        tests: [not_null]
      - name: cobertura_florestal_remanescente_pct
        description: "Percentual de cobertura florestal remanescente (%)."
        tests: [not_null]
      - name: variacao_anual_prodes_pct
        description: "Variação percentual anual do desmatamento PRODES (%)."
        tests: [not_null]
      - name: taxa_desmatamento_relativa_area_pct
        description: "Taxa relativa de desmatamento anual (%)."
        tests: [not_null]
      - name: focos_calor_associados_ano
        description: "Focos de calor associados a alertas no ano."
        tests: [not_null]
      - name: reference_date
        description: "Data de referência do ciclo anual TerraBrasilis."
        tests: [not_null]
      - name: extracted_at
        description: "Timestamp UTC da materialização."
        tests: [not_null]

  - name: stg_terrabrasilis_deter_alertas_classe
    description: "Staging view de alertas DETER-B desagregados por classe de alerta e município."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
