schema_version: "3.1.0"
contract_id: "ODCS-BR-INPE-TERRABRASILIS-001"
source_id: "inpe_terrabrasilis"
version: "1.0.0"
name: "INPE: Plataforma TerraBrasilis (DETER & PRODES)"
agency: "Instituto Nacional de Pesquisas Espaciais (INPE)"
official_url: "http://terrabrasilis.dpi.inpe.br/"

legal_framework:
  statutes:
    - name: "Lei nº 12.651/2012 (Código Florestal)"
      description: "Dispõe sobre a proteção da vegetação nativa, Áreas de Preservação Permanente (APP), Reserva Legal e Cadastro Ambiental Rural (CAR)"
    - name: "Decreto nº 7.830/2012 & Decreto nº 8.235/2014"
      description: "Regulam o Sistema de Cadastro Ambiental Rural (SICAR) e os Programas de Regularização Ambiental (PRA)"
    - name: "Lei Complementar nº 140/2011"
      description: "Fixa normas de cooperação federativa para fiscalização ambiental, combate ao desmatamento e licenciamento"
    - name: "Resolução BCB nº 140/2021 & Regulação EUDR (EU 2023/1115)"
      description: "Define critérios socioambientais para crédito rural sustentável e rastreabilidade livre de desmatamento"
    - name: "Lei nº 12.527/2011 (LAI) & Decreto nº 8.777/2016"
      description: "Regem a transparência ativa e os dados abertos geoespaciais dos sistemas PRODES e DETER do INPE"

data_governance:
  grain: "municipio_monitoramento_terrabrasilis"
  primary_keys:
    - "id_municipio"
    - "sigla_uf"
  reference_date_column: "reference_date"
  min_expected_rows: 10
  max_volume_drop_pct: 15.0
  freshness_sla_hours: 24
  lgpd_tier: "PUBLIC_NON_PERSONAL"
  ml_feature_domains:
    - "deforestation_alerts"
    - "environmental_compliance"

schema:
  tables:
    terrabrasilis_prodes_desmatamento_anual:
      description: "Monitoramento anual consolidado de corte raso e cobertura florestal remanescente via PRODES/INPE por município."
      grain: "id_municipio, ano_prodes"
      primary_keys: ["id_municipio", "ano_prodes"]
      min_expected_rows: 12
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos identificador único do município."
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município."
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla de 2 letras da Unidade Federativa."
        - name: "id_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 2 dígitos da Unidade Federativa."
        - name: "regiao"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Grande região geográfica brasileira segundo o IBGE."
        - name: "bioma_predominante"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Bioma predominante no território municipal (Amazonia, Cerrado, Mata_Atlantica)."
        - name: "ano_prodes"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Ano-calendário PRODES de apuração do incremento anual de desmatamento."
        - name: "area_desmatada_prodes_km2"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Incremento anual de supressão vegetal apurado pelo PRODES (km²)."
        - name: "desmatamento_acumulado_km2"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Área acumulada histórica de desmatamento no município (km²)."
        - name: "cobertura_florestal_remanescente_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual de cobertura florestal e vegetação nativa remanescente (%)."
        - name: "variacao_anual_prodes_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Variação percentual do incremento anual PRODES frente ao ciclo anterior (%)."
        - name: "taxa_desmatamento_relativa_area_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Taxa anual de desmatamento sobre a área florestal municipal (%)."
        - name: "focos_calor_associados_ano"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Focos ativos de calor associados a polígonos de supressão no ano."
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência da consolidação PRODES (YYYY-MM-DD)."
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp UTC ISO-8601 da materialização."

