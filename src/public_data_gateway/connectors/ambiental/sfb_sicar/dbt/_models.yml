version: 2

models:
  - name: stg_sfb_sicar_imoveis_rurais
    description: "Staging tipada do estoque municipal de imóveis rurais inscritos no SICAR."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests: [not_null, unique]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: sigla_uf
        description: "Sigla da Unidade Federativa."
        tests: [not_null]
      - name: id_uf
        description: "Código IBGE de 2 dígitos da UF."
        tests: [not_null]
      - name: regiao
        description: "Grande região geográfica brasileira."
        tests: [not_null]
      - name: bioma_predominante
        description: "Bioma predominante."
        tests: [not_null]
      - name: ano_referencia
        description: "Ano de referência SICAR."
        tests: [not_null]
      - name: qtd_imoveis_car_ativos
        description: "Quantidade de imóveis ativos no CAR."
        tests: [not_null]
      - name: area_cadastrada_car_ha
        description: "Área total cadastrada no CAR (ha)."
        tests: [not_null]
      - name: area_media_imovel_ha
        description: "Área média por imóvel rural (ha)."
        tests: [not_null]
      - name: imoveis_analise_concluida_pct
        description: "Percentual de imóveis com análise concluída (%)."
        tests: [not_null]
      - name: indice_cobertura_cadastral_car
        description: "Índice composto de cobertura cadastral CAR (0-100)."
        tests: [not_null]
      - name: reference_date
        description: "Data de referência ISO YYYY-MM-DD."
        tests: [not_null]

  - name: stg_sfb_sicar_reserva_legal_app
    description: "Staging tipada de Reserva Legal, APP e passivo ambiental por categoria fundiária no SICAR."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: sigla_uf
        description: "Sigla da UF."
        tests: [not_null]
      - name: id_uf
        description: "Código IBGE de 2 dígitos da UF."
        tests: [not_null]
      - name: regiao
        description: "Grande região geográfica."
        tests: [not_null]
      - name: bioma_predominante
        description: "Bioma predominante."
        tests: [not_null]
      - name: categoria_imovel_car
        description: "Categoria fundiária do imóvel rural."
        tests: [not_null]
      - name: qtd_imoveis_categoria
        description: "Quantidade de imóveis na categoria."
        tests: [not_null]
      - name: area_reserva_legal_declarada_ha
        description: "Área de Reserva Legal declarada (ha)."
        tests: [not_null]
      - name: area_app_preservada_ha
        description: "Área de APP preservada (ha)."
        tests: [not_null]
      - name: taxa_passivo_ambiental_pct
        description: "Taxa de passivo ambiental em RL/APP (%)."
        tests: [not_null]
      - name: conformidade_reserva_legal_pct
        description: "Conformidade percentual de Reserva Legal (%)."
        tests: [not_null]
      - name: reference_date
        description: "Data de referência ISO YYYY-MM-DD."
        tests: [not_null]

  - name: stg_sfb_sicar_regularizacao_pra
