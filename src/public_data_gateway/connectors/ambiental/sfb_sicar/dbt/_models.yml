      - name: sigla_uf
        description: "Sigla da UF."
        tests: [not_null]
      - name: id_uf
        description: "Código IBGE de 2 dígitos da UF."
        tests: [not_null]
      - name: regiao
        description: "Grande região geográfica."
        tests: [not_null]
      - name: bioma_predominante
        description: "Bioma predominante."
        tests: [not_null]
      - name: qtd_imoveis_aderidos_pra
        description: "Quantidade de imóveis aderidos ao PRA."
        tests: [not_null]
      - name: imoveis_sem_sobreposicao_ti_uc_pct
        description: "Percentual de imóveis livres de sobreposição TI/UC."
        tests: [not_null]
      - name: imoveis_livres_embargo_ibama_pct
        description: "Percentual de imóveis livres de embargo ambiental."
