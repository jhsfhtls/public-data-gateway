schema_version: "3.1.0"
contract_id: "ODCS-BR-SFB-SICAR-001"
source_id: "sfb_sicar"
version: "1.0.0"
name: "SFB: Sistema Nacional de Cadastro Ambiental Rural (SICAR)"
agency: "Serviço Florestal Brasileiro (SFB) / MMA"
official_url: "https://www.car.gov.br/"

legal_framework:
  statutes:
    - name: "Lei nº 12.651/2012 (Código Florestal - Art. 29)"
      description: "Cria o Cadastro Ambiental Rural (CAR) como registro público eletrônico nacional obrigatório para todos os imóveis rurais"
    - name: "Decreto nº 7.830/2012 & Decreto nº 8.235/2014"
      description: "Dispõem sobre o Sistema de Cadastro Ambiental Rural (SICAR) e os Programas de Regularização Ambiental (PRA)"
    - name: "Resolução BCB nº 140/2021 & Regulação EUDR (EU 2023/1115)"
      description: "Condicionam crédito rural e exportação de commodities à regularidade cadastral CAR e ausência de sobreposição/desmatamento"
    - name: "Lei nº 12.527/2011 (LAI) & Instrução Normativa MMA nº 2/2014"
      description: "Regem a publicidade dos polígonos, Reserva Legal, APP e status de análise do SICAR"

data_governance:
  grain: "municipio_cadastro_sicar"
  primary_keys:
    - "id_municipio"
    - "sigla_uf"
  reference_date_column: "reference_date"
  min_expected_rows: 10
  max_volume_drop_pct: 15.0
  freshness_sla_hours: 24
  lgpd_tier: "PUBLIC_NON_PERSONAL"
  ml_feature_domains:
    - "rural_properties"
    - "legal_reserve_polygons"

schema:
  tables:
    sicar_imoveis_rurais_municipio:
      description: "Estoque municipal de imóveis rurais inscritos no SICAR, área cadastrada e percentual com análise concluída."
      grain: "id_municipio, ano_referencia"
      primary_keys: ["id_municipio", "ano_referencia"]
      min_expected_rows: 12
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos do município."
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município."
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla de 2 letras da Unidade Federativa."
        - name: "id_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 2 dígitos da UF."
        - name: "regiao"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Grande região geográfica brasileira."
        - name: "bioma_predominante"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Bioma predominante no município."
        - name: "ano_referencia"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Ano de consolidação da base SICAR."
        - name: "qtd_imoveis_car_ativos"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade total de imóveis rurais ativos inscritos no CAR."
        - name: "area_cadastrada_car_ha"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Área total dos imóveis inscritos no CAR em hectares."
        - name: "area_media_imovel_ha"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Área média por imóvel rural cadastrado (ha)."
        - name: "imoveis_analise_concluida_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual de cadastros com análise técnica estadual/federal concluída (%)."
        - name: "indice_cobertura_cadastral_car"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Índice composto de cobertura e análise cadastral CAR (0-100)."
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência ISO YYYY-MM-DD."

