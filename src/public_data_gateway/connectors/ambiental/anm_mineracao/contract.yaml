contract_id: ODCS-BR-ANM-MINERACAO-SIGMINE-CFEM-001
source_id: anm_mineracao
version: 1.0.0
grain: 1 row per ANM mining process, mineral substance, and municipality (SIGMINE & CFEM)
name: "ANM Mineração (SIGMINE & CFEM): Processos Minerários, Lavra & Royalties"
agency: Agência Nacional de Mineração (ANM)
official_url: https://www.gov.br/anm/pt-br/acesso-a-informacao/dados-abertos
segment_id: 11_agronegocio_meio_ambiente
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Semanal (SIGMINE Processos Minerários & SIGBM Barragens) / Mensal (CFEM Royalties)
freshness_sla_hours: 168
cron_schedule_expression: "0 6 * * 1"
lgpd_legal_basis: public_interest_codigo_mineracao_dl_227_1967_lei_13575_2017_transparencia_anm
min_expected_rows: 10
primary_keys:
  - cod_processo_anm
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_processo_anm
    data_type: STRING
    required: true
    nullable: false
    description: Número único do processo minerário registrado no SIGMINE/ANM
  - name: substancia_mineral
    data_type: STRING
    required: true
    nullable: false
    description: Substância mineral outorgada ou pesquisada (FERRO, OURO, LITIO_TERRAS_RARAS, BAUXITA, COBRE, GRANITO_AGREGADOS)
  - name: fase_processo_sigmine
    data_type: STRING
    required: true
    nullable: false
    description: Fase processual do título minerário no SIGMINE (CONCESSAO_LAVRA, AUTORIZACAO_PESQUISA, LICENCIAMENTO)
  - name: situacao_barragem_sigbm
    data_type: STRING
    required: true
    nullable: false
    description: Classificação de conformidade no Sistema de Gestão de Segurança de Barragens de Mineração (CONFORME_PAEBM, MONITORAMENTO_ATIVO, SEM_BARRAGEM_PAEBM)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município incidente da poligonal minerária
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: area_titulada_hectares
    data_type: FLOAT64
    required: true
    nullable: false
    description: Área poligonal titulada do processo minerário em hectares (ha)
  - name: arrecadacao_cfem_anual_mil_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Arrecadação anual de Compensação Financeira pela Exploração Mineral (CFEM) em milhares de reais
  - name: ano_referencia
    data_type: INT64
    required: true
    nullable: false
    description: Ano-calendário de referência da apuração SIGMINE e CFEM
