contract_id: ODCS-BR-MDR-SNIS-001
source_id: mdr_snis
version: 1.0.0
grain: 1 row per municipal water and sewage sanitation service evaluation (SNIS/SINISA)
name: "MDR/MCidades SNIS & SINISA: Saneamento Básico (Água, Esgoto & Resíduos)"
agency: Ministério das Cidades (SNIS / SINISA)
official_url: https://www.gov.br/cidades/pt-br/acesso-a-informacao/acoes-e-programas/saneamento/snis
segment_id: 11_agronegocio_meio_ambiente
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Anual (Série Histórica SNIS/SINISA Água, Esgoto, RSU e Drenagem)
freshness_sla_hours: 720
cron_schedule_expression: "0 5 1 * *"
lgpd_legal_basis: public_interest_lei_14026_2020_novo_marco_saneamento
min_expected_rows: 10
primary_keys:
  - cod_snis_ae
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_snis_ae
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único do registro municipal de Água e Esgoto no SNIS/SINISA
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município atendido
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município monitorado pelo SNIS/SINISA
  - name: prestador_servico
    data_type: STRING
    required: true
    nullable: false
    description: Prestador ou operadora principal de saneamento no município
  - name: natureza_juridica_prestador
    data_type: STRING
    required: true
    nullable: false
    description: Regime jurídico do prestador (AUTARQUIA_MUNICIPAL, COMPANHIA_ESTADUAL, CONCESSAO_PRIVADA ou PPP)
  - name: atendimento_agua_total_pct
    data_type: FLOAT64
    required: true
    nullable: false
    description: Índice IN055 de atendimento total de população com rede de abastecimento de água (%)
  - name: atendimento_esgoto_total_pct
    data_type: FLOAT64
    required: true
    nullable: false
    description: Índice IN056 de atendimento total de população com rede coletora de esgotos (%)
  - name: esgoto_tratado_sobre_consumido_pct
    data_type: FLOAT64
    required: true
    nullable: false
    description: Índice IN046 de esgoto tratado referido à água consumida no município (%)
  - name: indice_perdas_distribuicao_pct
    data_type: FLOAT64
    required: true
    nullable: false
    description: Índice IN049 de perdas na distribuição de água tratada na rede municipal (%)
  - name: ano_referencia
    data_type: INT64
    required: true
    nullable: false
    description: Ano de referência do levantamento anual SNIS/SINISA
