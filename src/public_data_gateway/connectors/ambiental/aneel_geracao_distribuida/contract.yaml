contract_id: ODCS-BR-ANEEL-MMGD-001
source_id: aneel_geracao_distribuida
version: 1.0.0
grain: 1 row per distributed micro/mini generation unit registered under ANEEL SISGD/SIGA
name: "ANEEL Geração Distribuída: Empreendimentos MMGD & Transição Solar"
agency: Agência Nacional de Energia Elétrica (ANEEL)
official_url: https://dadosabertos.aneel.gov.br/dataset/relacao-de-empreendimentos-de-geracao-distribuida
segment_id: 11_agronegocio_meio_ambiente
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Semanal (Empreendimentos MMGD SIGA/SISGD)
freshness_sla_hours: 168
cron_schedule_expression: "0 4 * * 1"
lgpd_legal_basis: public_interest_lei_14300_2022_ren_aneel_1000_2021
min_expected_rows: 10
primary_keys:
  - cod_empreendimento_mmgd
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_empreendimento_mmgd
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único do empreendimento ou unidade consumidora MMGD na ANEEL
  - name: sig_tipo_geracao
    data_type: STRING
    required: true
    nullable: false
    description: Sigla da fonte primária de geração (UFV, UTE, EOL ou CGH)
  - name: classe_consumo
    data_type: STRING
    required: true
    nullable: false
    description: Classe tarifária de consumo atendida (Residencial, Comercial, Rural ou Industrial)
  - name: modalidade_mmgd
    data_type: STRING
    required: true
    nullable: false
    description: Modalidade regulatória de compensação de energia (Lei nº 14.300/2022)
  - name: distribuidora
    data_type: STRING
    required: true
    nullable: false
    description: Concessionária ou permissionária distribuidora de energia elétrica conectante
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município da unidade geradora
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município onde a usina MMGD está conectada
  - name: potencia_instalada_kw
    data_type: FLOAT64
    required: true
    nullable: false
    description: Potência instalada declarada do sistema de geração distribuída em kW
  - name: qtd_modulos_instalados
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade de módulos ou unidades geradoras homologadas no empreendimento
  - name: qtd_unidades_beneficiarias
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade de unidades consumidoras beneficiárias no rateio de créditos
  - name: data_conexao
    data_type: STRING
    required: true
    nullable: false
    description: Data oficial da vistoria e conexão à rede distribuidora (ISO-8601)
  - name: tipo_titular
    data_type: STRING
    required: true
    nullable: false
    description: Enquadramento jurídico do titular mascarado em conformidade LGPD (PF ou PJ)
