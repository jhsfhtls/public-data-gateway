contract_id: ODCS-BR-MPS-INSS-BENEFICIOS-001
source_id: mps_inss_beneficios
version: 1.0.0
grain: 1 row per INSS benefit species group and municipality (MPS/Dataprev Open Data)
name: "MPS / INSS Benefícios: Previdência Social, BPC/LOAS & Arrecadação"
agency: Instituto Nacional do Seguro Social (INSS) & Ministério da Previdência Social (MPS)
official_url: https://dadosabertos.inss.gov.br
segment_id: 04_trabalho_renda
access_mode: LAKEHOUSE_BATCH
protocol: HTTP_BULK_ZIP
auth_type: NONE
update_frequency: Mensal (Boletim Estatístico da Previdência Social BEPS & Síntese Municipal)
freshness_sla_hours: 720
cron_schedule_expression: "0 6 10 * *"
lgpd_legal_basis: public_interest_lei_8213_1991_e_lei_8742_1993_loas_agregacao_municipal
min_expected_rows: 10
primary_keys:
  - cod_beneficio_inss
  - id_municipio
  - sigla_uf
canonical_keys:
  - id_municipio
  - sigla_uf
sentinel_values:
  - -1
  - -99
  - N/D
  - SEM INFORMACAO
columns:
  - name: cod_beneficio_inss
    data_type: STRING
    required: true
    nullable: false
    description: Identificador único do agrupamento municipal de benefícios previdenciários/assistenciais no INSS
  - name: especie_beneficio_codigo
    data_type: STRING
    required: true
    nullable: false
    description: Código da espécie ou faixa de benefício previdenciário/LOAS (ex. B42/B21, B87/B88)
  - name: grupo_beneficio_inss
    data_type: STRING
    required: true
    nullable: false
    description: Agrupamento oficial do benefício (APOSENTADORIA, PENSAO_AUXILIO ou BPC_LOAS)
  - name: clientela_inss
    data_type: STRING
    required: true
    nullable: false
    description: Clientela previdenciária vinculada ao benefício (URBANA ou RURAL)
  - name: id_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Código IBGE canônico de 7 dígitos do município de residência/manutenção do benefício
  - name: sigla_uf
    data_type: STRING
    required: true
    nullable: false
    description: Sigla de 2 letras da Unidade Federativa (UF)
  - name: nome_municipio
    data_type: STRING
    required: true
    nullable: false
    description: Nome oficial do município
  - name: regiao
    data_type: STRING
    required: true
    nullable: false
    description: Macrorregião geográfica brasileira
  - name: qtd_beneficios_emitidos
    data_type: INT64
    required: true
    nullable: false
    description: Quantidade mensal de benefícios ativos emitidos para pagamento no município
  - name: valor_mensal_emitido_mil_brl
    data_type: FLOAT64
    required: true
    nullable: false
    description: Valor mensal bruto injetado na economia local via benefícios INSS (R$ mil)
  - name: competencia_referencia
    data_type: STRING
    required: true
    nullable: false
    description: Competência mensal de referência estatística BEPS/INSS (YYYY-MM)
