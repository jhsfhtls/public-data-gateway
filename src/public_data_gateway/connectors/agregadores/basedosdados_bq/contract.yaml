        nullable: false
      - name: indice_eficiencia_federada_bd
        type: double
        nullable: false
      - name: reference_date
        type: string
        nullable: false
  - name: features_basedosdados_datalake_federado
    description: Feature store Gold de maturidade e cobertura federada Base dos Dados (4 tiers).
    primary_key: [id_municipio]
    columns:
      - name: id_municipio
        type: string
        nullable: false
      - name: nome_municipio
        type: string
        nullable: false
      - name: sigla_uf
