schema_version: "3.1.0"
contract_id: "ODCS-BR-ONR-REGISTRO-IMOVEIS-001"
source_id: "onr_registro_imoveis"
version: "1.0.0"
name: "ONR: Sistema de Registro Eletrônico de Imóveis (SREI)"
agency: "Operador Nacional do Registro de Imóveis Eletrônico (ONR)"
official_url: "https://onr.org.br/"

legal_framework:
  statutes:
    - name: "Lei nº 13.465/2017 (Art. 76 - SREI/ONR)"
      description: "Institui o Sistema de Registro Eletrônico de Imóveis (SREI) e determina sua implementação e operação pelo Operador Nacional do Registro de Imóveis Eletrônico (ONR)"
    - name: "Lei nº 6.015/1973 (Lei de Registros Públicos)"
      description: "Dispõe sobre os Registros Públicos no Brasil, disciplinando matrícula, registro e averbação imobiliária"
    - name: "Lei nº 14.382/2022 (SERP)"
      description: "Institui o Sistema Eletrônico dos Registros Públicos (SERP), a interoperabilidade de bases registrais e os extratos eletrônicos nato-digitais"
    - name: "Provimento CNJ nº 89/2019 e Provimento CNJ nº 149/2023 (CNM/SAEC/ONR)"
      description: "Regulamentam o Código Nacional de Matrícula (CNM), o SAEC (Serviço de Atendimento Eletrônico Compartilhado) e o Mapa Estatístico do Registro de Imóveis"
    - name: "Decreto nº 8.777/2016"
      description: "Institui a Política de Dados Abertos e diretrizes de transparência ativa institucional"

data_governance:
  grain: "municipio_registro_imoveis_anual"
  primary_keys:
    - "id_municipio"
    - "sigla_uf"
  reference_date_column: "reference_date"
  min_expected_rows: 10
  max_volume_drop_pct: 10.0
  freshness_sla_hours: 720
  lgpd_tier: "PUBLIC_NON_PERSONAL"
  ml_feature_domains:
    - "real_estate_transactions"
    - "property_registries"

schema:
  tables:
    onr_matriculas_acervo_municipio:
      description: "Acervo de matrículas imobiliárias ativas, conversão digital ao Código Nacional de Matrícula (CNM), abertura de novas matrículas e emissões digitais via SREI/ONR"
      grain: "id_municipio, competencia_referencia"
      primary_keys: ["id_municipio", "competencia_referencia"]
      min_expected_rows: 10
      columns:
        - name: "id_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 7 dígitos identificador único do município"
        - name: "nome_municipio"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Nome oficial do município"
        - name: "sigla_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Sigla de 2 letras da Unidade Federativa"
        - name: "id_uf"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Código IBGE de 2 dígitos da Unidade Federativa"
        - name: "cep_8"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "CEP canônico de 8 dígitos da circunscrição registral de referência no município"
        - name: "competencia_referencia"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Competência consolidada de referência estatística ONR/SREI (ex.: 2025-12)"
        - name: "serventias_ri_integradas_srei"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de Ofícios de Registro de Imóveis integrados ao SREI/ONR no município"
        - name: "total_matriculas_ativas_cnm"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Estoque total de matrículas imobiliárias ativas registradas sob Código Nacional de Matrícula (CNM)"
        - name: "matriculas_urbanas_ativas"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de matrículas imobiliárias urbanas ativas no município"
        - name: "matriculas_rurais_georreferenciadas"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de matrículas rurais georreferenciadas integradas ao SIGEF/CNM"
        - name: "taxa_conversao_cnm_digital_pct"
          data_type: "float64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Percentual do acervo de matrículas convertido ao padrão estruturado digital CNM/ONR (%)"
        - name: "novas_matriculas_abertas_ano"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de novas matrículas imobiliárias abertas no exercício anual"
        - name: "certidoes_digitais_srei_ano"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de certidões imobiliárias digitais emitidas via SAEC/SREI no ano"
        - name: "visualizacoes_matricula_online_ano"
          data_type: "int64"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Quantidade de visualizações de matrículas eletrônicas realizadas via plataforma ONR no ano"
        - name: "reference_date"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Data de referência ISO-8601 da consolidação anual ONR/SREI"
        - name: "extracted_at"
          data_type: "string"
          required: true
          nullable: false
          max_null_pct: 0.0
          description: "Timestamp ISO-8601 UTC da extração e normalização Medallion"

