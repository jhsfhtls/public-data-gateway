        - name: "score_dinamismo_mercado_imobiliario_itbi"
          data_type: "float64"
          is_nullable: false
          description: "Score normalizado (0 a 100) de dinamismo de preços e liquidez imobiliária no ITBI"
        - name: "score_governanca_cadastral_fiscal_iptu"
