version: 2

models:
  - name: fct_pib_municipal_pontual
    description: "Fato de contas econômicas municipais consolidadas com PIB a preços correntes, VAB setorial e participações relativas."
    columns:
      - name: id_municipio
        description: "Código IBGE de sete dígitos do município."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município conformatório."
        tests: [not_null]
      - name: sigla_uf
        description: "Sigla da Unidade Federativa conformatória."
        tests: [not_null]
      - name: regiao
        description: "Grande região geográfica do município."
        tests: [not_null]
      - name: is_capital
        description: "Flag booleano indicando se o município é capital estadual ou federal."
        tests: [not_null]
      - name: is_amazonia_legal
        description: "Flag booleano indicando se o município integra a Amazônia Legal."
        tests: [not_null]
      - name: ano
        description: "Ano civil de referência da publicação do PIB municipal."
        tests: [not_null]
      - name: valor_pib_mil_reais
        description: "PIB municipal a preços correntes em mil reais."
        tests: [not_null]
      - name: valor_impostos_liquidos_mil_reais
        description: "Impostos líquidos de subsídios sobre produtos em mil reais."
        tests: [not_null]
      - name: vab_total_mil_reais
        description: "Valor Adicionado Bruto total municipal a preços correntes em mil reais."
        tests: [not_null]
      - name: vab_agropecuaria_mil_reais
        description: "Valor Adicionado Bruto da agropecuária em mil reais."
        tests: [not_null]
      - name: vab_industria_mil_reais
        description: "Valor Adicionado Bruto da indústria em mil reais."
        tests: [not_null]
      - name: vab_servicos_mil_reais
        description: "Valor Adicionado Bruto dos serviços exclusive administração pública em mil reais."
        tests: [not_null]
      - name: vab_administracao_publica_mil_reais
        description: "Valor Adicionado Bruto da administração pública em mil reais."
        tests: [not_null]
      - name: participacao_pib_brasil_pct
        description: "Participação percentual do município no PIB do Brasil."
        tests: [not_null]
      - name: participacao_pib_uf_pct
        description: "Participação percentual do município no PIB da sua UF."
        tests: [not_null]
      - name: fonte
        description: "Identificação da tabela oficial do SIDRA de origem."
        tests: [not_null]
      - name: extracted_at
        description: "Instante UTC de extração e ingestão dos dados oficiais."
        tests: [not_null]
  - name: dim_municipio
    description: "Dimensão conformatória de municípios brasileiros com suporte a SCD2 e atributos para análise regional."
    columns:
      - name: id_municipio
        description: "Código oficial do município IBGE com 7 dígitos numéricos (chave primária natural)."
        tests:
          - unique
          - not_null
      - name: id_municipio_6
        description: "Código alternativo de 6 dígitos numéricos para junção com bases legadas do governo."
        tests:
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município brasileiro."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras maiúsculas da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código numérico da UF com 2 dígitos."
        tests:
          - not_null
      - name: nome_uf
        description: "Nome por extenso da Unidade Federativa."
        tests:
          - not_null
      - name: regiao
        description: "Nome da macrorregião geográfica oficial."
        tests:
          - not_null
      - name: sigla_regiao
        description: "Sigla da macrorregião geográfica (N, NE, SE, S, CO)."
        tests:
          - not_null
      - name: mesorregiao
        description: "Mesorregião geográfica do IBGE."
      - name: microrregiao
        description: "Microrregião geográfica do IBGE."
      - name: regiao_intermediaria
        description: "Região geográfica intermediária do IBGE."
      - name: regiao_imediata
        description: "Região geográfica imediata do IBGE."
      - name: is_capital
        description: "Flag booleana indicando se o município é capital."
        tests:
          - not_null
      - name: is_amazonia_legal
        description: "Flag booleana indicando enquadramento territorial na Amazônia Legal (Lei 5.173/1966)."
        tests:
          - not_null
      - name: valid_from
        description: "Data de início de vigência do registro para suporte a Slowly Changing Dimensions (SCD2)."
        tests:
          - not_null
      - name: valid_to
        description: "Data de término de vigência do registro (nulo enquanto ativo)."
      - name: is_current
        description: "Flag indicando se o registro é o registro ativo corrente no tempo."
        tests:
          - not_null
      - name: reference_date
        description: "Competência temporal de referência dos dados municipais (YYYY-MM-DD)."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 da extração dos dados."
        tests:
          - not_null

  - name: dim_distrito
    description: "Dimensão de distritos municipais brasileiros vinculada à hierarquia municipal."
    columns:
      - name: id_distrito
        description: "Código oficial do distrito municipal com 9 dígitos numéricos (chave primária)."
        tests:
          - unique
          - not_null
      - name: nome_distrito
        description: "Nome oficial do distrito municipal."
        tests:
          - not_null
      - name: id_municipio
        description: "Código oficial do município ao qual o distrito pertence (7 dígitos)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_municipio')
              field: id_municipio
      - name: nome_municipio
        description: "Nome do município de subordinação."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras maiúsculas da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código numérico da UF com 2 dígitos."
        tests:
          - not_null
      - name: nome_uf
        description: "Nome por extenso da Unidade Federativa."
        tests:
          - not_null
      - name: regiao
        description: "Nome da macrorregião geográfica."
        tests:
          - not_null
      - name: sigla_regiao
        description: "Sigla da macrorregião geográfica (N, NE, SE, S, CO)."
        tests:
          - not_null
      - name: is_distrito_sede
        description: "Flag booleana indicando se o distrito é a sede administrativa do município."
        tests:
          - not_null
      - name: reference_date
        description: "Competência temporal de referência (YYYY-MM-DD)."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 da extração dos dados."
        tests:
          - not_null

  - name: xwalk_ibge_6d_7d
    description: "Tabela de crosswalk oficial para conversão bidirecional entre códigos IBGE de 6 e 7 dígitos."
    columns:
      - name: id_municipio_6
        description: "Código do município com 6 dígitos numéricos sem dígito verificador."
        tests:
          - unique
          - not_null
      - name: id_municipio_7
        description: "Código oficial do município com 7 dígitos numéricos incluindo dígito verificador."
        tests:
          - unique
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município registrado no IBGE."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras maiúsculas da UF."
        tests:
          - not_null
      - name: digito_verificador
        description: "Dígito verificador calculado via algoritmo Módulo 11 oficial do IBGE."
        tests:
          - not_null
      - name: reference_date
        description: "Competência temporal de referência (YYYY-MM-DD)."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 da extração."
        tests:
          - not_null

  - name: dim_serie_macroeconomica
    description: "Dimensão conformada de séries temporais macroeconômicas gerenciadas pelo Banco Central e parceiros (IBGE, FGV, B3)."
    columns:
      - name: id_serie
        description: "Código numérico identificador exclusivo da série no SGS do Banco Central."
        tests:
          - unique
          - not_null
      - name: nome_serie
        description: "Nome oficial descritivo da série macroeconômica cadastrada."
        tests:
          - not_null
      - name: periodicidade
        description: "Periodicidade oficial de apuração da série (ex: MENSAL, DIARIA, REUNIAO_COPOM)."
        tests:
          - not_null
      - name: unidade_medida
        description: "Unidade de medida oficial da série (ex: % a.m., % a.a., Número Índice)."
        tests:
          - not_null
      - name: orgao_gestor
        description: "Entidade ou autarquia responsável pela apuração primária ou compilação da série."
        tests:
          - not_null
      - name: categoria
        description: "Segmentação temática analítica da série (ex: INFLACAO, JUROS, ATIVIDADE_ECONOMICA)."
        tests:
          - not_null
      - name: data_inicio_historico
        description: "Data da primeira observação registrada no histórico oficial da série temporal."
        tests:
          - not_null
      - name: reference_date
        description: "Ano/Data de competência do catálogo cadastral (YYYY-MM-DD)."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 do momento da extração dos metadados."
        tests:
          - not_null

  - name: fct_macro_indicadores_mensal
    description: "Tabela fato conformatória mensal unificando inflação (IPCA, IGP-M), juros (Selic Meta, Selic média, CDI) e atividade econômica (IBC-Br)."
    columns:
      - name: ano_mes
        description: "Ano e mês de competência das observações macroeconômicas (YYYY-MM)."
        tests:
          - unique
          - not_null
      - name: data_competencia
        description: "Primeiro dia do mês de competência das observações macroeconômicas (YYYY-MM-01)."
        tests:
          - not_null
      - name: ipca_mensal_pct
        description: "Taxa mensal de variação do IPCA apurada pelo IBGE para a competência (% a.m.)."
      - name: ipca_acumulado_12m_pct
        description: "Taxa acumulada em 12 meses do IPCA na competência de referência (% a.a.)."
      - name: igpm_mensal_pct
        description: "Taxa mensal de variação do IGP-M apurada pela FGV para a competência (% a.m.)."
      - name: selic_meta_fim_mes_pct
        description: "Meta para a Taxa Selic anual fixada pelo Copom vigente no encerramento da competência (% a.a.)."
      - name: selic_diaria_media_mensal_pct
        description: "Média aritmética simples das taxas Selic diárias apuradas nos dias úteis da competência (% a.a.)."
      - name: cdi_diario_medio_mensal_pct
        description: "Média aritmética simples das taxas CDI diárias apuradas pela B3 nos dias úteis da competência (% a.a.)."
      - name: ibcbr_indice
        description: "Número índice dessazonalizado do IBC-Br divulgado pelo Banco Central para a competência."

  - name: dim_moeda
    description: "Dimensão conformada de moedas estrangeiras cadastradas no sistema PTAX do Banco Central."
    columns:
      - name: simbolo_moeda
        description: "Código ISO 4217 de 3 letras da moeda estrangeira (chave primária da dimensão)."
        tests:
          - unique
          - not_null
      - name: nome_moeda
        description: "Nome oficial formatado da moeda estrangeira."
        tests:
          - not_null
      - name: tipo_moeda
        description: "Classificação PTAX do tipo de cotação da moeda (Tipo A ou Tipo B)."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência do cadastro (YYYY-MM-DD)."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 da extração dos dados."
        tests:
          - not_null

  - name: fct_cambio_ptax_diario
    description: "Tabela fato conformatória diária de cotações PTAX de fechamento para as principais moedas globais (USD, EUR, GBP)."
    columns:
      - name: data_cotacao
        description: "Data do dia útil da cotação no formato YYYY-MM-DD."
        tests:
          - unique
          - not_null
      - name: data_referencia
        description: "Data de referência em formato DATE para indexação e joins temporais."
        tests:
          - not_null
      - name: ano_mes
        description: "Competência do ano e mês no formato YYYY-MM."
        tests:
          - not_null
      - name: dolar_compra
        description: "Taxa de câmbio oficial de compra do Dólar americano em Reais (BRL)."
        tests:
          - not_null
      - name: dolar_venda
        description: "Taxa de câmbio oficial de venda do Dólar americano em Reais (BRL)."
        tests:
          - not_null
      - name: dolar_spread
        description: "Diferença absoluta em Reais entre a taxa de venda e de compra do Dólar (spread cambial oficial)."
        tests:
          - not_null
      - name: euro_compra
        description: "Taxa de câmbio oficial de compra do Euro em Reais (BRL)."
      - name: euro_venda
        description: "Taxa de câmbio oficial de venda do Euro em Reais (BRL)."
      - name: libra_compra
        description: "Taxa de câmbio oficial de compra da Libra Esterlina em Reais (BRL)."
      - name: libra_venda
        description: "Taxa de câmbio oficial de venda da Libra Esterlina em Reais (BRL)."

  - name: dim_instituicao_financeira
    description: "Dimensão conformatória de instituições financeiras no Brasil integrando catálogo bancário e adesão ao arranjo PIX."
    columns:
      - name: ispb
        description: "Identificador do Sistema de Pagamentos Brasileiro (ISPB) com 8 dígitos."
        tests:
          - unique
          - not_null
      - name: codigo_compensacao
        description: "Código COMPE de 3 dígitos de compensação bancária ou NULL para fintechs/instituições de pagamento."
      - name: nome_reduzido
        description: "Nome comercial resumido da instituição financeira."
        tests:
          - not_null
      - name: nome_completo
        description: "Razão social oficial completa registrada no Banco Central."
        tests:
          - not_null
      - name: cidade_sede
        description: "Município da sede administrativa da instituição financeira."
      - name: uf_sede
        description: "Sigla de 2 letras da Unidade Federativa da sede."
      - name: participa_pix
        description: "Flag booleana indicando homologação ativa no arranjo de pagamentos instantâneos PIX."
        tests:
          - not_null
      - name: modalidade_pix
        description: "Modalidade de participação no PIX (Provedor de Conta Transacional, Liquidante Especial, etc.)."
        tests:
          - not_null
      - name: tipo_participacao_pix
        description: "Forma de conexão ao Sistema de Pagamentos Instantâneos (Direta ou Indireta)."
        tests:
          - not_null
      - name: inicio_operacao_pix
        description: "Data ou timestamp de início da operação no PIX."
      - name: is_banco_comercial
        description: "Flag booleana indicando se a instituição possui código COMPE bancário para operações de câmara compensatória."
        tests:
          - not_null
      - name: reference_date
        description: "Competência cadastral de referência (YYYY-MM-DD)."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 da extração dos dados."
        tests:
          - not_null

  - name: dim_calendario_nacional
    description: "Dimensão de calendário oficial com marcação de feriados nacionais bancários e civis do Brasil."
    columns:
      - name: data_feriado
        description: "Data do feriado no formato YYYY-MM-DD."
        tests:
          - unique
          - not_null
      - name: data_referencia
        description: "Data em formato DATE para indexação e joins de séries temporais."
        tests:
          - not_null
      - name: ano
        description: "Ano do calendário civil."
        tests:
          - not_null
      - name: mes
        description: "Mês numérico de 1 a 12."
        tests:
          - not_null
      - name: nome_feriado
        description: "Nome do feriado nacional oficial."
        tests:
          - not_null
      - name: tipo_feriado
        description: "Classificação jurídica do feriado (nacional, estadual, ponto facultativo)."
        tests:
          - not_null
      - name: dia_semana
        description: "Nome do dia da semana por extenso em português."
        tests:
          - not_null
      - name: is_dia_util_bancario
        description: "Flag booleana indicando se há expediente bancário na data (FALSE para feriados)."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência do calendário (YYYY-MM-DD)."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 da captura."
        tests:
          - not_null

  - name: dim_empresa
    description: "Dimensão conformatória de empresas brasileiras a nível de CNPJ básico (raiz de 8 dígitos) com atributos societários e fiscais."
    columns:
      - name: cnpj_basico
        description: "Radical de 8 dígitos numéricos que identifica a empresa na Receita Federal (chave primária natural)."
        tests:
          - unique
          - not_null
      - name: razao_social
        description: "Nome empresarial ou razão social registrada da pessoa jurídica."
        tests:
          - not_null
      - name: natureza_juridica
        description: "Código de 4 dígitos da natureza jurídica CONCLA/RFB."
        tests:
          - not_null
      - name: descricao_natureza_juridica
        description: "Descrição textual da natureza jurídica da empresa."
        tests:
          - not_null
      - name: qualificacao_responsavel
        description: "Código de qualificação do responsável legal pela empresa."
        tests:
          - not_null
      - name: descricao_qualificacao_responsavel
        description: "Descrição da qualificação do responsável legal perante a RFB."
        tests:
          - not_null
      - name: capital_social
        description: "Valor monetário do capital social declarado da empresa em Reais (BRL)."
        tests:
          - not_null
      - name: porte_empresa
        description: "Código do porte da empresa segundo a Receita Federal (01: Não informado, 03: ME, 05: EPP, Demais)."
        tests:
          - not_null
      - name: descricao_porte_empresa
        description: "Classificação padronizada do porte empresarial (MICRO_EMPRESA, EMPRESA_DE_PEQUENO_PORTE, DEMAIS)."
        tests:
          - not_null
      - name: ente_federativo_responsavel
        description: "Ente federativo responsável no caso de empresas públicas ou sociedades de economia mista."
      - name: opcao_pelo_simples
        description: "Indicador de opção pelo regime tributário do Simples Nacional (S/N)."
        tests:
          - not_null
      - name: is_simples_nacional
        description: "Flag booleana indicando se a empresa é optante pelo Simples Nacional."
        tests:
          - not_null
      - name: data_opcao_simples
        description: "Data em que a empresa optou pelo Simples Nacional (YYYY-MM-DD)."
      - name: data_exclusao_simples
        description: "Data de exclusão do Simples Nacional caso tenha ocorrido (YYYY-MM-DD)."
      - name: opcao_mei
        description: "Indicador de enquadramento como Microempreendedor Individual - MEI (S/N)."
        tests:
          - not_null
      - name: is_mei
        description: "Flag booleana indicando se a empresa está enquadrada como MEI."
        tests:
          - not_null
      - name: data_opcao_mei
        description: "Data de enquadramento no regime do SIMEI/MEI (YYYY-MM-DD)."
      - name: data_exclusao_mei
        description: "Data de desenquadramento do regime SIMEI/MEI (YYYY-MM-DD)."
      - name: reference_date
        description: "Data de referência do processamento cadastral (YYYY-MM-DD)."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 da extração do registro."
        tests:
          - not_null

  - name: dim_estabelecimento
    description: "Dimensão conformatória de estabelecimentos (matrizes e filiais) a nível de CNPJ de 14 dígitos com localização e CNAE."
    columns:
      - name: cnpj_14
        description: "Número completo de 14 dígitos do CNPJ do estabelecimento (chave primária natural)."
        tests:
          - unique
          - not_null
      - name: cnpj_basico
        description: "Radical de 8 dígitos numéricos da empresa controladora."
        tests:
          - not_null
      - name: cnpj_ordem
        description: "Número de ordem do estabelecimento (0001 para matriz, 0002+ para filiais)."
        tests:
          - not_null
      - name: cnpj_dv
        description: "Dígitos verificadores do CNPJ completo."
        tests:
          - not_null
      - name: identificador_matriz_filial
        description: "Código indicador de matriz (1) ou filial (2)."
        tests:
          - not_null
      - name: tipo_estabelecimento
        description: "Classificação padronizada da unidade (MATRIZ ou FILIAL)."
        tests:
          - not_null
      - name: nome_fantasia
        description: "Nome de fantasia comercial do estabelecimento."
      - name: situacao_cadastral
        description: "Código numérico da situação cadastral perante a RFB (01: Nula, 02: Ativa, 03: Suspensa, 04: Inapta, 08: Baixada)."
        tests:
          - not_null
      - name: descricao_situacao_cadastral
        description: "Descrição textual da situação cadastral perante o Fisco."
        tests:
          - not_null
      - name: is_ativo
        description: "Flag booleana indicando se o estabelecimento está com situação cadastral ATIVA."
        tests:
          - not_null
      - name: data_situacao_cadastral
        description: "Data em que a situação cadastral atual foi homologada (YYYY-MM-DD)."
        tests:
          - not_null
      - name: motivo_situacao_cadastral
        description: "Código do motivo da situação cadastral perante a RFB."
        tests:
          - not_null
      - name: descricao_motivo_cadastral
        description: "Descrição padronizada do motivo da situação cadastral."
        tests:
          - not_null
      - name: data_inicio_atividade
        description: "Data de abertura e início das atividades do estabelecimento (YYYY-MM-DD)."
        tests:
          - not_null
      - name: cnae_fiscal_principal
        description: "Código de 7 dígitos da atividade econômica principal (CNAE Subclasses)."
        tests:
          - not_null
      - name: descricao_cnae_fiscal_principal
        description: "Descrição oficial da subclasse de atividade econômica principal."
        tests:
          - not_null
      - name: tipo_logradouro
        description: "Tipo do logradouro (Rua, Avenida, Praça, Alameda, etc.)."
      - name: logradouro
        description: "Nome do logradouro onde o estabelecimento está sediado."
      - name: numero
        description: "Número predial do endereço do estabelecimento."
      - name: complemento
        description: "Complemento do endereço cadastral."
      - name: bairro
        description: "Nome do bairro ou distrito de localização."
      - name: cep_8
        description: "Código de Endereçamento Postal oficial com 8 dígitos."
      - name: sigla_uf
        description: "Sigla de 2 letras maiúsculas da Unidade Federativa da sede."
      - name: id_municipio_rf
