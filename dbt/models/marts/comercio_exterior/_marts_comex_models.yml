version: 2

models:
  - name: mart_balanca_comercial_municipios_brasil
    description: "Datamart analítico de balança comercial, corrente de comércio, taxa de cobertura e ranking por município brasileiro."
    columns:
      - name: id_municipio_7
        description: "Código IBGE de 7 dígitos do município."
        tests:
          - not_null
          - unique
      - name: nome_municipio
        description: "Nome oficial do município brasileiro."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla da Unidade Federativa do município."
        tests:
          - not_null
      - name: valor_exportado_fob_usd
        description: "Valor total exportado FOB em dólares americanos (USD)."
        tests:
          - not_null
      - name: valor_importado_fob_usd
        description: "Valor total importado FOB em dólares americanos (USD)."
        tests:
          - not_null
      - name: saldo_comercial_usd
        description: "Saldo comercial líquido do município em USD."
        tests:
          - not_null
      - name: corrente_comercio_usd
        description: "Corrente total de comércio exterior do município em USD."
        tests:
          - not_null
      - name: peso_exportado_kg
        description: "Peso líquido total das mercadorias exportadas em kg."
        tests:
          - not_null
      - name: peso_importado_kg
        description: "Peso líquido total das mercadorias importadas em kg."
        tests:
          - not_null
      - name: taxa_cobertura_pct
        description: "Taxa percentual de cobertura das exportações sobre importações."
        tests:
          - not_null
      - name: classificacao_balanca
        description: "Classificação analítica do saldo da balança (Superávit Estrutural, Moderado ou Déficit)."
        tests:
          - not_null
      - name: perfil_fluxo_comercial
        description: "Perfil de relevância da corrente de comércio do município (Polo Global, Regional ou Pontual)."
        tests:
          - not_null
      - name: ranking_exportador_nacional
        description: "Posição no ranking nacional de valor exportado FOB."
        tests:
          - not_null

  - name: mart_comercio_exterior_ncm_brasil
    description: "Datamart analítico de fluxo comercial internacional por código de mercadoria NCM."
    columns:
      - name: ncm_8
        description: "Código oficial da NCM com 8 dígitos."
        tests:
          - not_null
          - unique
      - name: descricao_ncm
        description: "Descrição oficial da mercadoria NCM em português."
        tests:
          - not_null
      - name: sh6
        description: "Código do Sistema Harmonizado SH6."
        tests:
          - not_null
      - name: sh4
        description: "Código do Sistema Harmonizado SH4."
        tests:
          - not_null
      - name: capitulo_sh2
        description: "Capítulo do Sistema Harmonizado (2 dígitos)."
        tests:
          - not_null
      - name: valor_exportado_usd
        description: "Valor total exportado em USD da mercadoria."
        tests:
          - not_null
      - name: valor_importado_usd
        description: "Valor total importado em USD da mercadoria."
        tests:
          - not_null
      - name: saldo_comercial_ncm_usd
        description: "Saldo comercial líquido da mercadoria em USD."
        tests:
          - not_null
      - name: corrente_comercio_ncm_usd
        description: "Corrente de comércio da mercadoria em USD."
        tests:
          - not_null
      - name: preco_medio_exportado_usd_kg
        description: "Preço médio exportado em dólares por quilograma líquido."
      - name: orientacao_comercial_ncm
        description: "Orientação da balança da NCM (Exportador Líquido, Importador Líquido ou Equilibrado)."
        tests:
          - not_null
