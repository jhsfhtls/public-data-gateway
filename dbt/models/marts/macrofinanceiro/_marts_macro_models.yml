version: 2

models:
  - name: mart_cenario_macroeconomico_brasil
    description: "Datamart analítico conformatório de conjuntura macroeconômica brasileira, calculando juros reais ex-post, deflatores, spreads bancários e crescimento de atividade."
    columns:
      - name: ano_mes
        description: "Competência temporal no formato YYYY-MM."
        tests:
          - unique
          - not_null
      - name: data_competencia
        description: "Data do primeiro dia da competência de referência (YYYY-MM-01)."
        tests:
          - not_null
      - name: ipca_mensal_pct
        description: "Variação mensal oficial do IPCA (% a.m.)."
      - name: ipca_acumulado_12m_pct
        description: "Inflação oficial acumulada nos últimos 12 meses (% a.a.)."
      - name: igpm_mensal_pct
        description: "Variação mensal oficial do IGP-M apurada pelo FGV/IBRE (% a.m.)."
      - name: selic_meta_fim_mes_pct
        description: "Meta Selic anualizada estipulada pelo COPOM vigente no encerramento do mês (% a.a.)."
      - name: selic_diaria_media_mensal_pct
        description: "Taxa Selic média efetiva apurada ao longo do mês (% a.a.)."
      - name: cdi_diario_medio_mensal_pct
        description: "Taxa CDI média apurada nos dias úteis da competência (% a.a.)."
      - name: ibcbr_indice
        description: "Número índice dessazonalizado da atividade econômica brasileira apurado pelo Banco Central."
      - name: juros_real_ex_post_pct
        description: "Taxa de juros real ex-post anualizada calculada pela diferença entre a Selic Meta e a inflação IPCA 12m (% a.a.)."
      - name: spread_cdi_selic_pct
        description: "Diferencial de taxa entre o CDI médio de mercado e a Selic média diária apurada (% a.a.)."
      - name: crescimento_ibcbr_mom_pct
        description: "Variação percentual mês a mês (MoM) do índice de atividade econômica IBC-Br."
      - name: crescimento_ibcbr_yoy_pct
        description: "Variação percentual ano a ano (YoY) do índice de atividade econômica IBC-Br frente ao mesmo mês do ano anterior."
      - name: regime_politica_monetaria
        description: "Classificação analítica da postura da política monetária (CONTRACIONISTA, NEUTRO, EXPANSIONISTA)."
        tests:
          - not_null
      - name: classificacao_inflacao_meta
        description: "Enquadramento da inflação acumulada de 12 meses frente às metas e bandas de tolerância do CMN."
        tests:
          - not_null

  - name: mart_cambio_volatilidade_brasil
    description: "Datamart analítico de volatilidade cambial e retornos diários das taxas PTAX oficiais do Banco Central."
    columns:
      - name: data_cotacao
        description: "Data oficial do dia útil da cotação no formato YYYY-MM-DD."
        tests:
          - unique
          - not_null
      - name: data_referencia
        description: "Data em formato DATE para indexação e joins com séries de faturamento e balança comercial."
        tests:
          - not_null
      - name: ano_mes
        description: "Mês de competência das cotações no formato YYYY-MM."
        tests:
          - not_null
      - name: dolar_compra
        description: "Taxa de câmbio oficial de compra do Dólar americano (BRL)."
        tests:
          - not_null
      - name: dolar_venda
        description: "Taxa de câmbio oficial de venda do Dólar americano (BRL)."
        tests:
          - not_null
      - name: dolar_spread
        description: "Diferença entre a taxa de venda e compra do Dólar (spread bancário oficial)."
        tests:
          - not_null
      - name: euro_venda
        description: "Taxa de câmbio oficial de venda do Euro (BRL)."
      - name: variacao_dolar_dia_pct
        description: "Variação percentual diária da taxa de venda do Dólar americano frente ao dia útil anterior."
      - name: variacao_euro_dia_pct
        description: "Variação percentual diária da taxa de venda do Euro frente ao dia útil anterior."
      - name: media_movel_dolar_21d
        description: "Média móvel aritmética de 21 dias úteis da taxa de venda do Dólar (aproximadamente 1 mês útil de mercado)."
      - name: volatilidade_dolar_30d
        description: "Desvio padrão amostral móvel de 30 dias úteis da cotação do Dólar (medida de volatilidade cambial realizada)."
      - name: regime_estresse_cambial
        description: "Classificação analítica do estresse cambial diário (ALTO_ESTRESSE, VOLATILIDADE_MODERADA, ESTABILIDADE)."
        tests:
          - not_null

  - name: mart_demonstracoes_financeiras_cvm_brasil
    description: "Datamart macrofinanceiro corporativo unificando balanços patrimoniais, DRE, DFC e indicadores fundamentalistas de solvência das companhias abertas da CVM."
    columns:
      - name: codigo_cvm
        description: "Código identificador numérico da companhia perante a CVM."
        tests:
          - not_null
      - name: cnpj_14
        description: "Cadastro Nacional da Pessoa Jurídica da companhia emissora."
        tests:
          - not_null
      - name: razao_social
        description: "Razão social oficial arquivada na CVM."
        tests:
          - not_null
      - name: nome_comercial
        description: "Nome comercial ou de fantasia da companhia."
      - name: setor_atividade
        description: "Classificação setorial da companhia perante a CVM."
        tests:
          - not_null
      - name: categoria_registro
        description: "Categoria de registro da companhia aberta (CATEGORIA_A ou CATEGORIA_B)."
        tests:
          - not_null
      - name: situacao_registro
        description: "Situação cadastral do registro na CVM."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla da Unidade Federativa da sede social da empresa."
        tests:
          - not_null
      - name: ano_exercicio
        description: "Ano contábil de exercício da demonstração financeira."
        tests:
          - not_null
      - name: tipo_demonstracao
        description: "Tipo de consolidação das demonstrações (CONSOLIDADO ou INDIVIDUAL)."
        tests:
          - not_null
      - name: ativo_total
        description: "Valor monetário do Ativo Total da companhia."
        tests:
          - not_null
      - name: ativo_circulante
        description: "Ativo Circulante realizável no curto prazo."
        tests:
          - not_null
      - name: caixa_equivalentes
        description: "Saldo de caixa e equivalentes de caixa de alta liquidez."
        tests:
          - not_null
      - name: estoques
        description: "Valor contábil de estoques de insumos e produtos acabados."
        tests:
          - not_null
      - name: passivo_circulante
        description: "Obrigações exigíveis no curto prazo."
        tests:
          - not_null
      - name: passivo_nao_circulante
        description: "Exigível a longo prazo."
        tests:
          - not_null
      - name: patrimonio_liquido
        description: "Patrimônio Líquido atribuível aos acionistas da companhia."
        tests:
          - not_null
      - name: receita_liquida_vendas
        description: "Receita operacional líquida de vendas de bens e serviços."
        tests:
          - not_null
      - name: lucro_bruto
        description: "Resultado bruto antes das despesas operacionais e administrativas."
        tests:
          - not_null
      - name: ebitda_calculado
        description: "Lucro antes de juros, impostos, depreciação e amortização (EBITDA)."
        tests:
          - not_null
      - name: lucro_liquido_exercicio
        description: "Lucro ou prejuízo líquido consolidado do exercício social."
        tests:
          - not_null
      - name: fluxo_caixa_operacional
        description: "Fluxo de caixa líquido gerado pelas atividades operacionais (FCO)."
      - name: indice_liquidez_corrente
        description: "Índice de liquidez corrente (Ativo Circulante / Passivo Circulante)."
        tests:
          - not_null
      - name: indice_liquidez_seca
        description: "Índice de liquidez seca ((Ativo Circulante - Estoques) / Passivo Circulante)."
        tests:
          - not_null
      - name: margem_bruta_pct
        description: "Margem bruta percentual (Lucro Bruto / Receita Líquida * 100)."
        tests:
          - not_null
      - name: margem_liquida_pct
        description: "Margem líquida percentual (Lucro Líquido / Receita Líquida * 100)."
        tests:
          - not_null
      - name: retorno_sobre_patrimonio_roe_pct
        description: "Retorno sobre o patrimônio líquido ROE percentual (Lucro Líquido / PL * 100)."
        tests:
          - not_null
      - name: indice_endividamento_geral_pct
        description: "Endividamento geral percentual ((PC + PNC) / Ativo Total * 100)."
        tests:
          - not_null
      - name: classificacao_solvencia
        description: "Classificação analítica da saúde econômico-financeira (SOLVENTE_GRAU_INVESTIMENTO, ZONA_CINZENTA_MODERADA, ALERTA_INSOLVENCIA)."
        tests:
          - not_null
      - name: mart_timestamp
        description: "Timestamp ISO de compilação do registro no datamart."
        tests:
          - not_null


  - name: mart_performance_liquidez_fundos
    description: "Datamart analítico de performance, liquidez e fluxo de captação de Fundos de Investimento no Brasil."
    columns:
      - name: cnpj_14
        description: "CNPJ do fundo de investimento com 14 dígitos normalizados."
        tests:
          - not_null
          - unique
      - name: codigo_cvm
        description: "Código numérico de registro CVM."
      - name: razao_social
        description: "Razão social oficial do fundo de investimento."
        tests:
          - not_null
      - name: classe_cvm
        description: "Classe regulatória do fundo segundo taxonomia CVM."
        tests:
          - not_null
      - name: classe_anbima
        description: "Classificação setorial detalhada ANBIMA."
      - name: situacao_registro
        description: "Situação cadastral do fundo na CVM."
        tests:
          - not_null
      - name: tipo_condominio
        description: "Tipo de condomínio do fundo (ABERTO ou FECHADO)."
      - name: publico_alvo
        description: "Segmento de investidores elegíveis (GERAL, QUALIFICADO, PROFISSIONAL)."
      - name: cnpj_gestor
        description: "CNPJ da sociedade gestora de recursos (Asset Management)."
      - name: nome_gestor
        description: "Razão social da gestora de recursos."
      - name: cnpj_administrador
        description: "CNPJ da instituição administradora fiduciária."
      - name: nome_administrador
        description: "Razão social da administradora fiduciária."
      - name: patrimonio_liquido_atual
        description: "Patrimônio líquido contábil mais recente apurado em reais (R$)."
        tests:
          - not_null
      - name: menor_cota_periodo
        description: "Menor valor de cota registrado na série temporal recente."
      - name: maior_cota_periodo
        description: "Maior valor de cota registrado na série temporal recente."
      - name: total_captacao_periodo
        description: "Soma das aplicações e subscrições no período apurado (R$)."
      - name: total_resgate_periodo
        description: "Soma dos resgates pagos aos cotistas no período (R$)."
      - name: saldo_liquido_captacao
        description: "Captação líquida total no período (Aplicações - Resgates em R$)."
        tests:
          - not_null
      - name: media_cotistas
        description: "Média de cotistas ativos no período analisado."
      - name: dias_apurados
        description: "Quantidade de dias úteis com informes diários apurados no período."
        tests:
          - not_null
      - name: status_fluxo_captacao
        description: "Classificação do fluxo líquido (CAPTAÇÃO LÍQUIDA POSITIVA, RESGATE LÍQUIDO NEGATIVO, EQUILIBRADO)."
        tests:
          - not_null
      - name: perfil_liquidez
        description: "Classificação de liquidez estimada (ALTA_LIQUIDEZ, MEDIA_LIQUIDEZ, RESTRITA)."
        tests:
          - not_null

  - name: mart_ranking_gestoras_assets
    description: "Datamart consolidado do ranking de sociedades gestoras de recursos (Asset Management) por AuM sob gestão."
    columns:
      - name: cnpj_gestor
        description: "CNPJ da gestora de recursos com 14 dígitos normalizados."
        tests:
          - not_null
          - unique
      - name: nome_gestor
        description: "Razão social da gestora de recursos / Asset Management."
        tests:
          - not_null
      - name: total_fundos_geridos
        description: "Quantidade total de fundos de investimento sob gestão da casa."
        tests:
          - not_null
      - name: aum_total
        description: "Patrimônio líquido total consolidado sob gestão (Assets under Management - AuM) em reais (R$)."
        tests:
          - not_null
      - name: captacao_liquida_recente_total
        description: "Captação líquida recente consolidada de todos os fundos geridos (R$)."
        tests:
          - not_null
      - name: principais_classes
        description: "Classes de fundos preponderantes geridas pela instituição."
      - name: market_share_aum_pct
        description: "Percentual de participação de mercado no AuM total apurado (%)."
        tests:
          - not_null
      - name: ranking_aum
        description: "Posição ordinal no ranking geral de gestoras ordenado por AuM decrescente."
        tests:
          - not_null

  - name: mart_ranking_bancario_brasil
    description: "Datamart consolidado com o ranking das maiores instituições financeiras do Brasil por Ativo Total, Crédito e Depósitos (BACEN IF.data)."
    columns:
      - name: cnpj_14_lider
        description: "CNPJ de 14 dígitos da instituição líder."
        tests:
          - not_null
      - name: cod_inst
        description: "Código identificador único BACEN no IF.data."
        tests:
          - not_null
      - name: nome_instituicao
        description: "Nome oficial ou denominação da instituição financeira."
        tests:
          - not_null
      - name: segmento_prudencial
        description: "Segmento regulatório prudencial da instituição (S1 a S5)."
        tests:
          - not_null
      - name: data_base
        description: "Data-base trimestral do ranking (formato YYYYMM)."
        tests:
          - not_null
      - name: ativo_total
        description: "Ativo total consolidado da instituição apurado em reais (R$)."
        tests:
          - not_null
      - name: carteira_credito_classificada
        description: "Volume financeiro total da carteira de crédito classificada (R$)."
        tests:
          - not_null
      - name: depositos_totais
        description: "Volume consolidado total de depósitos captados (R$)."
        tests:
          - not_null
      - name: patrimonio_liquido
        description: "Patrimônio líquido contábil consolidado apurado (R$)."
        tests:
          - not_null
      - name: lucro_liquido_trimestral
        description: "Lucro líquido contábil apurado no trimestre (R$)."
      - name: market_share_ativo_pct
        description: "Percentual de participação de mercado no ativo total do SFN analisado (%)."
        tests:
          - not_null
      - name: market_share_credito_pct
        description: "Percentual de participação de mercado na carteira de crédito do SFN analisado (%)."
        tests:
          - not_null
      - name: ranking_ativo_total
        description: "Posição ordinal no ranking geral de instituições ordenado por ativo total decrescente."
        tests:
          - not_null

  - name: mart_saude_prudencial_basileia
    description: "Datamart de risco e solidez regulatória bancária com enquadramento de Basiléia, imobilização e inadimplência (BACEN IF.data)."
    columns:
      - name: cnpj_14_lider
        description: "CNPJ de 14 dígitos da instituição líder."
        tests:
          - not_null
      - name: cod_inst
        description: "Código identificador único BACEN da instituição."
        tests:
          - not_null
      - name: nome_instituicao
        description: "Nome oficial da instituição financeira."
        tests:
          - not_null
      - name: segmento_prudencial
        description: "Segmentação prudencial da instituição (S1 a S5)."
        tests:
          - not_null
      - name: tipo_instituicao
        description: "Tipo de consolidação ou natureza regulatória da instituição."
      - name: atividade
        description: "Modalidade preponderante de atividade operacional da instituição."
      - name: uf_sede
        description: "Sigla da UF da sede institucional."
      - name: data_base
        description: "Data-base trimestral de apuração."
        tests:
          - not_null
      - name: indice_basileia_pct
        description: "Índice de Basiléia percentual apurado (Mínimo regulatório: 10.5%)."
        tests:
          - not_null
      - name: indice_imobilizacao_pct
        description: "Índice de Imobilização percentual (Teto regulatório: 50.0%)."
        tests:
          - not_null
      - name: razao_alavancagem_pct
        description: "Razão de alavancagem bancária (Patrimônio Líquido sobre Ativo Total em %)."
        tests:
          - not_null
      - name: roe_bancario_pct
        description: "Retorno sobre o patrimônio líquido ROE bancário anualizado (%)."
        tests:
          - not_null
      - name: roa_bancario_pct
        description: "Retorno sobre o ativo total ROA bancário (%)."
      - name: taxa_inadimplencia_pct
        description: "Taxa de inadimplência da carteira classificada com atraso superior a 90 dias (%)."
        tests:
          - not_null
      - name: status_enquadramento_basileia
        description: "Classificação do enquadramento de capital (CAPITALIZACAO_FORTE, CAPITALIZACAO_ADEQUADA, ALERTA_CAPITAL)."
        tests:
          - not_null
      - name: status_enquadramento_imobilizacao
        description: "Classificação do enquadramento do teto de imobilização (IMOBILIZACAO_CONFORTAVEL, IMOBILIZACAO_LIMITE, DESENQUADRADO)."
        tests:
          - not_null
      - name: perfil_risco_inadimplencia
        description: "Classificação de risco de crédito da carteira (BAIXO_RISCO_CREDITO, RISCO_MODERADO_CREDITO, ALTO_RISCO_CREDITO)."
        tests:
          - not_null

  - name: mart_saude_fiscal_municipios_brasil
    description: "Datamart consolidado de saúde fiscal, endividamento LRF, classificação CAPAG e repasses FPM municipais"
    columns:
      - name: id_municipio_ibge_7d
        description: "Código IBGE canônico de 7 dígitos do município"
        tests:
          - not_null
          - unique
      - name: sigla_uf
        description: "Sigla de 2 caracteres da Unidade Federativa"
        tests:
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município"
        tests:
          - not_null
      - name: ano_exercicio
        description: "Ano do exercício fiscal de encerramento"
        tests:
          - not_null
      - name: nota_capag_final
        description: "Classificação oficial final da Capacidade de Pagamento (A, B ou C)"
        tests:
          - not_null
      - name: receita_corrente_liquida_rcl
        description: "Receita Corrente Líquida apurada dos últimos 12 meses em BRL"
      - name: divida_consolidada_liquida_dcl
        description: "Estoque da Dívida Consolidada Líquida em BRL"
      - name: razao_dcl_rcl_pct
        description: "Relação percentual da DCL sobre a RCL (Indicador 1 CAPAG / LRF)"
        tests:
          - not_null
      - name: indicador_2_poupanca_corrente_pct
        description: "Relação Despesa Corrente sobre Receita Corrente (Indicador 2 CAPAG)"
        tests:
          - not_null
      - name: indicador_3_liquidez_relativa_pct
        description: "Relação Obrigações Financeiras sobre Disponibilidade de Caixa (Indicador 3 CAPAG)"
        tests:
          - not_null
      - name: total_fpm_bruto_anual
        description: "Montante bruto anual de repasses do FPM transferidos em BRL"
        tests:
          - not_null
      - name: total_fpm_liquido_anual
        description: "Montante líquido anual de repasses do FPM creditados em BRL"
        tests:
          - not_null
      - name: total_pleitos_pvl
        description: "Quantidade total de operações de crédito submetidas ao SADIPEM"
        tests:
          - not_null
      - name: volume_credito_solicitado_pvl
        description: "Volume financeiro total de crédito pleiteado no SADIPEM em BRL"
        tests:
          - not_null
      - name: volume_credito_deferido_pvl
        description: "Volume financeiro de crédito com parecer deferido pela STN em BRL"
        tests:
          - not_null
      - name: classificacao_saude_fiscal
        description: "Classificação categórica de saúde fiscal (EXCELENTE_CAPAG_A, REGULAR_CAPAG_B, CRITICO_CAPAG_C)"
        tests:
          - not_null

  - name: mart_operacoes_credito_sadipem
    description: "Datamart de operações de crédito e financiamentos subnacionais avaliados pelo Tesouro Nacional (SADIPEM PVL)"
    columns:
      - name: id_pleito
