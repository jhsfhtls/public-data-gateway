          - not_null
          - unique
      - name: tipo_interessado
        description: "Tipo de ente federativo proponente"
        tests:
          - not_null
      - name: interessado
        description: "Razão social ou nome oficial do ente proponente"
        tests:
          - not_null
      - name: id_municipio_ibge_7d
        description: "Código IBGE de 7 dígitos do município"
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla da Unidade Federativa"
        tests:
          - not_null
      - name: num_pvl
        description: "Número do processo de Verificação de Limites e Condições (PVL)"
        tests:
          - not_null
      - name: status_pleito
        description: "Status de deferimento ou análise conclusiva da STN"
        tests:
          - not_null
      - name: tipo_operacao
        description: "Classificação da operação contratual de crédito"
        tests:
          - not_null
      - name: finalidade
        description: "Destinação socioeconômica dos recursos"
        tests:
          - not_null
      - name: tipo_credor
        description: "Classificação institucional do credor financeiro"
        tests:
          - not_null
      - name: credor
        description: "Nome da instituição credora"
        tests:
          - not_null
      - name: moeda
        description: "Moeda padrão do contrato"
        tests:
          - not_null
      - name: valor_operacao
        description: "Valor contratual autorizado da operação em BRL"
        tests:
          - not_null
      - name: data_status
        description: "Data da homologação do pleito"
        tests:
          - not_null
      - name: nota_capag_proponente
        description: "Nota CAPAG do proponente da operação (A, B, C ou N/A)"
        tests:
          - not_null
      - name: faixa_valor_credito
        description: "Faixa de porte do valor de crédito (GRANDE_PORTE, MEDIO_PORTE, PEQUENO_PORTE)"
        tests:
          - not_null

  - name: mart_contabilidade_fiscal_siconfi
    description: "Datamart intra-domínio macrofinanceiro consolidando balanços patrimoniais (DCA), execução orçamentária (RREO), limites LRF de pessoal e dívida (RGF) e score de solidez contábil SICONFI por município"
    columns:
      - name: id_municipio
        description: "Código IBGE canônico de 7 dígitos do município"
        tests:
          - not_null
          - unique
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade da Federação"
        tests:
          - not_null
      - name: nome_ente
        description: "Nome oficial do ente federativo no SICONFI"
        tests:
