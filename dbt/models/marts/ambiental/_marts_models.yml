      - name: taxa_eventos_criticos_media_pct
        description: "Taxa média percentual de eventos críticos hidrológicos."
        tests: [not_null]
      - name: score_seguranca_hidrica_hidroweb
        description: "Score composto de segurança hídrica e telemetria ANA HidroWeb (0-100)."
        tests: [not_null]
      - name: tier_seguranca_hidrica_hidroweb
        description: "Classificação municipal em 4 tiers de segurança hídrica HidroWeb."
        tests: [not_null]
      - name: reference_date
        description: "Data de referência ISO-8601 (YYYY-MM-DD)."
        tests: [not_null]

