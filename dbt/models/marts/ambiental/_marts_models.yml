version: 2

models:
  - name: mart_desmatamento_terrabrasilis_brasil
    description: "Mart analítico ambiental de monitoramento PRODES/DETER do INPE TerraBrasilis, conformidade ao Código Florestal e risco EUDR/ESG por município brasileiro."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests: [not_null, unique]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: sigla_uf
        description: "Sigla da Unidade Federativa."
        tests: [not_null]
      - name: id_uf
        description: "Código IBGE da UF."
        tests: [not_null]
      - name: regiao
        description: "Grande região geográfica brasileira."
        tests: [not_null]
      - name: bioma_predominante
        description: "Bioma predominante no município."
        tests: [not_null]
      - name: ano_prodes
        description: "Ano-calendário PRODES de referência."
        tests: [not_null]
      - name: area_desmatada_prodes_km2
        description: "Incremento anual de desmatamento PRODES (km²)."
        tests: [not_null]
      - name: cobertura_florestal_remanescente_pct
        description: "Cobertura florestal remanescente (%)."
        tests: [not_null]
      - name: variacao_anual_prodes_pct
        description: "Variação anual do desmatamento PRODES (%)."
        tests: [not_null]
      - name: total_alertas_deter_ano
        description: "Total agregado de alertas DETER emitidos no município."
        tests: [not_null]
      - name: area_total_alertas_deter_km2
        description: "Área total agregada de alertas DETER no município (km²)."
        tests: [not_null]
      - name: conformidade_codigo_florestal_pct
        description: "Conformidade estimada ao Código Florestal (%)."
        tests: [not_null]
      - name: embargos_ibama_ativos_ano
        description: "Embargos ambientais ativos no município."
        tests: [not_null]
      - name: elegibilidade_credito_rural_esg_pct
        description: "Elegibilidade a crédito rural ESG (%)."
        tests: [not_null]
      - name: risco_desconformidade_eudr_pct
        description: "Exposição a desconformidade EUDR (%)."
        tests: [not_null]
      - name: indice_prontidao_fiscalizacao
        description: "Índice de prontidão de fiscalização ambiental (0-100)."
        tests: [not_null]
      - name: score_preservacao_conformidade_florestal
        description: "Score normalizado (0-100) de preservação e conformidade florestal."
        tests: [not_null]
      - name: score_pressao_desmatamento_deter
        description: "Score normalizado (0-100) de pressão de desmatamento PRODES/DETER e risco EUDR."
        tests: [not_null]
      - name: score_composto_risco_esg_territorial
        description: "Score composto (0-100) de sustentabilidade territorial e conformidade ESG/EUDR."
        tests: [not_null]
      - name: perfil_risco_ambiental_terrabrasilis
        description: "Classificação estratégica do perfil de risco ambiental e conformidade EUDR (4 tiers)."
        tests: [not_null]
      - name: reference_date
        description: "Data de referência do ciclo anual TerraBrasilis."
        tests: [not_null]
      - name: extracted_at
        description: "Timestamp UTC ISO-8601 da extração."
        tests: [not_null]

  - name: mart_seguranca_hidrica_hidroweb_brasil
    description: "Data Mart Gold de segurança hídrica, telemetria e risco de cheias/estiagens ANA HidroWeb por município."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos identificador único do município."
        tests: [not_null, unique]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests: [not_null]
      - name: id_uf
        description: "Código IBGE de 2 dígitos da UF."
        tests: [not_null]
      - name: regiao
        description: "Grande região geográfica brasileira."
        tests: [not_null]
      - name: regiao_hidrografica
        description: "Região ou bacia hidrográfica predominante."
        tests: [not_null]
      - name: ano_referencia
        description: "Ano de referência da consolidação hidrológica."
        tests: [not_null]
      - name: qtd_estacoes_telemetricas_ativas
        description: "Quantidade de estações telemétricas ativas."
        tests: [not_null]
      - name: disponibilidade_telemetria_pct
        description: "Disponibilidade percentual da telemetria."
        tests: [not_null]
      - name: vazao_media_global_m3s
        description: "Vazão média agregada entre segmentos monitorados (m3/s)."
        tests: [not_null]
      - name: cota_media_global_cm
        description: "Cota fluviométrica média agregada (cm)."
        tests: [not_null]
      - name: precipitacao_acumulada_anual_mm
        description: "Precipitação acumulada anual (mm)."
        tests: [not_null]
      - name: comprometimento_balanco_hidrico_pct
        description: "Comprometimento percentual do balanço hídrico municipal."
        tests: [not_null]
      - name: indice_cobertura_rede_hidroweb
        description: "Subíndice de cobertura e disponibilidade da rede telemétrica (0-100)."
        tests: [not_null]
      - name: indice_equilibrio_pluviometrico
        description: "Subíndice de equilíbrio pluviométrico (0-100)."
        tests: [not_null]
      - name: indice_resiliencia_hidrica
        description: "Subíndice de resiliência e qualidade hídrica (0-100)."
        tests: [not_null]
      - name: taxa_eventos_criticos_media_pct
        description: "Taxa média percentual de eventos críticos hidrológicos."
        tests: [not_null]
      - name: score_seguranca_hidrica_hidroweb
        description: "Score composto de segurança hídrica e telemetria ANA HidroWeb (0-100)."
        tests: [not_null]
      - name: tier_seguranca_hidrica_hidroweb
        description: "Classificação municipal em 4 tiers de segurança hídrica HidroWeb."
        tests: [not_null]
      - name: reference_date
        description: "Data de referência ISO-8601 (YYYY-MM-DD)."
        tests: [not_null]

