      - name: indice_resiliencia_solo_ad
        description: "Subíndice sintético de resiliência hídrica do solo AD (0-100)."
        tests: [not_null]
      - name: score_aptidao_zarc
        description: "Score composto de aptidão agroclimática e proteção ZARC (0-100)."
        tests: [not_null]
      - name: tier_risco_zarc
        description: "Classificação municipal em 4 tiers de risco agroclimático ZARC."
        tests: [not_null]
      - name: reference_date
        description: "Data de referência ISO-8601 (YYYY-MM-DD)."
        tests: [not_null]
