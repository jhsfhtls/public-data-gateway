  - name: feature_store_cross_domain_municipio
    description: "Feature Store consolidada Gold por município (5.571 municípios) com alinhamento temporal ASOF JOIN macroeconômico para modelos preditivos de propensão B2B e risco."
    columns:
      - name: id_municipio
