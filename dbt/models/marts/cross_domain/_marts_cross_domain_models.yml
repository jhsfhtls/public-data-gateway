      - name: vazao_media_global_m3s
        description: "Vazão média observada nas estações telemétricas ANA (m3/s)."
        tests: [not_null]
      - name: precipitacao_acumulada_anual_mm
        description: "Precipitação acumulada anual média em milímetros."
        tests: [not_null]
      - name: score_seguranca_hidrica_hidroweb
        description: "Score composto de segurança hídrica ANA HidroWeb (0-100)."
        tests: [not_null]
      - name: populacao_coberta_5g_pct
        description: "Percentual da população municipal com cobertura 5G (%)."
        tests: [not_null]
      - name: participacao_fibra_ftth_pct
        description: "Participação de acessos em fibra óptica FTTH (%)."
        tests: [not_null]
      - name: score_conectividade_digital
        description: "Score composto de conectividade digital ANATEL (0-100)."
        tests: [not_null]
      - name: reference_date
        description: "Data de referência ISO-8601 (YYYY-MM-DD)."
        tests: [not_null]
      - name: score_sustentabilidade_agro_infra
        description: "Score cross-domain de sustentabilidade ESG, aptidão agro e conectividade (0-100)."
        tests: [not_null]
      - name: tier_prontidao_esg_agro
        description: "Classificação municipal de prontidão ESG, agro e infraestrutura digital."
        tests: [not_null]

