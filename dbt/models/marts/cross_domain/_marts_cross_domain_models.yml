version: 2

models:
  - name: mart_cross_domain_territorio_b2b_macro_brasil
    description: "Data Mart Gold cross-domain estadual consolidando Território, Emprego Formal, Densidade Empresarial B2B, Compras Públicas, Sanções e Cenário Macroeconômico."
    columns:
      - name: sigla_uf
        description: "Sigla oficial da Unidade da Federação (UF)."
        tests: [not_null, unique]
      - name: regiao
        description: "Macrorregião geográfica brasileira."
        tests: [not_null]
      - name: qtd_municipios_uf
        description: "Quantidade de municípios na UF."
        tests: [not_null]
      - name: pib_total_uf_mil_reais
        description: "Soma do PIB municipal da UF em mil reais."
        tests: [not_null]
      - name: populacao_total_uf
        description: "População residente agregada na UF."
        tests: [not_null]
      - name: pib_per_capita_medio_uf
        description: "PIB per capita médio dos municípios da UF em reais."
        tests: [not_null]
      - name: indice_gini_uf
        description: "Índice de Gini médio estadual de desigualdade de rendimento."
        tests: [not_null]
      - name: saldo_emprego_formal_uf
        description: "Saldo líquido de admissões menos desligamentos formais na UF."
        tests: [not_null]
      - name: salario_medio_admissao_uf
        description: "Salário médio real de admissão na UF em reais."
        tests: [not_null]
      - name: score_aquecimento_trabalho_uf
        description: "Score médio estadual de aquecimento do mercado de trabalho formal (0-100)."
        tests: [not_null]
      - name: total_estabelecimentos_ativos
        description: "Total de estabelecimentos empresariais ativos na UF."
        tests: [not_null]
      - name: total_empresas_distintas
        description: "Total de empresas distintas por CNPJ básico na UF."
        tests: [not_null]
      - name: capital_social_total_uf
        description: "Soma do capital social empresarial declarado na UF."
        tests: [not_null]
      - name: taxa_optantes_simples_pct
        description: "Percentual de estabelecimentos optantes pelo Simples Nacional (%)."
        tests: [not_null]
      - name: total_contratacoes_publicas_uf
        description: "Quantidade total de contratações públicas homologadas via PNCP na UF."
        tests: [not_null]
      - name: valor_homologado_compras_uf
        description: "Volume financeiro homologado em compras públicas na UF."
        tests: [not_null]
      - name: taxa_economia_licitatoria_uf_pct
        description: "Economia média estimada em processos licitatórios na UF (%)."
        tests: [not_null]
      - name: total_sancoes_ativas_uf
        description: "Total de sanções administrativas ativas registradas para órgãos da UF."
        tests: [not_null]
      - name: valor_multas_ativas_uf
        description: "Valor agregado de multas administrativas ativas na UF."
        tests: [not_null]
      - name: macro_ano_mes_referencia
        description: "Competência macroeconômica de referência (YYYY-MM)."
        tests: [not_null]
      - name: selic_meta_fim_mes_pct
        description: "Taxa Selic meta anual de referência (% a.a.)."
        tests: [not_null]
      - name: ipca_acumulado_12m_pct
        description: "Inflação acumulada IPCA em 12 meses (%)."
        tests: [not_null]
      - name: juros_real_ex_post_pct
        description: "Taxa de juros real ex-post (Selic menos IPCA 12m, %)."
        tests: [not_null]
      - name: regime_politica_monetaria
        description: "Classificação do regime de política monetária vigente."
        tests: [not_null]
      - name: score_dinamismo_b2b_territorial
        description: "Índice composto de dinamismo B2B, emprego e compras públicas por UF (0-100)."
        tests: [not_null]
      - name: tier_oportunidade_b2b_uf
        description: "Classificação estadual em 4 tiers de oportunidade B2B territorial."
        tests: [not_null]

  - name: mart_cross_domain_esg_agro_infra_brasil
    description: "Data Mart Gold cross-domain municipal integrando Desmatamento (INPE), Cadastro Ambiental Rural (SICAR), Aptidão Agroclimática (ZARC), Segurança Hídrica (ANA) e Telecom 5G/Fibra (ANATEL)."
