        description: "Quantidade de imóveis rurais ativos no SICAR."
        tests: [not_null]
      - name: imoveis_livres_embargo_ibama_pct
        description: "Percentual de imóveis rurais sem embargos IBAMA ativos (%)."
        tests: [not_null]
      - name: score_conformidade_sicar
        description: "Score de conformidade fundiária e ambiental SICAR (0-100)."
        tests: [not_null]
      - name: qtd_culturas_zoneadas
        description: "Quantidade de culturas agrícolas com janelas ZARC no município."
        tests: [not_null]
      - name: adesao_zarc_credito_custeio_pct
        description: "Adesão ao zoneamento ZARC em operações de crédito rural (%)."
        tests: [not_null]
      - name: score_aptidao_zarc
        description: "Score composto de aptidão agroclimática ZARC/PROAGRO (0-100)."
