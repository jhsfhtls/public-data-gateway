version: 2

models:
  - name: mart_compras_publicas_brasil
    description: "Datamart analítico intra-domínio consolidando indicadores agregados de compras públicas e contratações do PNCP por UF, esfera federativa, modalidade e ano."
    columns:
      - name: sigla_uf
        description: "Sigla de 2 letras maiúsculas da Unidade Federativa da contratação ou ND para âmbito nacional/indefinido."
        tests:
          - not_null
      - name: esfera_id
        description: "Esfera de governo da contratação (F=Federal, E=Estadual, M=Municipal, D=Distrital)."
        tests:
          - not_null
      - name: modalidade_nome
        description: "Denominação da modalidade de contratação da Lei 14.133/2021."
        tests:
          - not_null
      - name: ano_compra
        description: "Ano civil de exercício da contratação pública."
        tests:
          - not_null
      - name: total_contratacoes
        description: "Quantidade total de processos e licitações públicas distintos."
        tests:
          - not_null
      - name: total_contratacoes_srp
        description: "Quantidade total de licitações sob o Sistema de Registro de Preços."
        tests:
          - not_null
      - name: valor_total_estimado
        description: "Soma do valor financeiro estimado orçado pela Administração em Reais (R$)."
        tests:
          - not_null
      - name: valor_total_homologado
        description: "Soma do valor financeiro final adjudicado e homologado em Reais (R$)."
        tests:
          - not_null
      - name: economia_estimada_homologada_absoluta
        description: "Economia orçamentária total obtida na fase competitiva (estimado - homologado) em R$."
        tests:
          - not_null
      - name: taxa_economia_licitatoria_pct
        description: "Taxa percentual de economia / deságio obtida sobre o valor estimado."
        tests:
          - not_null
      - name: ticket_medio_contratacao
        description: "Valor financeiro médio homologado por certame licitatório em Reais (R$)."
        tests:
          - not_null
      - name: total_orgaos_distintos
        description: "Contagem de órgãos e entidades compradoras distintas com certames no grupo."
        tests:
          - not_null

  - name: mart_benchmark_precos_catmat
    description: "Datamart analítico de benchmark de preços públicos praticados por Padrão Descritivo de Material (PDM), calculando preço médio, amplitude e volume."
    columns:
      - name: codigo_pdm
        description: "Código do Padrão Descritivo de Material (PDM)."
        tests:
          - not_null
          - unique
      - name: nome_pdm
        description: "Nome do Padrão Descritivo de Material (PDM)."
        tests:
          - not_null
      - name: total_itens_comprados
        description: "Quantidade total de itens adjudicados no catálogo."
        tests:
          - not_null
      - name: quantidade_total
        description: "Volume físico total adquirido pelos órgãos públicos."
        tests:
          - not_null
      - name: valor_total_homologado
        description: "Montante financeiro total gasto nas aquisições em R$."
        tests:
          - not_null
      - name: preco_medio_praticado
        description: "Preço unitário médio homologado nas licitações em R$."
        tests:
          - not_null
      - name: preco_minimo
        description: "Menor preço unitário homologado no período em R$."
        tests:
          - not_null
      - name: preco_maximo
        description: "Maior preço unitário homologado no período em R$."
        tests:
          - not_null
      - name: amplitude_preco
        description: "Diferença entre o preço máximo e o preço mínimo em R$."
        tests:
          - not_null
      - name: total_fornecedores
        description: "Número total de fornecedores distintos contratados."
        tests:
          - not_null
      - name: total_uasgs_compradoras
        description: "Número total de unidades compradoras (UASGs) adquirentes."
        tests:
          - not_null
      - name: total_ufs_atendidas
        description: "Total de Unidades Federativas com aquisições do material."
        tests:
          - not_null

  - name: mart_fornecedores_destaque_comprasgov
    description: "Datamart de inteligência de fornecedores de compras públicas, segmentando atuação por porte governamental e ticket médio."
    columns:
      - name: cnpj_fornecedor
        description: "CNPJ de 14 dígitos do fornecedor de compras públicas."
        tests:
          - not_null
          - unique
      - name: nome_fornecedor
        description: "Razão social da empresa fornecedora."
        tests:
          - not_null
      - name: total_itens_fornecidos
        description: "Quantidade total de itens fornecidos."
        tests:
          - not_null
      - name: valor_total_fornecido
        description: "Valor total fornecido para o setor público em R$."
        tests:
          - not_null
      - name: ticket_medio_unitario
        description: "Ticket médio financeiro por unidade de item em R$."
        tests:
          - not_null
      - name: total_uasgs_atendidas
        description: "Total de órgãos compradores (UASGs) atendidos."
        tests:
          - not_null
      - name: sigla_uf_principal
        description: "UF prioritária de entrega e execução contratual."
        tests:
          - not_null
      - name: perfil_porte_governamental
        description: "Classificação do porte do fornecedor perante o Estado (ESTRATEGICO, MEDIO ou REGIONAL)."
        tests:
          - not_null

  - name: mart_querido_diario_okbr_brasil
    description: "Data Mart Gold intra-domínio consolidando Diários Oficiais Municipais do Querido Diário (OKBR), extratos licitatórios NLP, OCR e maturidade de transparência ativa."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município (STRING)."
        tests: [not_null, unique]
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa (UF)."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: regiao
        description: "Macrorregião geográfica brasileira."
        tests: [not_null]
      - name: edicoes_indexadas_12m
        description: "Total de edições indexadas do Diário Oficial Municipal em 12 meses."
        tests: [not_null]
      - name: qtd_atos_licitatorios_12m
        description: "Total de atos licitatórios e dispensas extraídos em 12 meses."
        tests: [not_null]
      - name: valor_extratos_citados_mil_brl
        description: "Montante citado em extratos contratuais nos Diários Oficiais (R$ mil)."
        tests: [not_null]
      - name: taxa_ocr_legivel_pct
        description: "Percentual de extração textual OCR legível dos exemplares (%)."
        tests: [not_null]
      - name: indice_transparencia_diario_pct
        description: "Índice de transparência ativa e acessibilidade do Diário Oficial (%)."
        tests: [not_null]
      - name: qtd_temas_indexados_okbr
        description: "Quantidade de temas normativos consolidados na Silver OKBR."
        tests: [not_null]
      - name: mencoes_educacao_saude_12m
        description: "Quantidade de menções indexadas a Educação e Saúde em 12 meses."
        tests: [not_null]
      - name: mencoes_esg_clima_12m
        description: "Quantidade de menções indexadas a sustentabilidade e clima em 12 meses."
        tests: [not_null]
      - name: cobertura_historica_anos
        description: "Profundidade do arquivo histórico digital do Diário Oficial (anos)."
        tests: [not_null]
      - name: formato_aberto_pdf_txt_pct
        description: "Percentual de edições em formato aberto e processável por máquina (%)."
        tests: [not_null]
      - name: regularidade_publicacao_pct
        description: "Taxa percentual de regularidade das publicações oficiais (%)."
        tests: [not_null]
      - name: score_transparencia_diario_oficial
        description: "Score sintético municipal de transparência oficial, legibilidade OCR e regularidade no Querido Diário (0-100)."
        tests: [not_null]
      - name: tier_maturidade_diario_oficial
        description: "Classificação municipal OKBR (DIARIO_OFICIAL_EXEMPLAR, TRANSPARENCIA_MUNICIPAL_REGULAR ou BAIXA_DIGITALIZACAO_DIARIO)."
        tests: [not_null]

