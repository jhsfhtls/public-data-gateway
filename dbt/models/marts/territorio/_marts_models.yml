          - not_null
      - name: empregado_sem_carteira_mil
        description: "Empregados no setor privado sem carteira assinada em milhares."
        tests:
          - not_null
      - name: taxa_informalidade_pct
        description: "Taxa oficial de informalidade da população ocupada (%)."
        tests:
          - not_null
      - name: taxa_desocupacao_homens_pct
        description: "Taxa de desocupação masculina (%)."
        tests:
          - not_null
      - name: taxa_desocupacao_mulheres_pct
        description: "Taxa de desocupação feminina (%)."
        tests:
          - not_null
      - name: taxa_desocupacao_jovens_18_24_pct
        description: "Taxa de desocupação de jovens entre 18 e 24 anos (%)."
        tests:
          - not_null
      - name: razao_rendimento_mulher_homem
        description: "Razão de rendimento habitual entre mulheres e homens."
        tests:
          - not_null
      - name: score_resiliencia_mercado_trabalho
        description: "Score contínuo sintético (0 a 100) medindo solidez, renda e formalização do mercado de trabalho estadual."
        tests:
          - not_null
      - name: classificacao_mercado_trabalho_uf
        description: "Classificação macro da dinâmica de emprego estadual (MERCADO_AQUECIDO_ALTA_RENDA, MERCADO_RESILIENTE, ALTA_VULNERABILIDADE_INFORMAL, MERCADO_EQUILIBRADO)."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência da consolidação analítica."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC de extração dos dados."
        tests:
          - not_null

  - name: mart_geografia_enderecamento_edificacoes_brasil
    description: "Mart analítico territorial consolidando densidade de endereços, espécies de edificações, índice de georreferenciamento e perfil de uso do solo municipal do CNEFE Censo 2022."
