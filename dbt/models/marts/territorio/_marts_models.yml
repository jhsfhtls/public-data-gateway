version: 2

models:
  - name: mart_pib_municipal_observacoes
    description: "Data Mart analítico de contas econômicas municipais com abertura setorial VAB, participações e vocação econômica predominante."
    columns:
      - name: id_municipio
        description: "Código IBGE de sete dígitos do município."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: sigla_uf
        description: "Sigla da Unidade Federativa."
        tests: [not_null]
      - name: regiao
        description: "Grande região geográfica do município."
        tests: [not_null]
      - name: is_capital
        description: "Flag booleano indicando se o município é capital."
        tests: [not_null]
      - name: is_amazonia_legal
        description: "Flag booleano indicando se o município integra a Amazônia Legal."
        tests: [not_null]
      - name: ano
        description: "Ano civil de referência da publicação do PIB municipal."
        tests: [not_null]
      - name: valor_pib_mil_reais
        description: "Produto Interno Bruto a preços correntes em mil reais."
        tests: [not_null]
      - name: valor_impostos_liquidos_mil_reais
        description: "Impostos líquidos de subsídios sobre produtos em mil reais."
        tests: [not_null]
      - name: vab_total_mil_reais
        description: "Valor Adicionado Bruto total a preços correntes em mil reais."
        tests: [not_null]
      - name: vab_agropecuaria_mil_reais
        description: "Valor Adicionado Bruto da agropecuária em mil reais."
        tests: [not_null]
      - name: vab_industria_mil_reais
        description: "Valor Adicionado Bruto da indústria em mil reais."
        tests: [not_null]
      - name: vab_servicos_mil_reais
        description: "Valor Adicionado Bruto dos serviços exclusive administração pública em mil reais."
        tests: [not_null]
      - name: vab_administracao_publica_mil_reais
        description: "Valor Adicionado Bruto da administração pública em mil reais."
        tests: [not_null]
      - name: participacao_pib_brasil_pct
        description: "Participação percentual do município no PIB do Brasil."
        tests: [not_null]
      - name: participacao_pib_uf_pct
        description: "Participação percentual do município no PIB da sua UF."
        tests: [not_null]
      - name: share_vab_agropecuaria_pct
        description: "Participação percentual do VAB agropecuário no VAB total municipal."
      - name: share_vab_industria_pct
        description: "Participação percentual do VAB industrial no VAB total municipal."
      - name: share_vab_servicos_pct
        description: "Participação percentual do VAB de serviços no VAB total municipal."
      - name: share_vab_administracao_publica_pct
        description: "Participação percentual da administração pública no VAB total municipal."
      - name: vocacao_economica_predominante
        description: "Setor produtivo líder em geração de valor adicionado no município."
        tests: [not_null]
      - name: grau_concentracao_nacional
        description: "Classificação analítica do grau de concentração do PIB no total nacional."
        tests: [not_null]
      - name: fonte
        description: "Tabela oficial SIDRA de origem dos dados."
        tests: [not_null]
      - name: extracted_at
        description: "Timestamp UTC da extração dos dados."
        tests: [not_null]
  - name: mart_hierarquia_territorial_brasil
    description: "Data Mart analítico consolidando a hierarquia territorial completa do Brasil com contagens e métricas agregadas intra-domínio."
    columns:
      - name: id_municipio
        description: "Código oficial do município IBGE com 7 dígitos (chave primária natural do mart)."
        tests:
          - unique
          - not_null
      - name: id_municipio_6
        description: "Código legado do município com 6 dígitos para integração multissetorial."
        tests:
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município registrado no IBGE."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras maiúsculas da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código numérico da UF com 2 dígitos."
        tests:
          - not_null
      - name: nome_uf
        description: "Nome por extenso da Unidade Federativa."
        tests:
          - not_null
      - name: regiao
        description: "Nome oficial da macrorregião geográfica brasileira."
        tests:
          - not_null
      - name: sigla_regiao
        description: "Sigla da macrorregião geográfica (N, NE, SE, S, CO)."
        tests:
          - not_null
      - name: mesorregiao
        description: "Nome da mesorregião geográfica do IBGE."
      - name: microrregiao
        description: "Nome da microrregião geográfica do IBGE."
      - name: regiao_intermediaria
        description: "Nome da região geográfica intermediária segundo taxonomia do IBGE."
      - name: regiao_imediata
        description: "Nome da região geográfica imediata segundo taxonomia do IBGE."
      - name: is_capital
        description: "Flag booleana indicando se o município é a capital estadual ou federal."
        tests:
          - not_null
      - name: is_amazonia_legal
        description: "Flag booleana indicando se o município integra a área delimitada da Amazônia Legal."
        tests:
          - not_null
      - name: qtd_distritos_no_municipio
        description: "Quantidade total de distritos municipais subordinados ao município."
        tests:
          - not_null
      - name: qtd_subdistritos_no_municipio
        description: "Quantidade total de subdistritos municipais subordinados ao município."
        tests:
          - not_null
      - name: qtd_municipios_na_uf
        description: "Total de municípios existentes dentro da mesma Unidade Federativa."
        tests:
          - not_null
      - name: qtd_municipios_na_regiao
        description: "Total de municípios existentes dentro da mesma macrorregião geográfica."
        tests:
          - not_null
      - name: reference_date
        description: "Data de corte e competência territorial oficial no formato YYYY-MM-DD."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 da extração dos dados originais."
        tests:
          - not_null

  - name: mart_perfil_socioeconomico_municipios
    description: "Data Mart estratégico consolidando o perfil socioeconômico completo dos municípios brasileiros: PIB per capita, composição do valor adicionado, porte populacional, vocação produtiva e distribuição de renda."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos identificador único do município."
        tests:
          - unique
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município brasileiro."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: regiao
        description: "Grande região geográfica do município."
      - name: is_capital
        description: "Flag booleana indicando se o município é capital de estado."
      - name: is_amazonia_legal
        description: "Flag booleana indicando se o município pertence à Amazônia Legal."
      - name: ano_referencia_pib
        description: "Ano de apuração estatística do Produto Interno Bruto."
        tests:
          - not_null
      - name: ano_referencia_populacao
        description: "Ano do Censo Demográfico oficial de contagem de habitantes."
        tests:
          - not_null
      - name: pib_mil_reais
        description: "Valor do PIB a preços correntes em milhares de reais."
        tests:
          - not_null
      - name: populacao_residente
        description: "Número total de habitantes residentes apurado pelo IBGE."
        tests:
          - not_null
      - name: pib_per_capita_reais
        description: "PIB per capita do município em reais correntes anuais."
        tests:
          - not_null
      - name: participacao_pib_brasil_pct
        description: "Participação percentual do município no PIB total do Brasil."
      - name: participacao_pib_uf_pct
        description: "Participação percentual do município no PIB do seu respectivo estado."
      - name: share_vab_agropecuaria_pct
        description: "Participação percentual da agropecuária no valor adicionado bruto total."
      - name: share_vab_industria_pct
        description: "Participação percentual da indústria no valor adicionado bruto total."
      - name: share_vab_servicos_pct
        description: "Participação percentual dos serviços de mercado no valor adicionado bruto total."
      - name: share_vab_administracao_publica_pct
        description: "Participação percentual da administração pública no valor adicionado bruto total."
      - name: perfil_economico_dominante
        description: "Classificação do perfil produtivo dominante (AGROPECUARIO, INDUSTRIAL, SERVICOS, ADMINISTRACAO_PUBLICA)."
        tests:
          - not_null
      - name: classificacao_porte_municipio
        description: "Classificação do porte populacional (METROPOLE, GRANDE_PORTE, MEDIO_PORTE, PEQUENO_PORTE)."
        tests:
          - not_null
      - name: valor_producao_agricola_mil_reais
        description: "Valor total anual da produção agrícola segundo a PAM em milhares de reais."
      - name: principal_cultura_agricola
        description: "Denominação da cultura agrícola de maior destaque no município."
      - name: indice_gini_uf
        description: "Índice de Gini estadual de concentração de renda domiciliar per capita."
      - name: rendimento_medio_domiciliar_uf_reais
        description: "Rendimento médio domiciliar per capita mensal da Unidade Federativa em reais."
      - name: reference_date
        description: "Data de referência da consolidação analítica."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 da extração das fontes estatísticas."
        tests:
          - not_null

  - name: mart_indicadores_inflacao_desigualdade
    description: "Data Mart macroeconômico correlacionando a evolução cronológica da inflação oficial (IPCA) com desigualdade de renda e rendimento domiciliar nacional."
    columns:
      - name: ano_mes
        description: "Identificador cronológico da série no formato AAAAMM."
        tests:
          - not_null
      - name: ano
        description: "Ano civil de referência da apuração."
        tests:
          - not_null
      - name: mes
        description: "Mês numérico de referência (1 a 12)."
        tests:
          - not_null
      - name: mes_ano_extenso
        description: "Mês e ano descritos por extenso."
      - name: ipca_variacao_mensal_pct
        description: "Variação mensal do IPCA em percentual."
        tests:
          - not_null
      - name: ipca_acumulado_ano_pct
        description: "Inflação acumulada no ano civil em percentual."
      - name: ipca_acumulado_12m_pct
        description: "Inflação acumulada na janela móvel de 12 meses em percentual."
      - name: regime_inflacionario_mensal
        description: "Classificação analítica do regime de preços (DEFLACAO, ESTABILIDADE, MODERADA, ALTA)."
      - name: media_gini_nacional
        description: "Média aritmética nacional dos índices de Gini estaduais no ano."
      - name: media_rendimento_domiciliar_nacional_reais
        description: "Média nacional do rendimento médio domiciliar per capita em reais correntes."
      - name: classificacao_clima_macroeconomico
        description: "Enquadramento sintético de risco social e estabilidade macroeconômica."
      - name: reference_date
        description: "Data de referência da consolidação analítica."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 da extração dos indicadores."
        tests:
          - not_null

  - name: mart_censo_transicao_demografica_brasil
    description: "Data Mart analítico da transição demográfica, envelhecimento, alfabetização, diversidade e vulnerabilidade social dos municípios segundo o Censo 2022."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests:
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: regiao
        description: "Grande região geográfica do Brasil."
      - name: is_capital
        description: "Flag booleana indicando se o município é capital."
        tests:
          - not_null
      - name: ano_censo
        description: "Ano censitário oficial (2022)."
        tests:
          - not_null
      - name: populacao_residente
        description: "População residente apurada no Censo 2022."
        tests:
          - not_null
      - name: total_domicilios_particulares_ocupados
        description: "Quantidade de domicílios particulares permanentes ocupados."
        tests:
          - not_null
      - name: total_moradores_domicilios_ocupados
        description: "Total de residentes em domicílios particulares ocupados."
        tests:
          - not_null
      - name: media_moradores_por_domicilio
        description: "Média de moradores por domicílio particular permanente ocupado."
        tests:
          - not_null
      - name: area_territorial_km2
        description: "Área territorial oficial do município em km²."
        tests:
          - not_null
      - name: densidade_demografica_hab_km2
        description: "Densidade demográfica em habitantes por km²."
        tests:
          - not_null
      - name: classificacao_densidade
        description: "Enquadramento da densidade demográfica (ALTA_DENSIDADE, MEDIA_DENSIDADE, BAIXA_DENSIDADE)."
        tests:
          - not_null
      - name: idade_mediana_anos
        description: "Idade que divide a população municipal ao meio."
      - name: indice_envelhecimento_razao
        description: "Número de idosos (65+ anos) por 100 jovens (0 a 14 anos)."
      - name: classificacao_etaria
        description: "Classificação etária do município (JOVEM, TRANSICAO_AVANCADA, ENVELHECIDA)."
        tests:
          - not_null
      - name: razao_sexo_homens_por_100_mulheres
        description: "Número de homens residentes para cada 100 mulheres."
      - name: populacao_homens
        description: "População total residente do sexo masculino."
      - name: populacao_mulheres
        description: "População total residente do sexo feminino."
      - name: populacao_15_anos_ou_mais
        description: "População residente com 15 anos ou mais de idade."
      - name: populacao_alfabetizada
        description: "População residente de 15+ anos alfabetizada."
      - name: taxa_alfabetizacao_pct
        description: "Taxa de alfabetização das pessoas de 15+ anos em percentual."
      - name: taxa_analfabetismo_pct
        description: "Taxa de analfabetismo apurada em percentual."
      - name: populacao_urbana
        description: "População residente em perímetro urbano."
      - name: populacao_rural
        description: "População residente em perímetro rural."
      - name: taxa_urbanizacao_pct
        description: "Percentual da população que vive em áreas urbanas."
      - name: predominancia_territorial
        description: "Predominância da ocupação territorial (URBANA ou RURAL)."
      - name: populacao_indigena
        description: "Contagem de residentes autodeclarados indígenas."
      - name: populacao_quilombola
        description: "Contagem de residentes autodeclarados quilombolas."
      - name: percentual_indigena_pct
        description: "Percentual da população indígena sobre o total do município."
      - name: percentual_quilombola_pct
        description: "Percentual da população quilombola sobre o total do município."
      - name: score_maturidade_social
        description: "Score composto sintético (0 a 100) ponderando alfabetização e infraestrutura urbana."
        tests:
          - not_null
      - name: score_vulnerabilidade_demografica
        description: "Score composto sintético de vulnerabilidade demográfica e isolamento."
        tests:
          - not_null
      - name: classificacao_porte_censo
        description: "Classificação oficial de porte censitário (METROPOLE, GRANDE_PORTE, MEDIO_PORTE, PEQUENO_PORTE)."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência da consolidação analítica."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração dos dados."
        tests:
          - not_null

  - name: mart_panorama_emprego_estrutural_rais_brasil
    description: "Panorama anual do emprego formal RAIS por município com setor dominante, geografia, remuneração e score Gold."
    columns:
      - name: ano
        description: "Ano civil de referência da RAIS."
        tests:
          - not_null
      - name: id_municipio
        description: "Código IBGE de sete dígitos do município."
        tests:
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município."
      - name: sigla_uf
        description: "Sigla da Unidade Federativa."
      - name: regiao
        description: "Grande região brasileira da dimensão geográfica."
      - name: is_capital
        description: "Indica município capital na dimensão geográfica."
      - name: total_vinculos_ativos
        description: "Estoque de vínculos formais ativos no município."
        tests:
          - not_null
      - name: total_estabelecimentos
        description: "Quantidade total de estabelecimentos nas faixas de porte."
      - name: remuneracao_media_reais
        description: "Remuneração média mensal ponderada em reais."
      - name: remuneracao_media_sm
        description: "Remuneração média mensal ponderada em salários mínimos."
      - name: massa_salarial_anual_reais
        description: "Soma anual das remunerações mensais nominais declaradas, em reais."
      - name: setor_dominante_cnae
        description: "Grande setor com maior número de vínculos, desempate por nome."
      - name: participacao_setor_dominante_pct
        description: "Participação percentual do maior setor no estoque municipal."
      - name: tempo_medio_emprego_meses
        description: "Média de tempo do vínculo, ponderada pelo estoque em cada grupo."
      - name: taxa_vinculos_ate_12_meses_pct
        description: "Parcela ponderada de vínculos de até doze meses; proxy de permanência curta."
      - name: score_formalizacao_trabalho_municipio
        description: "Índice estrutural relativo Gold de zero a cem para comparação analítica; não representa taxa de formalização."
      - name: classificacao_formalizacao_trabalho_municipio
        description: "Classe analítica derivada do score Gold."
      - name: source_url
        description: "Endereço oficial do arquivo RAIS utilizado."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência da fonte."
      - name: extracted_at
        description: "Timestamp UTC da extração."

