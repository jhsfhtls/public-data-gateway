          - not_null
      - name: total_enderecos_municipio
        description: "Volume total de endereços cadastrados no CNEFE."
        tests:
          - not_null
      - name: total_logradouros_distintos
        description: "Total de logradouros distintos catalogados no município."
        tests:
          - not_null
      - name: total_ceps_distintos
        description: "Total de CEPs ativos catalogados no município."
        tests:
          - not_null
      - name: taxa_cobertura_georreferenciada_pct
        description: "Percentual de endereços com coordenadas geográficas precisas validadas."
