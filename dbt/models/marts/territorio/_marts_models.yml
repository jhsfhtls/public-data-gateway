        tests:
          - not_null
      - name: nome_uf
        description: "Nome oficial da Unidade Federativa."
        tests:
          - not_null
      - name: ano_trimestre
        description: "Ano e trimestre apurado no formato AAAA-TT."
        tests:
          - not_null
      - name: populacao_idade_trabalhar_mil
        description: "População em idade de trabalhar (14 anos ou mais) em milhares."
        tests:
          - not_null
      - name: forca_trabalho_total_mil
        description: "População total na força de trabalho em milhares."
        tests:
          - not_null
