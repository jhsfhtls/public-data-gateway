        description: "Data de referência da consolidação analítica."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC de extração dos dados."
        tests:
          - not_null

  - name: mart_panorama_trabalho_renda_estados_brasil
    description: "Data Mart analítico executivo consolidando mercado de trabalho, rendimento real habitual, subutilização, informalidade e resiliência por Estado (IBGE PNAD Contínua)."
