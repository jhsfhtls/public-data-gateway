        tests:
          - not_null
      - name: taxa_desalento_pct
        description: "Taxa de desalento em relação à força ampliada (%)."
        tests:
          - not_null
      - name: empregado_com_carteira_clt_mil
        description: "Empregados no setor privado com carteira de trabalho assinada em milhares."
