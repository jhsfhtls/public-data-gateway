version: 2

models:
  - name: mart_registro_eletronico_imoveis_onr_brasil
    description: "Data Mart analítico ONR/SREI de registro eletrônico de imóveis, maturidade digital SERP/CNM e liquidez de crédito/transações imobiliárias nos municípios brasileiros."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos identificador único do município."
        tests:
          - not_null
          - unique
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da Unidade Federativa."
        tests:
          - not_null
      - name: nome_uf
        description: "Nome completo da Unidade Federativa."
        tests:
          - not_null
      - name: regiao
        description: "Grande região geográfica brasileira."
        tests:
          - not_null
      - name: cep_8
        description: "CEP canônico de 8 dígitos da circunscrição registral de referência no município."
        tests:
          - not_null
      - name: competencia_referencia
        description: "Competência consolidada de referência estatística ONR/SREI."
        tests:
          - not_null
      - name: serventias_ri_integradas_srei
        description: "Quantidade de Ofícios de Registro de Imóveis integrados ao SREI/ONR no município."
        tests:
          - not_null
      - name: total_matriculas_ativas_cnm
        description: "Estoque total de matrículas imobiliárias ativas sob Código Nacional de Matrícula (CNM)."
        tests:
          - not_null
      - name: matriculas_urbanas_ativas
        description: "Quantidade de matrículas imobiliárias urbanas ativas no município."
        tests:
          - not_null
      - name: matriculas_rurais_georreferenciadas
        description: "Quantidade de matrículas rurais georreferenciadas integradas ao SIGEF/CNM."
        tests:
          - not_null
      - name: taxa_conversao_cnm_digital_pct
        description: "Percentual do acervo de matrículas convertido ao padrão digital CNM (%)."
        tests:
          - not_null
      - name: novas_matriculas_abertas_ano
        description: "Quantidade de novas matrículas imobiliárias abertas no exercício anual."
        tests:
          - not_null
      - name: certidoes_digitais_srei_ano
        description: "Quantidade anual de certidões imobiliárias digitais emitidas via SAEC/SREI."
        tests:
          - not_null
      - name: visualizacoes_matricula_online_ano
        description: "Quantidade anual de visualizações de matrículas eletrônicas via plataforma ONR."
        tests:
          - not_null
      - name: total_atos_registrais_imobiliarios_ano
        description: "Total consolidado anual de atos registrais imobiliários praticados nas 4 naturezas."
        tests:
          - not_null
      - name: volume_total_transacionado_milhoes_brl
        description: "Volume financeiro consolidado declarado nas 4 naturezas de atos no ano (milhões BRL)."
        tests:
          - not_null
      - name: contratos_alienacao_fiduciaria_ano
        description: "Quantidade anual de contratos de alienação fiduciária em garantia registrados."
        tests:
          - not_null
      - name: volume_credito_imobiliario_garantido_milhoes_brl
        description: "Volume financeiro anual de crédito imobiliário garantido por alienação fiduciária (milhões BRL)."
        tests:
          - not_null
      - name: participacao_sfi_sbpe_pmcmv_pct
        description: "Participação percentual das transmissões financiadas por SFI/SBPE/PMCMV (%)."
        tests:
          - not_null
      - name: contratos_home_equity_cgi_ano
        description: "Quantidade anual de operações de Crédito com Garantia de Imóvel (Home Equity / CGI)."
        tests:
          - not_null
      - name: intimacoes_purgacao_mora_fiduciaria_ano
        description: "Quantidade anual de intimações extrajudiciais de purgação da mora fiduciária."
        tests:
          - not_null
      - name: consolidacoes_propriedade_inadimplencia_ano
        description: "Quantidade anual de consolidações de propriedade por inadimplência fiduciária."
        tests:
          - not_null
      - name: taxa_execucao_garantia_fiduciaria_pct
        description: "Taxa percentual de execução/consolidação sobre contratos de alienação fiduciária (%)."
        tests:
          - not_null
      - name: indice_integracao_serp_saec_pct
        description: "Índice percentual de interoperabilidade eletrônica no SERP/SAEC/SREI (%)."
        tests:
          - not_null
      - name: proporcao_titulos_nato_digitais_extrato_pct
        description: "Percentual de títulos ingressados via extrato eletrônico nato-digital XML/JSON (%)."
        tests:
          - not_null
      - name: prazo_medio_qualificacao_registral_dias
        description: "Prazo médio em dias úteis para qualificação e prática do registro imobiliário."
        tests:
          - not_null
      - name: prazo_medio_certidao_eletronica_horas
        description: "Prazo médio em horas para expedição de certidão eletrônica de matrícula via SAEC/ONR."
        tests:
          - not_null
      - name: ordens_indisponibilidade_cnib_processadas_ano
        description: "Ordens anuais de indisponibilidade de bens via CNIB processadas eletronicamente."
        tests:
          - not_null
      - name: penhoras_online_arisp_srei_ano
        description: "Averbações anuais de penhora judicial recebidas via Penhora Online SREI."
        tests:
          - not_null
      - name: taxa_nota_devolutiva_exigencia_pct
        description: "Taxa percentual de títulos prenotados que geraram nota devolutiva de exigência (%)."
        tests:
          - not_null
      - name: score_maturidade_digital_srei_serp
        description: "Score normalizado (0 a 100) de maturidade digital registral SREI/SERP, CNM, títulos nato-digitais e SLA."
        tests:
          - not_null
      - name: score_liquidez_seguranca_imobiliaria
        description: "Score normalizado (0 a 100) de liquidez imobiliária, penetração de crédito SFI/SBPE e adimplência das garantias."
        tests:
          - not_null
      - name: classificacao_mercado_registral_imobiliario
        description: "Classificação analítica em 4 tiers de maturidade digital e liquidez do mercado registral imobiliário municipal."
        tests:
          - not_null
          - accepted_values:
              values:
                - "POLO_REGISTRAL_DIGITAL_ALTA_LIQUIDEZ_SERP"
                - "MERCADO_IMOBILIARIO_CONSOLIDADO_INTEGRADO_SREI"
                - "REDE_REGISTRAL_EM_TRANSICAO_ELETRONICA"
                - "TERRITORIO_PRIORITARIO_REGULARIZACAO_FUNDIARIA"
      - name: reference_date
        description: "Data de referência ISO-8601 da consolidação anual ONR/SREI."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

  - name: mart_mercado_imobiliario_iptu_itbi_capitais_brasil
    description: "Data Mart analítico dos Cadastros Imobiliários Municipais (IPTU/ITBI): liquidez de transações, preços por m², atualização PGV e governança cadastral CTM/SINTER."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos identificador único do município."
        tests:
          - not_null
          - unique
      - name: nome_municipio
        description: "Nome oficial da capital municipal."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da Unidade Federativa."
        tests:
          - not_null
      - name: nome_uf
        description: "Nome completo da Unidade Federativa."
        tests:
          - not_null
      - name: regiao
        description: "Grande região geográfica brasileira."
        tests:
          - not_null
      - name: ano_exercicio_fiscal
        description: "Ano de exercício fiscal de referência."
        tests:
          - not_null
      - name: inscricoes_imobiliarias_ativas_iptu
        description: "Total de inscrições imobiliárias ativas de IPTU no município."
        tests:
          - not_null
      - name: area_construida_tributada_mil_m2
        description: "Área construída tributada pelo IPTU (milhares de m²)."
        tests:
          - not_null
      - name: valor_venal_total_bilhoes_brl
        description: "Soma do valor venal cadastrado pela PGV (R$ bilhões)."
        tests:
          - not_null
      - name: valor_venal_medio_m2_brl
        description: "Valor venal médio por m² na Planta Genérica de Valores (R$/m²)."
        tests:
          - not_null
      - name: aliquota_media_efetiva_iptu_pct
        description: "Alíquota média efetiva do IPTU (%)."
        tests:
          - not_null
      - name: arrecadacao_iptu_milhoes_brl
        description: "Arrecadação anual realizada de IPTU (R$ milhões)."
        tests:
          - not_null
      - name: taxa_adimplencia_iptu_pct
        description: "Percentual de adimplência sobre o lançamento líquido de IPTU (%)."
        tests:
          - not_null
      - name: indice_atualizacao_pgv_pct
        description: "Grau de atualização da Planta Genérica de Valores (%)."
        tests:
          - not_null
      - name: total_transacoes_itbi_ano
        description: "Total consolidado anual de transações imobiliárias com ITBI quitado nos 4 segmentos."
        tests:
          - not_null
      - name: volume_total_itbi_milhoes_brl
        description: "Volume financeiro total transacionado no ITBI nos 4 segmentos (R$ milhões)."
        tests:
          - not_null
      - name: preco_medio_m2_itbi_declarado_brl
        description: "Preço médio por m² observado nas transações de ITBI (R$/m²)."
        tests:
          - not_null
      - name: variacao_anual_preco_m2_itbi_pct
        description: "Variação percentual anual do preço por m² declarado no ITBI (%)."
        tests:
          - not_null
      - name: razao_venal_pgv_sobre_mercado_itbi
        description: "Razão entre valor venal médio PGV e preço de mercado ITBI (0 a 1)."
        tests:
          - not_null
      - name: participacao_lancamentos_novos_pct
        description: "Participação de imóveis novos no total de transmissões ITBI (%)."
        tests:
          - not_null
      - name: concentracao_uso_residencial_pct
        description: "Participação de unidades residenciais no estoque total (%)."
        tests:
          - not_null
      - name: indice_liquidez_imobiliaria_itbi_pct
        description: "Taxa anual de giro do estoque imobiliário via ITBI (%)."
        tests:
          - not_null
      - name: taxa_vacancia_cadastral_estimada_pct
        description: "Proporção estimada de lotes vazios ou imóveis vagos no cadastro (%)."
        tests:
          - not_null
      - name: cobertura_cadastral_georreferenciada_ctm_pct
        description: "Cobertura georreferenciada do Cadastro Técnico Multifinalitário (%)."
        tests:
          - not_null
      - name: transacoes_itbi_emissao_digital_pct
        description: "Proporção de guias e certidões de ITBI processadas 100% digitalmente (%)."
        tests:
          - not_null
      - name: integracao_iptu_sinter_cno_onr_pct
        description: "Interoperabilidade cadastral entre Prefeitura, SINTER, CNO e ONR (%)."
        tests:
          - not_null
      - name: arrecadacao_itbi_milhoes_brl
        description: "Arrecadação realizada anual de ITBI (R$ milhões)."
        tests:
          - not_null
      - name: participacao_iptu_itbi_receita_propria_pct
        description: "Peso combinado de IPTU e ITBI na receita tributária própria municipal (%)."
        tests:
          - not_null
      - name: receita_imobiliaria_per_capita_brl
        description: "Arrecadação combinada IPTU+ITBI por habitante (R$/hab)."
        tests:
          - not_null
      - name: nivel_transparencia_dados_abertos_pgv
        description: "Maturidade da abertura de microdados geoespaciais de IPTU/ITBI."
        tests:
          - not_null
      - name: score_dinamismo_mercado_imobiliario_itbi
        description: "Score normalizado (0 a 100) de dinamismo de preços e liquidez imobiliária no ITBI."
        tests:
          - not_null
      - name: score_governanca_cadastral_fiscal_iptu
        description: "Score normalizado (0 a 100) de governança cadastral CTM/PGV e adimplência fiscal."
        tests:
          - not_null
      - name: classificacao_mercado_imobiliario_capital
        description: "Tier analítico em 4 faixas de liquidez imobiliária e governança cadastral da capital."
        tests:
          - not_null
          - accepted_values:
              values:
                - "METROPOLE_ALTA_LIQUIDEZ_E_GOVERNANCA_CTM"
                - "MERCADO_IMOBILIARIO_CONSOLIDADO_PGV_ATUALIZADA"
                - "MERCADO_URBANO_EM_EXPANSAO_CADASTRAL"
                - "CAPITAL_PRIORITARIA_MODERNIZACAO_CTM_PGV"
      - name: reference_date
        description: "Data de referência ISO-8601 do fechamento fiscal (YYYY-MM-DD)."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null
