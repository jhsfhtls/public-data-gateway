version: 2

models:
  - name: mart_litigiosidade_tribunais_brasil
    description: "Datamart analítico consolidando o volume de processos, passivo contingente e concentração de demandas por tribunal do Poder Judiciário Nacional."
    columns:
      - name: tribunal_sigla
        description: "Sigla oficial do tribunal judiciário competente."
        tests:
          - unique
          - not_null
      - name: tribunal_nome
        description: "Denominação institucional por extenso do tribunal."
        tests:
          - not_null
      - name: ramo_justica
        description: "Ramo da justiça brasileira (ESTADUAL, FEDERAL, TRABALHISTA, ELEITORAL, MILITAR, SUPERIOR)."
        tests:
          - not_null
      - name: esfera_uf
        description: "Sigla da UF da sede do tribunal."
        tests:
          - not_null
      - name: porte_tribunal
        description: "Classificação por volume de acervo processual (GRANDE_PORTE, MEDIO_PORTE, PEQUENO_PORTE)."
        tests:
          - not_null
      - name: total_processos_cadastrados
        description: "Total de processos judiciais cadastrados na base do tribunal."
        tests:
          - not_null
      - name: total_processos_ativos
        description: "Quantidade de processos judiciais em tramitação ativa no tribunal."
        tests:
          - not_null
      - name: total_execucoes_fiscais
        description: "Quantidade de execuções fiscais tributárias propostas perante o tribunal."
        tests:
          - not_null
      - name: total_acoes_trabalhistas
        description: "Quantidade de ações trabalhistas distribuídas no tribunal."
        tests:
          - not_null
      - name: total_recuperacoes_judiciais
        description: "Quantidade de processos de recuperação judicial ou falência no tribunal."
        tests:
          - not_null
      - name: valor_total_contingente
        description: "Soma consolidada do valor econômico contingente das causas em Reais (BRL)."
        tests:
          - not_null
      - name: valor_medio_causa
        description: "Ticket médio do valor atribuído à causa em Reais (BRL)."
        tests:
          - not_null
      - name: data_ultima_carga
        description: "Data e hora da carga mais recente de dados processuais do tribunal."

  - name: mart_compliance_trabalhista_brasil
    description: "Datamart analítico consolidando o status de CNDT, passivo trabalhista do BNDT e risco de inadimplência trabalhista para licitações e compliance corporativo."
    columns:
      - name: cnpj_ou_cpf
        description: "Documento (CNPJ ou CPF) da entidade ou pessoa consultada."
        tests:
          - not_null
      - name: razao_social_ou_nome
        description: "Nome empresarial ou civil cadastrado perante o Judiciário Trabalhista."
        tests:
          - not_null
      - name: tipo_documento
        description: "Tipo do documento (CNPJ ou CPF)."
        tests:
          - not_null
      - name: ultima_certidao_numero
        description: "Número oficial da certidão mais recente emitida pelo TST."
        tests:
          - not_null
      - name: situacao_cndt
        description: "Situação da CNDT: NEGATIVA, POSITIVA_COM_EFEITO_DE_NEGATIVA ou POSITIVA."
        tests:
          - not_null
      - name: is_regular_trabalhista
        description: "Indicador de regularidade perante a Justiça do Trabalho."
        tests:
          - not_null
      - name: is_habilitado_licitacao
        description: "Indicador se a empresa está autorizada a participar de licitações públicas conforme Leis 8.666/93 e 14.133/21."
        tests:
          - not_null
      - name: is_certidao_ativa_valida
        description: "Indica se a certidão está vigente (dentro de 180 dias) e com situação regular."
        tests:
          - not_null
      - name: data_expedicao
        description: "Data de emissão oficial da certidão."
        tests:
          - not_null
      - name: data_validade
        description: "Data limite de validade da certidão trabalhista."
        tests:
          - not_null
      - name: total_debitos_bndt
        description: "Quantidade total de processos e dívidas inscritas no BNDT."
        tests:
          - not_null
      - name: total_debitos_exigiveis
        description: "Quantidade de dívidas com exigibilidade ativa e sem garantia por penhora."
        tests:
          - not_null
      - name: valor_total_passivo_bndt
        description: "Montante financeiro total de dívidas trabalhistas inscritas no BNDT em Reais (BRL)."
        tests:
          - not_null
      - name: maior_debito_bndt
        description: "Maior valor individual de débito trabalhista identificado."
        tests:
          - not_null
      - name: qtd_trts_com_passivo
        description: "Quantidade de Tribunais Regionais do Trabalho com execuções ativas."
        tests:
          - not_null
      - name: labor_risk_score
        description: "Pontuação contínua de risco trabalhista de 0 a 100."
        tests:
          - not_null
      - name: classe_risco_trabalhista
        description: "Classificação categórica de risco trabalhista (BAIXO, MEDIO, ALTO)."
        tests:
          - not_null
      - name: mart_generated_at
        description: "Carimbo de data/hora da compilação do datamart analítico."
        tests:
          - not_null

  - name: mart_produtividade_serventias_extrajudiciais_brasil
    description: "Datamart analítico municipal consolidando eficiência operacional, digitalização SREI/ONR/e-Notariado, arrecadação de emolumentos e classificação do polo notarial/imobiliário (CNJ Justiça Aberta)."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município."
        tests:
          - not_null
          - unique
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla de 2 letras da UF."
        tests:
          - not_null
      - name: id_uf
        description: "Código IBGE de 2 dígitos da UF."
        tests:
          - not_null
      - name: nome_uf
        description: "Nome por extenso da Unidade Federativa."
        tests:
          - not_null
      - name: regiao
        description: "Macrorregião geográfica brasileira."
        tests:
          - not_null
      - name: semestre_referencia
        description: "Semestre de referência dos dados cartoriais CNJ."
        tests:
          - not_null
      - name: total_serventias_ativas
        description: "Quantidade total de serventias extrajudiciais ativas."
        tests:
          - not_null
      - name: serventias_providas_titular
        description: "Quantidade de serventias providas por delegatário concursado titular."
        tests:
          - not_null
      - name: serventias_vagas_interino
        description: "Quantidade de serventias vagas sob interinidade."
        tests:
          - not_null
      - name: taxa_provimento_titular_pct
        description: "Percentual de serventias providas por delegatário titular (%)."
        tests:
          - not_null
      - name: oficios_registro_imoveis
        description: "Quantidade de Ofícios de Registro de Imóveis no município."
        tests:
          - not_null
      - name: tabelionatos_notas_protesto
        description: "Quantidade de Tabelionatos de Notas e de Protesto no município."
        tests:
          - not_null
      - name: oficios_registro_civil_rcpn
        description: "Quantidade de Ofícios de Registro Civil das Pessoas Naturais (RCPN)."
        tests:
          - not_null
      - name: total_atos_praticados_semestre
        description: "Total de atos praticados no semestre em todas as atribuições."
        tests:
          - not_null
      - name: atos_registro_imoveis_semestre
        description: "Total de atos praticados especificamente em Registro de Imóveis no semestre."
        tests:
          - not_null
      - name: total_certidoes_expedidas_semestre
        description: "Total de certidões expedidas no semestre em todas as atribuições."
        tests:
          - not_null
      - name: proporcao_atos_eletronicos_media_pct
        description: "Proporção média de atos eletrônicos praticados entre as atribuições (%)."
        tests:
          - not_null
      - name: prazo_medio_emissao_global_dias
        description: "Prazo médio global de emissão de atos e certidões em dias úteis."
        tests:
          - not_null
      - name: arrecadacao_bruta_emolumentos_brl
        description: "Arrecadação bruta consolidada de emolumentos no município (BRL)."
        tests:
          - not_null
      - name: repasses_fundos_judiciario_funarpen_brl
        description: "Repasses estatutários a fundos do Judiciário e FUNARPEN (BRL)."
        tests:
          - not_null
      - name: custeio_operacional_serventias_brl
        description: "Custeio operacional reportado pelas serventias (BRL)."
        tests:
          - not_null
      - name: arrecadacao_media_por_serventia_brl
        description: "Arrecadação média semestral por serventia ativa (BRL)."
        tests:
          - not_null
      - name: ticket_medio_emolumento_por_ato_brl
        description: "Ticket médio de emolumento por ato praticado (BRL)."
        tests:
          - not_null
      - name: taxa_repasse_institucional_pct
        description: "Percentual médio da arrecadação destinado a fundos institucionais (%)."
        tests:
          - not_null
      - name: atos_gratuitos_ressarcidos_rcpn
        description: "Total de atos gratuitos de Registro Civil ressarcidos no semestre."
        tests:
          - not_null
      - name: acervo_historico_digitalizado_pct
        description: "Percentual de acervo histórico digitalizado (%)."
        tests:
          - not_null
      - name: serventias_integradas_srei_onr_crc_pct
        description: "Percentual de integração eletrônica ao SREI/ONR/CRC (%)."
        tests:
          - not_null
      - name: indice_transparencia_prestacao_contas_cnj_pct
        description: "Índice de transparência e tempestividade junto ao CNJ (%)."
        tests:
          - not_null
      - name: inspecoes_corregedoria_em_dia_pct
        description: "Percentual de serventias com inspeções ordinárias em dia (%)."
        tests:
          - not_null
      - name: reclamacoes_disciplinares_por_100k_atos
        description: "Taxa de representações disciplinares por 100 mil atos."
        tests:
          - not_null
      - name: forca_trabalho_prepostos_escreventes
        description: "Efetivo total de escreventes, auxiliares e prepostos contratados."
        tests:
          - not_null
      - name: atos_por_escrevente_semestre
        description: "Produtividade média semestral de atos por escrevente/preposto."
        tests:
          - not_null
      - name: score_eficiencia_modernizacao_cartorial
        description: "Score normalizado (0-100) de eficiência operacional e modernização digital cartorial."
        tests:
          - not_null
      - name: score_dinamismo_notarial_imobiliario
        description: "Score normalizado (0-100) de dinamismo econômico notarial e imobiliário."
        tests:
          - not_null
      - name: classificacao_polo_notarial_cartorial
        description: "Tier analítico de eficiência do ecossistema cartorial municipal."
        tests:
          - not_null
      - name: reference_date
        description: "Data de referência ISO-8601 dos indicadores."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp ISO-8601 UTC da extração."
        tests:
          - not_null

