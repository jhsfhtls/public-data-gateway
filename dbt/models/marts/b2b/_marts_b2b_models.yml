version: 2

models:
  - name: mart_densidade_empresarial_brasil
    description: "Mart analítico agregando indicadores de densidade empresarial, atividade operacional, enquadramento Simples/MEI e capital social por Unidade Federativa."
    columns:
      - name: sigla_uf
        description: "Sigla de 2 letras maiúsculas da Unidade Federativa (chave primária analítica)."
        tests:
          - unique
          - not_null
      - name: total_estabelecimentos
        description: "Contagem total de estabelecimentos comerciais, industriais e de serviços sediados na UF."
        tests:
          - not_null
      - name: total_estabelecimentos_ativos
        description: "Quantidade de estabelecimentos com situação cadastral estritamente ativa perante o Fisco federal."
        tests:
          - not_null
      - name: total_matrizes
        description: "Quantidade de sedes / matrizes empresariais estabelecidas na UF."
        tests:
          - not_null
      - name: total_filiais
        description: "Quantidade de unidades filiais ou operacionais localizadas na UF."
        tests:
          - not_null
      - name: total_empresas_distintas
        description: "Quantidade de grupos ou pessoas jurídicas distintas (CNPJ básico único) na UF."
        tests:
          - not_null
      - name: total_optantes_simples
        description: "Quantidade de empresas da UF enquadradas no regime especial do Simples Nacional."
        tests:
          - not_null
      - name: total_enquadrados_mei
        description: "Quantidade de microempreendedores individuais (MEI) sediados na UF."
        tests:
          - not_null
      - name: capital_social_total_uf
        description: "Somatório do capital social registrado de todas as empresas da UF em Reais (BRL)."
        tests:
          - not_null
      - name: capital_social_medio_uf
        description: "Média aritmética do capital social registrado por empresa na UF em Reais (BRL)."
        tests:
          - not_null
      - name: taxa_estabelecimentos_ativos_pct
        description: "Percentual de estabelecimentos com situação cadastral ativa em relação ao total da UF (0 a 100%)."
        tests:
          - not_null
      - name: taxa_optantes_simples_pct
        description: "Percentual de estabelecimentos pertencentes a optantes pelo Simples Nacional na UF (0 a 100%)."
        tests:
          - not_null
      - name: data_processamento
        description: "Data em que o mart analítico foi compilado e materializado (YYYY-MM-DD)."
        tests:
          - not_null

  - name: mart_regimes_tributarios_brasil
    description: "Mart analítico tributário agregando dados de opção pelo Simples Nacional, SIMEI, sublimites fiscais e taxas de adesão por UF."
    columns:
      - name: sigla_uf
        description: "Sigla de 2 letras maiúsculas da Unidade Federativa (chave primária analítica)."
        tests:
          - unique
          - not_null
      - name: total_empresas_cadastradas
        description: "Quantidade total de empresas registradas na UF analisada."
        tests:
          - not_null
      - name: total_optantes_simples_ativos
        description: "Quantidade de empresas com opção ativa pelo Simples Nacional na UF."
        tests:
          - not_null
      - name: total_meis_enquadrados_ativos
        description: "Quantidade de microempreendedores individuais ativamente enquadrados no SIMEI na UF."
        tests:
          - not_null
      - name: total_historico_excluidos_simples
        description: "Quantidade de empresas com registro histórico de exclusão do Simples Nacional na UF."
        tests:
          - not_null
      - name: total_historico_desenquadrados_mei
        description: "Quantidade de empresas com registro histórico de desenquadramento do SIMEI na UF."
        tests:
          - not_null
      - name: taxa_adesao_simples_pct
        description: "Percentual de empresas da UF que são optantes ativas pelo Simples Nacional (0 a 100%)."
        tests:
          - not_null
      - name: taxa_mei_sobre_simples_pct
        description: "Percentual de MEIs em relação ao total de optantes pelo Simples Nacional na UF (0 a 100%)."
        tests:
          - not_null
      - name: sublimite_icms_vigente_reais
        description: "Valor do sublimite estadual de ICMS/ISS vigente para o ano-calendário em Reais."
        tests:
          - not_null
      - name: categoria_sublimite_estadual
        description: "Classificação da política fiscal do estado quanto ao sublimite (SUBLIMITE_REDUZIDO_3_6M ou TETO_NACIONAL_4_8M)."
        tests:
          - not_null
      - name: data_processamento
        description: "Data em que o mart tributário foi compilado e materializado (YYYY-MM-DD)."
        tests:
          - not_null

  - name: mart_incentivos_fiscais_pim_brasil
    description: "Mart analítico integrando empresas, projetos do CAS, benefícios tributários e capacidade fabril do Polo Industrial de Manaus e ALCs."
    columns:
      - name: cnpj_14
        description: "CNPJ de 14 dígitos da empresa incentivada."
        tests:
          - not_null
      - name: numero_inscricao_suframa
        description: "Número oficial de Inscrição SUFRAMA da empresa."
        tests:
          - not_null
      - name: razao_social
        description: "Razão social cadastrada perante a SUFRAMA."
        tests:
          - not_null
      - name: nome_fantasia
        description: "Nome comercial ou de fantasia da planta."
      - name: situacao_cadastral
        description: "Situação cadastral na SUFRAMA (ATIVA, CANCELADA, BLOQUEADA, SUSPENSA)."
        tests:
          - not_null
      - name: is_cadastro_regular_vigente
        description: "Indicador de cadastro ativo e dentro do prazo de validade."
        tests:
          - not_null
      - name: tipo_area_incentivada
        description: "Enquadramento fiscal (ZONA_FRANCA_MANAUS, AMAZONIA_OCIDENTAL, AREA_LIVRE_COMERCIO)."
        tests:
          - not_null
      - name: codigo_area_suframa
        description: "Código da área incentivada (ZFM, ALC_TABATINGA, etc.)."
        tests:
          - not_null
      - name: id_municipio_ibge
        description: "Código IBGE do município da planta fabril."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla da UF da planta produtiva."
        tests:
          - not_null
      - name: subsetor_industrial
        description: "Subsetor industrial classificado pela SUFRAMA."
        tests:
          - not_null
      - name: nome_subsetor
        description: "Descrição por extenso do polo de produção."
        tests:
          - not_null
      - name: relevancia_pim
        description: "Relevância econômica do polo no Polo Industrial de Manaus."
        tests:
          - not_null
      - name: total_projetos_cas
        description: "Quantidade de projetos industriais aprovados pelo CAS."
        tests:
          - not_null
      - name: total_projetos_em_operacao
        description: "Quantidade de projetos com linhas fabris ativas em operação."
        tests:
          - not_null
      - name: faturamento_anual_incentivado
        description: "Faturamento anual total aprovado e incentivado em Reais (BRL)."
        tests:
          - not_null
      - name: total_empregos_diretos_gerados
        description: "Quantidade de postos de trabalho diretos gerados."
        tests:
          - not_null
      - name: cumpre_processo_produtivo_basico
        description: "Indicador de cumprimento das etapas fabris de PPB."
        tests:
          - not_null
      - name: has_isencao_ipi
        description: "Indicador de fruição de isenção de IPI."
        tests:
          - not_null
      - name: has_reducao_ii
        description: "Indicador de redução tarifária de até 88% no Imposto de Importação."
        tests:
          - not_null
      - name: has_credito_presumido_icms
        description: "Indicador de fruição de crédito estímulo estadual de ICMS."
        tests:
          - not_null
      - name: has_desoneracao_pis_cofins
        description: "Indicador de alíquota zero de PIS/COFINS em insumos."
        tests:
          - not_null
      - name: capacidade_fabril_estimada
        description: "Porte da capacidade produtiva (GRANDE_PORTE, MEDIO_PORTE, PEQUENO_PORTE, INEXISTENTE)."
        tests:
          - not_null
      - name: tax_incentive_score
        description: "Pontuação de 0 a 100 de densidade de incentivos fiscais da empresa."
        tests:
          - not_null
      - name: mart_generated_at
        description: "Timestamp de compilação do mart analítico."
        tests:
          - not_null

  - name: mart_obras_construcao_civil_cno_brasil
    description: "Datamart executivo intra-domínio do Cadastro Nacional de Obras (RFB CNO) consolidando estoque de obras, área construída m² por destinação e dinamismo imobiliário/CAPEX municipal."
    columns:
      - name: id_municipio
        description: "Código IBGE canônico de 7 dígitos do município."
        tests:
          - not_null
          - unique
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa."
        tests:
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município."
        tests:
          - not_null
      - name: total_obras_cno
        description: "Quantidade total de obras cadastradas no CNO municipal."
        tests:
          - not_null
      - name: obras_ativas_em_andamento
        description: "Quantidade de obras civis ativas em andamento no município."
        tests:
          - not_null
      - name: obras_paralisadas_suspensas
        description: "Quantidade de obras paralisadas ou suspensas."
        tests:
          - not_null
      - name: obras_encerradas_habitese
        description: "Quantidade de obras concluídas e encerradas no CNO."
        tests:
          - not_null
      - name: area_total_registrada_m2
        description: "Área total registrada no cadastro municipal CNO em m²."
        tests:
          - not_null
      - name: area_residencial_m2
        description: "Área averbada destinada a edificações residenciais em m²."
        tests:
          - not_null
      - name: area_comercial_industrial_m2
        description: "Área averbada destinada a galpões, indústrias e empreendimentos comerciais em m²."
        tests:
          - not_null
      - name: area_infraestrutura_publica_m2
        description: "Área averbada em obras de infraestrutura pública no município em m²."
        tests:
          - not_null
      - name: area_total_construida_m2
        description: "Área total construída consolidada nas destinações CNO em m²."
        tests:
          - not_null
      - name: percentual_obras_ativas_pct
        description: "Taxa percentual de obras atualmente ativas no estoque municipal (%)."
        tests:
          - not_null
      - name: qtd_obras_amostra_cadastral
        description: "Quantidade de obras detalhadas na amostra cadastral analítica."
        tests:
          - not_null
      - name: area_media_obra_amostra_m2
        description: "Área média por obra na amostra cadastral em m²."
        tests:
          - not_null
      - name: qtd_responsaveis_amostra
        description: "Quantidade de construtoras ou responsáveis distintos na amostra municipal."
        tests:
          - not_null
      - name: score_dinamismo_construcao_cno
        description: "Score composto de dinamismo da construção civil e pipeline CAPEX físico (10 a 99)."
        tests:
          - not_null
      - name: classificacao_expansao_imobiliaria_cno
        description: "Tier executivo de expansão construtiva municipal (POLO_EXPANSAO_CONSTRUTIVA_ALTA, DINAMISMO_CONSTRUTIVO_MODERADO, BAIXA_ATIVIDADE_CNO)."
        tests:
          - not_null

  - name: mart_inpi_propriedade_intelectual_brasil
    description: "Data Mart Gold intra-domínio consolidando depósitos de patentes INPI/RPI, registros de marcas, desenhos industriais, programas de computador e score de inovação tecnológica municipal."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município (STRING)."
        tests: [not_null, unique]
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa (UF)."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: regiao
        description: "Macrorregião geográfica brasileira."
        tests: [not_null]
      - name: patentes_depositadas_12m
        description: "Quantidade anual de pedidos de patentes depositados no INPI no município."
        tests: [not_null]
      - name: marcas_concedidas_12m
        description: "Total de registros ativos de marcas concedidas vinculados ao município."
        tests: [not_null]
      - name: registros_software_total
        description: "Quantidade total de programas de computador registrados junto ao INPI."
        tests: [not_null]
      - name: contratos_tecnologia_ativos
        description: "Quantidade de contratos ativos de transferência de tecnologia averbados no INPI."
        tests: [not_null]
      - name: patentes_por_100k_hab
        description: "Densidade anual de depósitos de patentes por 100 mil habitantes."
        tests: [not_null]
      - name: qtd_naturezas_pi_rpi
        description: "Quantidade de naturezas de propriedade industrial consolidadas na camada Silver RPI."
        tests: [not_null]
      - name: concessoes_patentes_software_12m
        description: "Soma anual de concessões de patentes e registros de software publicados."
        tests: [not_null]
      - name: desenhos_industriais_vigentes
        description: "Total de desenhos industriais vigentes vinculados ao município."
        tests: [not_null]
      - name: taxa_concessao_marcas_pct
        description: "Percentual de deferimento nos pedidos de registro de marcas INPI (%)."
        tests: [not_null]
      - name: participacao_saas_tech_pct
        description: "Participação percentual de registros de marcas nas classes de tecnologia Nice (%)."
        tests: [not_null]
      - name: ict_universidades_depositantes
        description: "Quantidade de universidades e ICTs depositantes ativos no INPI."
        tests: [not_null]
      - name: indicacoes_geograficas_locais
        description: "Quantidade de Indicações Geográficas (IG) reconhecidas no território."
        tests: [not_null]
      - name: score_inovacao_propriedade_intelectual
        description: "Score sintético municipal de intensidade de propriedade intelectual e inovação tecnológica INPI (0-100)."
        tests: [not_null]
      - name: tier_inovacao_tecnologica_inpi
        description: "Classificação municipal INPI (POLO_DEEP_TECH_INOVACAO_INPI, ECOSSISTEMA_PI_CONSOLIDADO ou INOVACAO_TECNOLOGICA_EMERGENTE)."
        tests: [not_null]


