version: 2

models:
  - name: mart_compliance_sancoes_brasil
    description: "Datamart analítico consolidado de conformidade, sanções administrativas, inidoneidades e penalidades da Lei Anticorrupção no Brasil."
    columns:
      - name: sigla_uf_orgao
        description: "Sigla da Unidade da Federação do órgão ou autoridade sancionadora (ou ND para não determinado)."
        tests:
          - not_null
      - name: esfera_orgao
        description: "Esfera de governo responsável pela punição (F = Federal, E = Estadual, M = Municipal, ND = Não determinado)."
        tests:
          - not_null
      - name: poder_orgao
        description: "Poder institucional ao qual a autoridade pertence (E = Executivo, L = Legislativo, J = Judiciário, ND = Não determinado)."
        tests:
          - not_null
      - name: cadastro_origem
        description: "Cadastro ou base de dados de origem da sanção (CEIS, CNEP ou CEPIM)."
        tests:
          - not_null
      - name: id_tipo_sancao
        description: "Código do tipo normativo da sanção administrativa."
        tests:
          - not_null
      - name: nivel_gravidade
        description: "Classificação padronizada de severidade da penalidade (GRAVISSIMA, GRAVE, MEDIA)."
        tests:
          - not_null
      - name: ano_sancao
        description: "Ano civil de início de vigência da sanção administrativa."
        tests:
          - not_null
      - name: total_sancoes
        description: "Contagem consolidada de sanções aplicadas para a agregação dimensional."
        tests:
          - not_null
      - name: total_sancoes_ativas
        description: "Quantidade de sanções vigentes e com efeitos restritivos ativos no momento da apuração."
        tests:
          - not_null
      - name: total_entidades_sancionadas
        description: "Contagem de pessoas físicas e jurídicas distintas sancionadas."
        tests:
          - not_null
      - name: total_pj_sancionadas
        description: "Quantidade de empresas e pessoas jurídicas sancionadas."
        tests:
          - not_null
      - name: total_pf_sancionadas
        description: "Quantidade de pessoas físicas sancionadas."
        tests:
          - not_null
      - name: valor_total_multas_aplicadas
        description: "Soma monetária acumulada das multas pecuniárias anticorrupção cominadas em Reais (BRL)."
        tests:
          - not_null
      - name: valor_multas_ativas
        description: "Montante financeiro de multas vinculadas a processos sancionadores atualmente ativos."
        tests:
          - not_null
      - name: valor_medio_multa
        description: "Valor médio das multas pecuniárias aplicadas no estrato de agregação."
        tests:
          - not_null

  - name: mart_pep_distribuicao_brasil
    description: "Datamart analítico de distribuição e exposição política de Pessoas Expostas Politicamente (PEP) no Brasil."
    columns:
      - name: sigla_uf_orgao
        description: "Unidade da Federação de lotação do órgão público da autoridade PEP."
        tests:
          - not_null
      - name: nome_orgao
        description: "Órgão, ministério, tribunal ou entidade pública de exercício da função."
        tests:
          - not_null
      - name: sigla_funcao
        description: "Sigla cadastral do cargo ou mandato público exercido."
        tests:
          - not_null
      - name: descricao_funcao
        description: "Denominação oficial por extenso da função pública."
        tests:
          - not_null
      - name: categoria_exposicao
        description: "Classificação institucional da exposição política do cargo perante o COAF."
        tests:
          - not_null
      - name: grau_risco_pld
        description: "Grau de risco regulatório para fins de Prevenção à Lavagem de Dinheiro (CRITICO, ALTO, MODERADO)."
        tests:
          - not_null
      - name: is_pep_ativo
        description: "Indicador se as autoridades no estrato estão ativas ou sob carência regulatória."
        tests:
          - not_null
      - name: total_mandatos_registrados
        description: "Contagem total de registros de mandatos e tenures no estrato de agregação."
        tests:
          - not_null
      - name: total_titulares_pep
        description: "Quantidade distinta de titulares individuais de cargos PEP."
        tests:
          - not_null
      - name: total_titulares_pep_ativos
        description: "Quantidade distinta de titulares com mandato ou carência regulatória ativa."
        tests:
          - not_null

  - name: mart_divida_ativa_pgfn_brasil
    description: "Datamart intra-domínio de compliance fiscal consolidando créditos inscritos em Dívida Ativa da União (Geral, Previdenciária e FGTS), taxa de ajuizamento judicial e risco de inadimplência PGFN por município."
    columns:
      - name: id_municipio
        description: "Código IBGE canônico de 7 dígitos do município"
        tests:
          - not_null
          - unique
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade da Federação"
        tests:
          - not_null
      - name: nome_municipio
        description: "Nome oficial do município"
        tests:
          - not_null
      - name: ano_trimestre_ref
        description: "Competência trimestral de referência da base aberta PGFN"
        tests:
          - not_null
      - name: total_inscricoes_ativas
        description: "Quantidade consolidada de inscrições ativas em DAU e FGTS"
        tests:
          - not_null
      - name: total_devedores_pj
        description: "Total de pessoas jurídicas devedoras no estrato municipal"
        tests:
          - not_null
      - name: valor_total_geral_brl
        description: "Estoque financeiro de débitos gerais não-previdenciários em BRL"
        tests:
          - not_null
      - name: valor_total_previdenciario_brl
        description: "Estoque financeiro de débitos previdenciários INSS/RFB em BRL"
        tests:
          - not_null
      - name: valor_total_fgts_brl
        description: "Estoque financeiro de débitos de FGTS em BRL"
        tests:
          - not_null
      - name: valor_total_consolidado_brl
        description: "Estoque total consolidado inscrito em Dívida Ativa no município em BRL"
        tests:
          - not_null
      - name: taxa_ajuizamento_pct
        description: "Percentual de créditos sob execução fiscal judicial ajuizada (%)"
        tests:
          - not_null
      - name: score_risco_inadimplencia_fiscal
        description: "Score contínuo de exposição e risco de inadimplência fiscal perante a PGFN (10 a 99)"
        tests:
          - not_null
      - name: classificacao_risco_pgfn
        description: "Classificação qualitativa de risco fiscal PGFN (ALTO_RISCO_EXPOSICAO_PGFN, RISCO_MODERADO_PGFN, BAIXO_RISCO_PGFN)"
        tests:
          - not_null

  - name: mart_seguranca_publica_sinesp_brasil
    description: "Data Mart Gold intra-domínio consolidando ocorrências criminais SINESP-VDE, Mortes Violentas Intencionais (MVI/FBSP), roubo de cargas e efetivo policial."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município (STRING)."
        tests: [not_null, unique]
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa (UF)."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: regiao
        description: "Macrorregião geográfica do município."
        tests: [not_null]
      - name: taxa_mvi_por_100k_hab
        description: "Taxa de Mortes Violentas Intencionais por 100 mil habitantes (SINESP/FBSP)."
        tests: [not_null]
      - name: taxa_roubo_carga_100k_hab
        description: "Taxa municipal de roubo de carga logística por 100 mil habitantes."
        tests: [not_null]
      - name: taxa_furto_roubo_veiculo_100k_hab
        description: "Taxa de roubo e furto de veículos por 100 mil habitantes."
        tests: [not_null]
      - name: taxa_estelionato_100k_hab
        description: "Taxa de estelionato e fraudes registradas por 100 mil habitantes."
        tests: [not_null]
      - name: investimento_seguranca_per_capita_brl
        description: "Investimento anual per capita em segurança pública (BRL/hab)."
        tests: [not_null]
      - name: total_vitimas_mvi
        description: "Contagem absoluta de vítimas de Mortes Violentas Intencionais no município."
        tests: [not_null]
      - name: taxa_elucidacao_inqueritos_pct
        description: "Percentual de elucidação de inquéritos de homicídio e MVI (%)."
        tests: [not_null]
      - name: qtd_delegacias_unidades
        description: "Quantidade de delegacias e unidades policiais ativas."
        tests: [not_null]
      - name: possui_guarda_municipal_ativa
        description: "Existência de Guarda Civil Municipal estruturada no município."
        tests: [not_null]
      - name: efetivo_seguranca_100k_hab
        description: "Efetivo de forças de segurança por 100 mil habitantes."
        tests: [not_null]
      - name: qtd_tipos_crime_amostra
        description: "Quantidade de tipificações criminais presentes na amostra SINESP."
        tests: [not_null]
      - name: qtd_ocorrencias_amostra_sinesp
        description: "Soma de ocorrências criminais registradas na amostra SINESP-VDE."
        tests: [not_null]
      - name: score_seguranca_publica_sinesp
        description: "Score sintético municipal de segurança pública e baixa exposição patrimonial/MVI (0-100)."
        tests: [not_null]
      - name: tier_risco_seguranca_territorial
        description: "Tier municipal de segurança (ALTA_SEGURANCA_TERRITORIAL, RISCO_SEGURANCA_MODERADO ou ZONA_CRITICA_SEGURANCA_PATRIMONIAL)."
        tests: [not_null]

  - name: mart_transparencia_gastos_cgu_brasil
    description: "Data Mart Gold intra-domínio consolidando gastos diretos federais, transferências constitucionais FPM/SUS, emendas, convênios e score de integridade CGU."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município (STRING)."
        tests: [not_null, unique]
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa (UF)."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: regiao
        description: "Macrorregião geográfica brasileira."
        tests: [not_null]
      - name: total_gastos_federais_mil_brl
        description: "Total consolidado de recursos federais executados e transferidos ao município (R$ mil)."
        tests: [not_null]
      - name: total_transferencias_mil_brl
        description: "Total anual de transferências federais constitucionais e legais (R$ mil)."
        tests: [not_null]
      - name: taxa_execucao_orcamentaria_pct
        description: "Percentual efetivamente pago em relação ao orçamento empenhado (%)."
        tests: [not_null]
      - name: gasto_federal_per_capita_brl
        description: "Gasto público federal equivalente por habitante no município (BRL)."
        tests: [not_null]
      - name: qtd_modalidades_despesa_cgu
        description: "Quantidade de modalidades de despesa agregadas na camada Silver CGU."
        tests: [not_null]
      - name: total_empenhado_cgu_mil_brl
        description: "Valor total empenhado nas modalidades federais do município (R$ mil)."
        tests: [not_null]
      - name: repasse_fpm_fundeb_mil_brl
        description: "Montante anual recebido via FPM e FUNDEB (R$ mil)."
        tests: [not_null]
      - name: repasse_sus_assistencia_mil_brl
        description: "Montante anual recebido via repasses SUS e Assistência Social (R$ mil)."
        tests: [not_null]
      - name: dependencia_repasses_federais_pct
        description: "Grau percentual de dependência das receitas municipais em relação à União (%)."
        tests: [not_null]
      - name: qtd_convenios_ativos
        description: "Total de convênios federais ativos no município."
        tests: [not_null]
      - name: emendas_parlamentares_pagas_mil_brl
        description: "Volume pago anual de emendas parlamentares federais no município (R$ mil)."
        tests: [not_null]
      - name: adimplencia_prestacao_contas_pct
        description: "Percentual de regularidade na prestação de contas de convênios junto à União (%)."
        tests: [not_null]
      - name: uso_cpgf_cartao_mil_brl
        description: "Despesas realizadas via Cartão de Pagamento do Governo Federal no município (R$ mil)."
        tests: [not_null]
      - name: score_integridade_execucao_cgu
        description: "Score sintético municipal de eficiência de execução e integridade na prestação de contas CGU (0-100)."
        tests: [not_null]
      - name: tier_transparencia_gastos_cgu
        description: "Classificação municipal (EXCELENCIA_TRANSPARENCIA_EXECUCAO, EXECUCAO_REGULAR_MONITORADA ou ALERTA_CONCENTRACAO_CONVENIOS)."
        tests: [not_null]

  - name: mart_servidores_federais_siape_brasil
    description: "Data Mart Gold intra-domínio consolidando efetivo federal SIAPE, folha salarial mensal, DAS/FCE e integridade funcional CGU."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município (STRING)."
        tests: [not_null, unique]
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa (UF)."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: regiao
        description: "Macrorregião geográfica brasileira."
        tests: [not_null]
      - name: total_servidores_federais_siape
        description: "Contingente total de servidores públicos federais lotados no município."
        tests: [not_null]
      - name: folha_mensal_bruta_siape_mil_brl
        description: "Massa salarial bruta mensal do funcionalismo federal no município (R$ mil)."
        tests: [not_null]
      - name: remuneracao_media_bruta_brl
        description: "Remuneração bruta média mensal dos servidores federais no município (BRL)."
        tests: [not_null]
      - name: pct_cargos_comissionados_das
        description: "Participação percentual de funções comissionadas DAS/FCE sobre os vínculos (%)."
        tests: [not_null]
      - name: qtd_regimes_lotacao_siape
        description: "Quantidade de agrupamentos jurídicos SIAPE consolidados na Silver."
        tests: [not_null]
      - name: remuneracao_teto_pct
        description: "Percentual de servidores com vencimentos no teto constitucional (%)."
        tests: [not_null]
      - name: adicional_funcao_das_fce_mil_brl
        description: "Folha mensal de funções de confiança e assessoramento DAS/FCE (R$ mil)."
        tests: [not_null]
      - name: servidores_dedicacao_exclusiva_pct
        description: "Percentual de servidores sob regime regular de dedicação exclusiva (%)."
        tests: [not_null]
      - name: alertas_acumulo_ilicito
        description: "Alertas de possível acúmulo irregular de cargos públicos sob verificação CGU."
        tests: [not_null]
      - name: servidores_cedidos_count
        description: "Total de servidores federais cedidos ou requisitados."
        tests: [not_null]
      - name: indice_integridade_siape_pct
        description: "Índice composto de conformidade e regularidade SIAPE/CGU (%)."
        tests: [not_null]
      - name: score_integridade_funcional_siape
        description: "Score sintético municipal de governança de pessoal e integridade funcional SIAPE (0-100)."
        tests: [not_null]
      - name: tier_governanca_pessoal_siape
        description: "Classificação municipal SIAPE (ALTA_GOVERNANCA_FUNCIONAL_SIAPE, QUADRO_FEDERAL_CONSOLIDADO ou ALERTA_CONCENTRACAO_COMISSIONADOS)."
        tests: [not_null]

  - name: mart_eleicoes_tse_brasil
    description: "Data Mart Gold intra-domínio consolidando eleitorado apto, comparecimento, pluralismo partidário, prestação de contas e score de integridade eleitoral TSE."
    columns:
      - name: id_municipio
        description: "Código IBGE de 7 dígitos do município (STRING)."
        tests: [not_null, unique]
      - name: sigla_uf
        description: "Sigla de 2 letras da Unidade Federativa (UF)."
        tests: [not_null]
      - name: nome_municipio
        description: "Nome oficial do município."
        tests: [not_null]
      - name: regiao
        description: "Macrorregião geográfica brasileira."
        tests: [not_null]
      - name: eleitorado_apto_total
        description: "Eleitorado total apto cadastrado no TSE no município."
        tests: [not_null]
      - name: total_candidaturas_aptas
        description: "Total de candidaturas aptas na eleição municipal."
        tests: [not_null]
      - name: comparecimento_pct
        description: "Taxa de comparecimento eleitoral no município (%)."
        tests: [not_null]
      - name: receita_total_campanha_mil_brl
        description: "Receita agregada declarada nas campanhas municipais (R$ mil)."
        tests: [not_null]
      - name: custo_por_eleitor_brl
        description: "Receita média de campanha dividida pelo eleitorado apto (BRL)."
        tests: [not_null]
      - name: qtd_cargos_apurados_tse
        description: "Quantidade de cargos apurados na camada Silver TSE."
        tests: [not_null]
      - name: max_partidos_competitivos
        description: "Maior número de legendas ou federações competitivas no município."
        tests: [not_null]
      - name: competicao_eleitoral_media_pct
        description: "Média do índice percentual de pluralismo partidário municipal (%)."
        tests: [not_null]
      - name: abstencao_pct
        description: "Taxa percentual de abstenção eleitoral (%)."
        tests: [not_null]
      - name: votos_validos_pct
        description: "Percentual de votos válidos sobre o comparecimento total (%)."
        tests: [not_null]
      - name: ano_eleicao
        description: "Ano do pleito municipal de referência."
        tests: [not_null]
      - name: despesa_contratada_mil_brl
        description: "Despesa total contratada em campanhas eleitorais no município (R$ mil)."
        tests: [not_null]
      - name: contas_aprovadas_pct
        description: "Percentual de prestações de contas julgadas aprovadas pelo TSE (%)."
        tests: [not_null]
      - name: doadores_cpf_cnpj_distintos
        description: "Quantidade de CPF/CNPJ distintos registrados como financiadores de campanha."
        tests: [not_null]
      - name: score_integridade_eleitoral_tse
        description: "Score sintético municipal de maturidade eleitoral, comparecimento e regularidade de contas TSE (0-100)."
        tests: [not_null]
      - name: tier_maturidade_eleitoral_tse
        description: "Classificação municipal TSE (ALTA_MATURIDADE_ELEITORAL, PARTICIPACAO_ELEITORAL_REGULAR ou ALERTA_ABSTENCAO_CONCENTRACAO)."
        tests: [not_null]
