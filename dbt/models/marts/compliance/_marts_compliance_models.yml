version: 2

models:
  - name: mart_compliance_sancoes_brasil
    description: "Datamart analítico consolidado de conformidade, sanções administrativas, inidoneidades e penalidades da Lei Anticorrupção no Brasil."
    columns:
      - name: sigla_uf_orgao
        description: "Sigla da Unidade da Federação do órgão ou autoridade sancionadora (ou ND para não determinado)."
        tests:
          - not_null
      - name: esfera_orgao
        description: "Esfera de governo responsável pela punição (F = Federal, E = Estadual, M = Municipal, ND = Não determinado)."
        tests:
          - not_null
      - name: poder_orgao
        description: "Poder institucional ao qual a autoridade pertence (E = Executivo, L = Legislativo, J = Judiciário, ND = Não determinado)."
        tests:
          - not_null
      - name: cadastro_origem
        description: "Cadastro ou base de dados de origem da sanção (CEIS, CNEP ou CEPIM)."
        tests:
          - not_null
      - name: id_tipo_sancao
        description: "Código do tipo normativo da sanção administrativa."
        tests:
          - not_null
      - name: nivel_gravidade
        description: "Classificação padronizada de severidade da penalidade (GRAVISSIMA, GRAVE, MEDIA)."
        tests:
          - not_null
      - name: ano_sancao
        description: "Ano civil de início de vigência da sanção administrativa."
        tests:
          - not_null
      - name: total_sancoes
        description: "Contagem consolidada de sanções aplicadas para a agregação dimensional."
        tests:
          - not_null
      - name: total_sancoes_ativas
        description: "Quantidade de sanções vigentes e com efeitos restritivos ativos no momento da apuração."
        tests:
          - not_null
      - name: total_entidades_sancionadas
        description: "Contagem de pessoas físicas e jurídicas distintas sancionadas."
        tests:
          - not_null
      - name: total_pj_sancionadas
        description: "Quantidade de empresas e pessoas jurídicas sancionadas."
        tests:
          - not_null
      - name: total_pf_sancionadas
        description: "Quantidade de pessoas físicas sancionadas."
        tests:
          - not_null
      - name: valor_total_multas_aplicadas
        description: "Soma monetária acumulada das multas pecuniárias anticorrupção cominadas em Reais (BRL)."
        tests:
          - not_null
      - name: valor_multas_ativas
        description: "Montante financeiro de multas vinculadas a processos sancionadores atualmente ativos."
        tests:
          - not_null
      - name: valor_medio_multa
        description: "Valor médio das multas pecuniárias aplicadas no estrato de agregação."
        tests:
          - not_null

  - name: mart_pep_distribuicao_brasil
    description: "Datamart analítico de distribuição e exposição política de Pessoas Expostas Politicamente (PEP) no Brasil."
    columns:
      - name: sigla_uf_orgao
        description: "Unidade da Federação de lotação do órgão público da autoridade PEP."
        tests:
          - not_null
      - name: nome_orgao
        description: "Órgão, ministério, tribunal ou entidade pública de exercício da função."
        tests:
          - not_null
      - name: sigla_funcao
        description: "Sigla cadastral do cargo ou mandato público exercido."
        tests:
          - not_null
      - name: descricao_funcao
        description: "Denominação oficial por extenso da função pública."
        tests:
          - not_null
      - name: categoria_exposicao
        description: "Classificação institucional da exposição política do cargo perante o COAF."
        tests:
          - not_null
      - name: grau_risco_pld
        description: "Grau de risco regulatório para fins de Prevenção à Lavagem de Dinheiro (CRITICO, ALTO, MODERADO)."
        tests:
          - not_null
      - name: is_pep_ativo
        description: "Indicador se as autoridades no estrato estão ativas ou sob carência regulatória."
        tests:
          - not_null
      - name: total_mandatos_registrados
        description: "Contagem total de registros de mandatos e tenures no estrato de agregação."
        tests:
          - not_null
      - name: total_titulares_pep
        description: "Quantidade distinta de titulares individuais de cargos PEP."
        tests:
          - not_null
      - name: total_titulares_pep_ativos
        description: "Quantidade distinta de titulares com mandato ou carência regulatória ativa."
        tests:
          - not_null
