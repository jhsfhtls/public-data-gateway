schema_version: 1.0.0
updated_at: '2026-11-07'
segments:
- segment_id: 01_b2b_empresarial
  name: Empresarial, Cadastral & Societário B2B
  description: Dados de mais de 55 milhões de CNPJs (matrizes, filiais, sócios QSA,
    capital social, CNAEs, situação cadastral, optantes pelo Simples Nacional e MEI).
- segment_id: 02_economico_macrofinanceiro
  name: Econômico, Monetário & Macrofinanceiro
  description: Séries macroeconômicas oficiais (IPCA, Selic, IGP-M), balanços contábeis
    trimestrais de instituições financeiras (IFData), cotações diárias de moedas (PTAX)
    e dados contábeis da CVM.
- segment_id: 03_demografico_censitario
  name: Demográfico, Censitário & Domiciliar
  description: Censo Demográfico 2022 em nível de 450.000 setores censitários, características
    de domicílios, PNAD Contínua (renda e trabalho) e PIB municipal do IBGE.
- segment_id: 04_trabalho_renda
  name: Trabalho, Emprego & Renda
  description: Fluxos mensais de contratações e demissões do Novo CAGED (salários
    de admissão por CBO e setor) e estoque de empregos da RAIS.
- segment_id: 05_geografico_logistica
  name: Geográfico, Logístico & Endereçamento
  description: 111+ milhões de coordenadas pontuais do CNEFE/IBGE, limites territoriais
    vetoriais, base de logradouros/CEPs e antenas de telecomunicação da Anatel.
- segment_id: 06_saude_publica
  name: Saúde Pública & Epidemiologia
  description: Registros de óbitos (SIM), nascimentos (SINASC), internações hospitalares
    (SIH/SUS), estabelecimentos de saúde (CNES) e preços regulados de medicamentos
    (CMED/ANVISA).
- segment_id: 07_educacao_capital_humano
  name: Educação & Capital Humano
  description: Infraestrutura de escolas e matrículas (Censo Escolar), universidades
    e cursos (Censo Superior), notas por escola (IDEB) e microdados do ENEM.
- segment_id: 08_judicial_compliance
  name: Judicial, Integridade & Compliance
  description: Metadados de processos de todos os 90+ tribunais do Brasil (CNJ DataJud),
    cadastros de inidôneos e punidos (CEIS/CNEP/CEPIM), autoridades (PEP) e certidões
    negativas (CNDT).
- segment_id: 09_comercio_exterior
  name: Comércio Exterior & Balança Comercial
  description: Exportações e importações detalhadas por NCM, valor FOB, peso líquido,
    modal de transporte e município do exportador (Comex Stat).
- segment_id: 10_compras_publicas
  name: Compras Públicas, Licitações & Contratos
  description: Repositório unificado da Lei nº 14.133/2021 (PNCP) com editais, atas
    e contratos de todos os entes federados e catálogo unificado CATMAT/CATSER.
- segment_id: 11_agronegocio_meio_ambiente
  name: Agronegócio, Terra & Meio Ambiente
  description: 7+ milhões de imóveis rurais com polígonos de reserva legal e APP (SICAR/CAR),
    desmatamento e alertas por satélite (INPE DETER/PRODES), uso da terra (MapBiomas)
    e zoneamento climático (ZARC).
- segment_id: 12_imobiliario_cartorial
  name: Imobiliário, Notarial & Cartorial
  description: Cadastro nacional de cartórios e produtividade (CNJ Justiça Aberta),
    transações registradas (ONR) e cadastros imobiliários municipais (IPTU/ITBI).
- segment_id: 13_metaportais_agregadores
  name: Metaportais & Hubs Agregadores
  description: Plataformas de facilitação técnica que unificam e padronizam centenas
    de fontes em protocolos únicos (Datalake Federado SQL, BrasilAPI, Dados.gov.br).
