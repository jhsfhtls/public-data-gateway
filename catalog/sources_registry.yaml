schema_version: 1.1.0
updated_at: '2026-11-18'
catalog_scope: UNIFIED_GOV_BR_AND_GLOBAL_PUBLIC_APIS
discovery_references:
- name: Conecta GOV.BR
  url: https://www.gov.br/conecta/catalogo/
  purpose: Auditoria de APIs governamentais brasileiras disponiveis para integracao
- name: Public APIs Directory
  url: https://github.com/public-apis/public-apis
  purpose: Descoberta curada de APIs publicas globais para Analytics e Machine Learning
public_api_blocks:
- block_id: BLOCO_1_KYC_GEO
  name: Enriquecimento Cadastral, Geolocalizacao, KYC/KYB & Antifraude
  description: Gateways de fallback em cascata para CNPJ/CEP, geocodificacao, idade de dominio, LEI global e inteligencia de IP/ASN.
- block_id: BLOCO_2_MERCADO_REGULATORIO
  name: Inteligencia de Mercado, Regulatorias, Economia & Governo
  description: Cotacoes B3/FIIs, cambio em tempo real, OData IPEA, CKAN ANEEL/ANP, Legislativo (Camara/Senado) e series globais (World Bank/OMS).
- block_id: BLOCO_3_ESPACIAL_CLIMA_ML
  name: Feature Engineering Espacial, Mobilidade, Clima & ML
  description: POIs em raio espacial (Overpass/OSM), matriz de rotas viarias (OSRM), clima/radiacao (Open-Meteo, NASA POWER), altitude (SRTM), inferencia NLP e feature stores.
- block_id: BLOCO_4_GLOBAL_PESQUISA
  name: Dados Globais, Demografia, Pesquisa & Sentimento
  description: Normalizacao ISO-3166 de paises, grafo cientifico aberto (OpenAlex) e monitoramento global de noticias/sentimento (GDELT).
already_homologated_gov_br:
- brasilapi_core
- cgu_ceis_cnep
- cgu_pep
- ibge_localidades
- ibge_censo2022
- ibge_pib_municipal
- ibge_sidra
- ibge_cnefe
- ibge_malhas
- ibge_pnad_continua
- bcb_sgs
- bcb_olinda_ptax
- bcb_ifdata
- pncp_contratacoes
- cvm_dfp_itr
- cvm_fundos
segments:
- segment_id: 01_b2b_empresarial
  name: Empresarial, Cadastral & Societário B2B
  description: Dados de mais de 55 milhões de CNPJs (matrizes, filiais, sócios QSA, capital social, CNAEs, situação cadastral, optantes pelo Simples Nacional e MEI).
- segment_id: 02_economico_macrofinanceiro
  name: Econômico, Monetário & Macrofinanceiro
  description: Séries macroeconômicas oficiais (IPCA, Selic, IGP-M), balanços contábeis trimestrais de instituições financeiras (IFData), cotações diárias de moedas (PTAX) e dados contábeis da CVM.
- segment_id: 03_demografico_censitario
  name: Demográfico, Censitário & Domiciliar
  description: Censo Demográfico 2022 em nível de 450.000 setores censitários, características de domicílios, PNAD Contínua (renda e trabalho) e PIB municipal do IBGE.
- segment_id: 04_trabalho_renda
  name: Trabalho, Emprego & Renda
  description: Fluxos mensais de contratações e demissões do Novo CAGED (salários de admissão por CBO e setor) e estoque de empregos da RAIS.
- segment_id: 05_geografico_logistica
  name: Geográfico, Logístico & Endereçamento
  description: 111+ milhões de coordenadas pontuais do CNEFE/IBGE, limites territoriais vetoriais, base de logradouros/CEPs e antenas de telecomunicação da Anatel.
- segment_id: 06_saude_publica
  name: Saúde Pública & Epidemiologia
  description: Registros de óbitos (SIM), nascimentos (SINASC), internações hospitalares (SIH/SUS), estabelecimentos de saúde (CNES) e preços regulados de medicamentos (CMED/ANVISA).
- segment_id: 07_educacao_capital_humano
  name: Educação & Capital Humano
  description: Infraestrutura de escolas e matrículas (Censo Escolar), universidades e cursos (Censo Superior), notas por escola (IDEB) e microdados do ENEM.
- segment_id: 08_judicial_compliance
  name: Judicial, Integridade & Compliance
  description: Metadados de processos de todos os 90+ tribunais do Brasil (CNJ DataJud), cadastros de inidôneos e punidos (CEIS/CNEP/CEPIM), autoridades (PEP) e certidões negativas (CNDT).
- segment_id: 09_comercio_exterior
  name: Comércio Exterior & Balança Comercial
  description: Exportações e importações detalhadas por NCM, valor FOB, peso líquido, modal de transporte e município do exportador (Comex Stat).
- segment_id: 10_compras_publicas
  name: Compras Públicas, Licitações & Contratos
  description: Repositório unificado da Lei nº 14.133/2021 (PNCP) com editais, atas e contratos de todos os entes federados e catálogo unificado CATMAT/CATSER.
- segment_id: 11_agronegocio_meio_ambiente
  name: Agronegócio, Terra & Meio Ambiente
  description: 7+ milhões de imóveis rurais com polígonos de reserva legal e APP (SICAR/CAR), desmatamento e alertas por satélite (INPE DETER/PRODES), uso da terra (MapBiomas) e zoneamento climático (ZARC).
- segment_id: 12_imobiliario_cartorial
  name: Imobiliário, Notarial & Cartorial
  description: Cadastro nacional de cartórios e produtividade (CNJ Justiça Aberta), transações registradas (ONR) e cadastros imobiliários municipais (IPTU/ITBI).
- segment_id: 13_metaportais_agregadores
  name: Metaportais & Hubs Agregadores
  description: Plataformas de facilitação técnica que unificam e padronizam centenas de fontes em protocolos únicos (Datalake Federado SQL, BrasilAPI, Dados.gov.br).
